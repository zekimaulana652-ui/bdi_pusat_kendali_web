        '<p class="panel-sub">Tiga RAB asli yang angkanya sudah dicocokkan oleh tiga perhitungan terpisah (Excel, kode, dan SQL). Hanya bisa dibaca; salin untuk dipakai.</p>' + table(ex, false) + '</section>';
      return html;
    },
    mount: function (root) {
      root.querySelector('[data-new]').addEventListener('click', function () { createDialog(null); });
    }
  };

  // ---------------------------------------------------------------------------
  // Form RAB

  function lineHtml(l, ro, participants) {
    var dis = ro ? ' disabled' : '';
    var peserta = l.qtyMode === 'peserta';
    var pid = 'l-' + l.id;
    return '<tr data-line="' + esc(l.id) + '">' +
      '<td class="cell-label"><label class="sr-only" for="' + pid + '-label">Uraian</label><input type="text" id="' + pid + '-label" data-f="label" value="' + esc(l.label) + '" maxlength="160" title="' + esc(l.label) + '"' + dis + '></td>' +
      '<td class="cell-pair"><div class="pair">' +
      '<label class="sr-only" for="' + pid + '-qty">Qty</label><input type="number" id="' + pid + '-qty" data-f="qty" class="in-n" min="0" step="any" inputmode="decimal" value="' + esc(peserta ? participants : l.qty) + '"' + (ro || peserta ? ' disabled' : '') + '>' +
      '<label class="sr-only" for="' + pid + '-unit">Satuan qty</label><input type="text" id="' + pid + '-unit" data-f="unit" class="in-u" value="' + esc(l.unit) + '" maxlength="20"' + (ro ? '' : ' placeholder="Sat."') + dis + '></div>' +
      '<label class="qty-mode" title="Qty mengikuti jumlah peserta"><input type="checkbox" id="' + pid + '-mode" data-f="qtyMode"' + (peserta ? ' checked' : '') + dis + '> = peserta</label></td>' +
      '<td class="cell-pair"><div class="pair">' +
      '<label class="sr-only" for="' + pid + '-dur">Durasi</label><input type="number" id="' + pid + '-dur" data-f="duration" class="in-n" min="0" step="any" inputmode="decimal" value="' + esc(l.duration) + '"' + dis + '>' +
      '<label class="sr-only" for="' + pid + '-du">Satuan durasi</label><input type="text" id="' + pid + '-du" data-f="durationUnit" class="in-u" list="dur-units" value="' + esc(l.durationUnit) + '" maxlength="20"' + (ro ? '' : ' placeholder="Sat."') + dis + '></div></td>' +
      '<td><label class="sr-only" for="' + pid + '-price">Harga satuan</label><input type="text" id="' + pid + '-price" data-f="unitPrice" data-money class="in-money" inputmode="numeric" value="' + UI.num(l.unitPrice) + '"' + dis + '></td>' +
      '<td><label class="sr-only" for="' + pid + '-kind">Sifat biaya</label><select id="' + pid + '-kind" data-f="kind" class="in-kind"' + dis + '><option value="tetap"' + (l.kind === 'tetap' ? ' selected' : '') + '>Tetap</option><option value="per_peserta"' + (l.kind === 'per_peserta' ? ' selected' : '') + '>Per peserta</option></select></td>' +
      '<td class="num nowrap" data-total>' + UI.rupiah(D.lineTotal({ qty: peserta ? participants : (Number(l.qty) || 0), duration: Number(l.duration) || 0, unitPrice: Number(l.unitPrice) || 0 })) + '</td>' +
      (ro ? '' : '<td><button type="button" class="icon-btn" data-del aria-label="Hapus baris ' + esc(l.label || 'tanpa nama') + '">Hapus</button></td>') +
      '</tr>';
  }

  function sectionsOf(rab) {
    var names = Store.SECTIONS.slice();
    rab.lines.forEach(function (l) { if (names.indexOf(l.section) === -1) names.push(l.section); });
    return names;
  }

  function sensitivity(rab, res) {
    if (res.participants <= 0 || res.revenue <= 0) return '<p class="muted small">Isi jumlah peserta dan harga untuk melihat sensitivitas.</p>';
    var cands = [res.participants];
    if (res.breakEvenParticipants) cands.push(res.breakEvenParticipants);
    if (res.targetParticipants) cands.push(res.targetParticipants);
    if (rab.quota) cands.push(rab.quota);
    var maxN = Math.max.apply(null, cands);
    var minN = Math.max(1, Math.min.apply(null, cands) - 2);
    var set = {};
    cands.forEach(function (n) { set[n] = true; });
    var range = maxN - minN;
    var step = Math.max(1, Math.ceil(range / 8));
    for (var n = minN; n <= maxN; n += step) set[n] = true;
    set[maxN] = true;
    var ns = Object.keys(set).map(Number).filter(function (x) { return x >= 1; }).sort(function (a, b) { return a - b; });
    var c = Number(rab.contingency) || 0;
    return '<table class="table table-compact"><thead><tr><th scope="col" class="num">Peserta</th><th scope="col" class="num">Margin</th><th scope="col" class="num">Profit</th></tr></thead><tbody>' +
      ns.map(function (k) {
        var p = D.projectAt(res, k, c);
        var ok = p.margin + 1e-9 >= rab.targetMargin;
        var tags = [];
        if (k === res.participants) tags.push('saat ini');
        if (rab.quota && k === rab.quota) tags.push('kuota');
        return '<tr' + (k === res.participants ? ' class="row-current"' : '') + '><td class="num">' + k + (tags.length ? ' <span class="small muted">(' + tags.join(', ') + ')</span>' : '') + '</td>' +
          '<td class="num ' + (ok ? 'num-good' : 'num-bad') + '">' + UI.pct(p.margin) + '</td><td class="num nowrap">' + UI.rupiah(p.profit) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function checkPanel(rab) {
    var res = D.computeRab(Store.rabInput(rab));
    var tm = Number(rab.targetMargin) || 0;
    var gap = (tm - res.margin) * 100;
    var verdict;
    if (res.revenue <= 0) verdict = 'Isi pendapatan (peserta dan harga) untuk menghitung margin.';
    else if (res.meetsTarget) verdict = 'Memenuhi target ' + UI.pct(tm) + '.';
    else verdict = 'Kurang ' + new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 }).format(gap) + ' poin dari target ' + UI.pct(tm) + '.';
    var cls = res.revenue <= 0 ? '' : res.meetsTarget ? ' ok' : ' bad';
    var row = function (k, v, strong) { return '<div' + (strong ? ' class="strong"' : '') + '><dt>' + k + '</dt><dd>' + v + '</dd></div>'; };
    var quota = rab.quota ? ' dari kuota ' + rab.quota : '';
    var tgt = res.targetParticipants === null
      ? (res.participants > 0 ? '<span class="num-bad">Tidak tercapai</span><div class="small muted">Harga rata-rata terlalu rendah dibanding biaya per peserta.</div>' : '–')
      : res.targetParticipants + ' peserta' + (rab.quota && res.targetParticipants > rab.quota ? ' <span class="num-bad">(melebihi kuota)</span>' : '');
    return '<div class="ch-hero' + cls + '"><p class="ch-label">Margin</p><p class="ch-value">' + UI.pct(res.margin) + '</p><p class="ch-verdict">' + esc(verdict) + '</p></div>' +
      '<dl class="ch-rows">' +
      row('Peserta', res.participants + quota) +
      row('Pendapatan', UI.rupiah(res.revenue)) +
      row('Biaya dasar', UI.rupiah(res.baseCost)) +
      row('Biaya tidak terduga (' + UI.pct(Number(rab.contingency) || 0) + ')', UI.rupiah(res.contingencyCost)) +
      row('Total biaya', UI.rupiah(res.totalCost), true) +
      row('Biaya per peserta', UI.rupiah(res.costPerParticipant)) +
      row('Profit/loss', '<span class="' + (res.profit < 0 ? 'num-bad' : '') + '">' + UI.rupiah(res.profit) + '</span>', true) +
      row('Profit per peserta', UI.rupiah(res.profitPerParticipant)) +
      '</dl>' +
      '<h4 class="ch-sub">Peserta minimal</h4><dl class="ch-rows">' +
      row('Titik impas', res.breakEvenParticipants === null ? '–' : res.breakEvenParticipants + ' peserta') +
      row('Untuk margin ' + UI.pct(tm), tgt) +
      row('Harga rata-rata minimum pada ' + res.participants + ' peserta', res.participants > 0 ? UI.rupiah(res.minAvgPriceForTarget) : '–') +
      '</dl>' +
      '<h4 class="ch-sub">Biaya tetap dan per peserta</h4><dl class="ch-rows">' +
      row('Biaya tetap', UI.rupiah(res.fixedCost)) + row('Biaya per peserta (total)', UI.rupiah(res.variableCost)) + '</dl>' +
      '<h4 class="ch-sub">Sensitivitas jumlah peserta</h4>' + sensitivity(rab, res) +
      '<p class="small muted ch-note">Asumsi: biaya tetap konstan, biaya per peserta naik sebanding jumlah peserta, harga rata-rata konstan.</p>';
  }

  function updateComputed(root, rab) {
    var input = Store.rabInput(rab);
    var participants = 0;
    input.revenue.forEach(function (r) { participants += r.participants; });
    rab.lines.forEach(function (l, i) {
      var tr = root.querySelector('tr[data-line="' + cssEsc(l.id) + '"]');
      if (!tr) return;
      tr.querySelector('[data-total]').textContent = UI.rupiah(D.lineTotal(input.lines[i]));
      if (l.qtyMode === 'peserta') {
        var q = tr.querySelector('[data-f=qty]');
        if (q) q.value = participants;
      }
    });
    var res = D.computeRab(input);
    root.querySelectorAll('[data-sec-total]').forEach(function (el) {
      el.textContent = UI.rupiah(res.sectionTotals[el.getAttribute('data-sec-total')] || 0);
    });
    rab.revenue.forEach(function (r, i) {
      var el = root.querySelector('[data-rev-total="' + i + '"]');
      if (el) el.textContent = UI.rupiah((Number(r.participants) || 0) * (Number(r.price) || 0));
    });
    var tot = root.querySelector('[data-rev-sum]');
    if (tot) tot.textContent = UI.rupiah(res.revenue);
    var tp = root.querySelector('[data-rev-part]');
    if (tp) tp.textContent = res.participants;
    var cp = root.querySelector('#rab-check');
    if (cp) cp.innerHTML = checkPanel(rab);
  }

  function cssEsc(s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }

  function pctVal(x) { return Math.round((Number(x) || 0) * 1000) / 10; }

  window.Pages.rabEdit = {
    title: function (ctx) {
      var r = Store.getRab(ctx.params.id);
      return r ? r.title : 'RAB tidak ditemukan';
    },
    render: function (ctx) {
      var rab = Store.getRab(ctx.params.id);
      if (!rab) return '<div class="empty"><h2>RAB tidak ditemukan</h2><p>RAB ini mungkin sudah dihapus.</p><p><a class="btn" href="#/rab">Lihat semua RAB</a></p></div>';
      var ro = !!rab.example;
      var b = rab.batchId ? Store.getBatch(rab.batchId) : null;
      var input = Store.rabInput(rab);
      var participants = 0;
      input.revenue.forEach(function (r) { participants += r.participants; });
      var res = D.computeRab(input);

      var html = '<p class="crumbs"><a href="#/rab">RAB</a></p>';
      html += '<header class="rab-head"><div class="rab-head-main">' +
        (ro ? '<h2 class="detail-title">' + esc(rab.title) + '</h2>'
          : '<label class="sr-only" for="r-title">Nama RAB</label><input type="text" id="r-title" class="title-input" value="' + esc(rab.title) + '" maxlength="120">') +
        '<p class="detail-meta">' + (b ? '<span>Batch <a href="#/batch/' + encodeURIComponent(b.id) + '">' + esc(b.label) + '</a></span><span>' + UI.scheduleText(b) + '</span>' : '<span>' + esc((Store.programMap[rab.program] || {}).short || '') + '</span>') +
        (rab.source ? '<span>' + esc(rab.source) + '</span>' : '') + '</p></div>' +
        '<div class="rab-head-actions"><button type="button" class="btn" data-copy>Salin ke batch 2027</button>' + (ro ? '' : '<button type="button" class="btn btn-danger-ghost" data-delete>Hapus RAB</button>') + '</div></header>';
      if (ro) html += '<div class="notice"><p><strong>RAB contoh, hanya bisa dibaca.</strong> ' + esc(rab.note || 'Angka ini nilai acuan yang sudah diverifikasi.') + '</p></div>';

      html += '<div class="rab-layout"><div class="rab-form">';

      // Pendapatan
      html += '<section class="panel"><h3 class="panel-title">Pendapatan</h3><div class="table-wrap"><table class="table table-input"><thead><tr><th scope="col">Kategori</th><th scope="col">Peserta</th><th scope="col">Harga per peserta</th><th scope="col" class="num">Jumlah</th></tr></thead><tbody>' +
        rab.revenue.map(function (r, i) {
          var id = 'rv-' + i;
          return '<tr data-rev="' + i + '"><th scope="row">' + TIER_LABEL[r.tier] + '</th>' +
            '<td><label class="sr-only" for="' + id + '-n">Peserta ' + TIER_LABEL[r.tier] + '</label><input type="number" id="' + id + '-n" data-rf="participants" class="in-sm" min="0" step="1" inputmode="numeric" value="' + (Number(r.participants) || 0) + '"' + (ro ? ' disabled' : '') + '></td>' +
            '<td><label class="sr-only" for="' + id + '-p">Harga ' + TIER_LABEL[r.tier] + '</label><input type="text" id="' + id + '-p" data-rf="price" data-money class="in-money" inputmode="numeric" value="' + UI.num(Number(r.price) || 0) + '"' + (ro ? ' disabled' : '') + '></td>' +
            '<td class="num nowrap" data-rev-total="' + i + '">' + UI.rupiah((Number(r.participants) || 0) * (Number(r.price) || 0)) + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><th scope="row">Total</th><td data-rev-part>' + res.participants + '</td><td></td><td class="num nowrap strong" data-rev-sum>' + UI.rupiah(res.revenue) + '</td></tr></tfoot></table></div></section>';

      // Bagian biaya
      html += '<datalist id="dur-units">' + DUR_UNITS.map(function (u) { return '<option value="' + esc(u) + '">'; }).join('') + '</datalist>';
      sectionsOf(rab).forEach(function (sec) {
        var lines = rab.lines.filter(function (l) { return l.section === sec; });
        html += '<section class="panel rab-sec"><div class="panel-head"><h3 class="panel-title">' + esc(sec) + '</h3><span class="sec-total" data-sec-total="' + esc(sec) + '">' + UI.rupiah(res.sectionTotals[sec] || 0) + '</span></div>';
        if (lines.length) {
          html += '<div class="table-wrap"><table class="table table-input table-rab"><thead><tr><th scope="col">Uraian</th><th scope="col">Qty, satuan</th><th scope="col">Durasi, satuan</th><th scope="col">Harga satuan</th><th scope="col">Sifat biaya</th><th scope="col" class="num">Total</th>' + (ro ? '' : '<th scope="col"><span class="sr-only">Hapus</span></th>') + '</tr></thead><tbody>' +
            lines.map(function (l) { return lineHtml(l, ro, participants); }).join('') + '</tbody></table></div>';
        } else {
          html += '<p class="muted small sec-empty">Belum ada baris di bagian ini.</p>';
        }
        if (!ro) html += '<button type="button" class="btn btn-ghost btn-sm" data-add="' + esc(sec) + '">Tambah baris ' + esc(sec.toLowerCase()) + '</button>';
        html += '</section>';
      });

      // Parameter
      html += '<section class="panel"><h3 class="panel-title">Parameter</h3><div class="form-grid">' +
        '<label class="field"><span>Biaya tidak terduga (%)</span><input type="number" id="r-cont" data-param="contingency" min="0" max="50" step="0.1" value="' + pctVal(rab.contingency) + '"' + (ro ? ' disabled' : '') + '></label>' +
        '<label class="field"><span>Target margin (%)</span><input type="number" id="r-target" data-param="targetMargin" min="0" max="90" step="0.1" value="' + pctVal(rab.targetMargin) + '"' + (ro ? ' disabled' : '') + '></label>' +
        '</div></section>';

      html += '</div><aside class="rab-check panel" aria-label="Cek target"><h3 class="panel-title">Cek target</h3><div id="rab-check" aria-live="polite">' + checkPanel(rab) + '</div></aside></div>';
      return html;
    },
    mount: function (root, ctx) {
      var rab = Store.getRab(ctx.params.id);
      if (!rab) return;
      var ro = !!rab.example;

      root.querySelector('[data-copy]').addEventListener('click', function () { createDialog(rab.batchId || null, rab.id); });
      var del = root.querySelector('[data-delete]');
      if (del) del.addEventListener('click', function () {
        UI.confirmDialog('Hapus RAB ini?', '"' + rab.title + '" akan dihapus permanen dari browser ini. Tindakan ini tidak bisa diurungkan.', 'Hapus RAB', function () {
          Store.deleteRab(rab.id);
          UI.toast('RAB dihapus.');
          window.location.hash = '#/rab';
        });
      });
      if (ro) return;

      var save = function () { Store.saveRab(rab); };

      var title = root.querySelector('#r-title');
      title.addEventListener('input', function () { rab.title = title.value.trim() || 'RAB tanpa nama'; save(); document.getElementById('page-title').textContent = rab.title; });

      // Format ribuan pada kolom uang saat kehilangan fokus
      root.addEventListener('focusout', function (e) {
        var t = e.target;
        if (t.hasAttribute && t.hasAttribute('data-money')) t.value = UI.num(UI.parseMoney(t.value));
      });

      root.addEventListener('input', function (e) {
        var t = e.target;
        var tr = t.closest('tr');
        if (t.hasAttribute('data-rf') && tr) {
          var r = rab.revenue[Number(tr.getAttribute('data-rev'))];
          if (t.getAttribute('data-rf') === 'participants') {
            var n = Number(t.value);
            var okN = t.value !== '' && isFinite(n) && n >= 0 && Math.floor(n) === n;
            t.classList.toggle('invalid', !okN && t.value !== '');
            r.participants = okN ? n : 0;
          } else {
            r.price = UI.parseMoney(t.value);
          }
          save(); updateComputed(root, rab);
          return;
        }
        if (t.hasAttribute('data-param')) {
          var v = Number(t.value);
          var max = Number(t.max);
          var ok = t.value !== '' && isFinite(v) && v >= 0 && v <= max;
          t.classList.toggle('invalid', !ok);
          if (ok) { rab[t.getAttribute('data-param')] = Math.round(v * 10) / 1000; save(); updateComputed(root, rab); }
          return;
        }
        if (t.hasAttribute('data-f') && tr) {
          var line = rab.lines.filter(function (l) { return l.id === tr.getAttribute('data-line'); })[0];
          if (!line) return;
          var f = t.getAttribute('data-f');
          if (f === 'label' || f === 'unit' || f === 'durationUnit') line[f] = t.value;
          else if (f === 'qty' || f === 'duration') {
            var x = Number(t.value);
            var okx = t.value !== '' && isFinite(x) && x >= 0;
            t.classList.toggle('invalid', !okx && t.value !== '');
            line[f] = okx ? x : 0;
          } else if (f === 'unitPrice') line.unitPrice = UI.parseMoney(t.value);
          save(); updateComputed(root, rab);
        }
      });

      root.addEventListener('change', function (e) {
        var t = e.target;
        var tr = t.closest('tr');
        if (!tr || !t.hasAttribute('data-f')) return;
        var line = rab.lines.filter(function (l) { return l.id === tr.getAttribute('data-line'); })[0];
        if (!line) return;
        var f = t.getAttribute('data-f');
        if (f === 'kind') { line.kind = t.value === 'per_peserta' ? 'per_peserta' : 'tetap'; save(); updateComputed(root, rab); }
        if (f === 'qtyMode') {
          line.qtyMode = t.checked ? 'peserta' : 'manual';
          var q = tr.querySelector('[data-f=qty]');
          var input = Store.rabInput(rab);
          var participants = 0;
          input.revenue.forEach(function (r) { participants += r.participants; });
          if (t.checked) { q.disabled = true; q.value = participants; }
          else { line.qty = participants; q.disabled = false; q.value = participants; }
          save(); updateComputed(root, rab);
        }
      });

      root.querySelectorAll('[data-add]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var sec = btn.getAttribute('data-add');
          var id = rab.id + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
          // Sisipkan setelah baris terakhir bagian yang sama supaya urutan tetap rapi.
          var idx = -1;
          rab.lines.forEach(function (l, i) { if (l.section === sec) idx = i; });
          var nl = { id: id, section: sec, label: '', qty: 1, qtyMode: 'manual', unit: '', duration: 1, durationUnit: '', unitPrice: 0, kind: 'tetap' };
          if (idx === -1) rab.lines.push(nl); else rab.lines.splice(idx + 1, 0, nl);
          save();
          ctx.refresh();
          var el = document.getElementById('l-' + id + '-label');
          if (el) el.focus();
        });
      });

      root.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var tr = btn.closest('tr');
          var id = tr.getAttribute('data-line');
          var line = rab.lines.filter(function (l) { return l.id === id; })[0];
          var doDelete = function () {
            rab.lines = rab.lines.filter(function (l) { return l.id !== id; });
            save();
            ctx.refresh();
            UI.toast('Baris dihapus.');
          };
          var total = D.lineTotal(Store.rabInput({ revenue: rab.revenue, lines: [line], contingency: 0, targetMargin: 0 }).lines[0]);
          if (total > 0 || line.label) UI.confirmDialog('Hapus baris ini?', '"' + (line.label || 'Baris tanpa nama') + '" (' + UI.rupiah(total) + ') akan dihapus dari RAB.', 'Hapus baris', doDelete);
          else doDelete();
        });
      });
    }
  };
})();

</script>
  <script>
/* js/pages/pengaturan.js */
/* Pengaturan: aturan jalur mundur, program mahal, default RAB, data lembaga, libur, cadangan data. */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var SEED = window.BDI_SEED;
  var esc = UI.esc;

  var RULE_FIELDS = [
    ['publishLeadDays', 'Surat registrasi harus ada paling lambat', 'hari kalender sebelum pelatihan (H-)', 'aturan', 7, 120],
    ['kemenkesServiceWD', 'Janji layanan Kemenkes', 'hari kerja setelah dokumen lengkap', 'sumber', 1, 60],
    ['revisionBufferWD', 'Buffer revisi', 'hari kerja', 'asumsi', 0, 30],
    ['signoffWD', 'Review dan tanda tangan', 'hari kerja', 'asumsi', 0, 30],
    ['draftWD', 'Penyusunan KAK v3, jadwal, dan daftar narasumber', 'hari kerja', 'asumsi', 0, 30],
    ['prepWD', 'Persiapan bahan (RAB final, narasumber)', 'hari kerja', 'asumsi', 0, 30],
    ['escalateBeforePublishWD', 'Hubungi PIC Kemenkes bila surat belum terbit', 'hari kerja sebelum publikasi', 'aturan', 0, 30],
    ['soonThresholdWD', 'Tandai "segera" bila tenggat berikutnya tinggal', 'hari kerja atau kurang', 'aturan', 0, 30],
    ['materiDaysBeforeEvent', 'Unggah materi paling lambat', 'hari kalender sebelum pelatihan (H-)', 'sumber', 0, 14]
  ];

  function intIn(v, lo, hi) {
    var n = Number(v);
    return v !== '' && isFinite(n) && Math.floor(n) === n && n >= lo && n <= hi ? n : null;
  }

  /** Cek apakah semua batch masih bisa dihitung dengan aturan baru (tanggal tidak keluar dari cakupan libur). */
  function failingBatches(rules, mahalH70, mahalLead, today) {
    var cal = Store.calendar();
    var fails = 0, first = '';
    Store.getBatches().forEach(function (b) {
      var r = JSON.parse(JSON.stringify(rules));
      if (mahalH70 && b.tier === 'mahal') r.publishLeadDays = mahalLead;
      try { D.evaluateBatch(b, today, r, cal); } catch (e) { fails++; if (!first) first = b.label + ': ' + e.message; }
    });
    return { count: fails, first: first };
  }

  function chainTotal(r) { return r.prepWD + r.draftWD + r.signoffWD + r.revisionBufferWD + r.kemenkesServiceWD; }

  window.Pages.pengaturan = {
    title: 'Pengaturan',
    render: function (ctx) {
      var s = Store.settings();
      var r = s.rules;
      var html = '';

      // Aturan
      html += '<section class="panel"><h3 class="panel-title">Aturan jalur mundur KAK</h3>' +
        '<p class="panel-sub">Hanya janji layanan Kemenkes yang bersumber resmi. Angka bertanda asumsi sebaiknya dikalibrasi dari data nyata (tanggal unggah sampai surat terbit) setelah 2 sampai 3 bulan.</p>' +
        '<form id="rules-form" class="rules" novalidate>';
      RULE_FIELDS.forEach(function (f) {
        html += '<div class="rule-row"><label for="rule-' + f[0] + '" class="rule-label">' + esc(f[1]) + '<span class="basis basis-' + f[3] + '">' + UI.BASIS_LABEL[f[3]] + '</span></label>' +
          '<div class="rule-input"><input type="number" id="rule-' + f[0] + '" name="' + f[0] + '" min="' + f[4] + '" max="' + f[5] + '" step="1" value="' + r[f[0]] + '" required><span class="muted small">' + esc(f[2]) + '</span></div></div>';
      });
      html += '<div class="rule-row"><label for="rule-overdue" class="rule-label">Ulangi pengingat terlambat setiap<span class="basis basis-aturan">Aturan BDI</span></label>' +
        '<div class="rule-input"><input type="number" id="rule-overdue" name="overdueRepeatWD" min="1" max="10" step="1" value="' + s.overdueRepeatWD + '" required><span class="muted small">hari kerja</span></div></div>';
      html += '<p class="rule-sum" id="rule-sum">Mulai KAK sampai surat registrasi: <strong>' + chainTotal(r) + ' hari kerja</strong>.</p>';
      html += '<p class="form-error" id="rules-error" role="alert" hidden></p>';
      html += '<div class="form-actions"><button type="submit" class="btn btn-primary">Simpan aturan</button><button type="button" class="btn btn-ghost" data-rules-default>Kembalikan nilai awal</button></div></form></section>';

      // Program mahal
      var nMahal = Store.getBatches().filter(function (b) { return b.tier === 'mahal'; }).length;
      html += '<section class="panel"><h3 class="panel-title">Program mahal (≥ Rp10 jt)</h3>' +
        '<p class="panel-sub">Keputusan terbuka milik Head Learning: bila penjualan program mahal dibuka H-70, surat registrasi perlu sudah ada saat itu, sehingga KAK harus naik sekitar H-97. Saat ini ' + nMahal + ' batch bertier mahal.</p>' +
        '<form id="mahal-form" class="form-grid" novalidate>' +
        '<label class="check field-wide"><input type="checkbox" id="mahal-on" name="on"' + (s.mahalH70 ? ' checked' : '') + '> Hitung jalur mundur program mahal dari tanggal publikasi berikut</label>' +
        '<label class="field"><span>Publikasi program mahal (H-)</span><input type="number" id="mahal-lead" name="lead" min="30" max="120" step="1" value="' + s.mahalLeadDays + '"></label>' +
        '<p class="form-error field-wide" id="mahal-error" role="alert" hidden></p>' +
        '<div class="form-actions field-wide"><button type="submit" class="btn btn-primary">Simpan</button></div></form></section>';

      // Default RAB
      html += '<section class="panel"><h3 class="panel-title">Nilai awal RAB baru</h3><form id="rabdef-form" class="form-grid" novalidate>' +
        '<label class="field"><span>Biaya tidak terduga (%)</span><input type="number" id="rd-cont" name="cont" min="0" max="50" step="0.1" value="' + Math.round(s.contingency * 1000) / 10 + '"></label>' +
        '<label class="field"><span>Target margin (%)</span><input type="number" id="rd-target" name="target" min="0" max="90" step="0.1" value="' + Math.round(s.targetMargin * 1000) / 10 + '"></label>' +
        '<p class="hint field-wide">Hanya berlaku untuk RAB yang dibuat setelah ini. RAB yang sudah ada punya parameternya sendiri.</p>' +
        '<p class="form-error field-wide" id="rabdef-error" role="alert" hidden></p>' +
        '<div class="form-actions field-wide"><button type="submit" class="btn btn-primary">Simpan</button></div></form></section>';

      // Lembaga
      var L = s.lembaga;
      var lf = function (name, label, wide, ph) {
        return '<label class="field' + (wide ? ' field-wide' : '') + '"><span>' + label + '</span><input type="text" id="lg-' + name + '" name="' + name + '" maxlength="200" value="' + esc(L[name]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></label>';
      };
      html += '<section class="panel"><h3 class="panel-title">Data lembaga untuk KAK</h3><p class="panel-sub">Dipakai mengisi butir penyelenggara, rekening (butir 21), dan PIC pengusul (butir 23) di setiap KAK.</p>' +
        '<form id="lembaga-form" class="form-grid" novalidate>' +
        lf('nama', 'Nama lembaga', true) + lf('akreditasi', 'Akreditasi', true) + lf('alamat', 'Alamat', true) + lf('kontak', 'Kontak', true) +
        lf('rekening', 'Nomor rekening lembaga', false, 'Bank, nomor, atas nama') + lf('picNama', 'Nama PIC pengusul', false) + lf('picWa', 'Nomor WhatsApp PIC', false, '08…') +
        '<div class="form-actions field-wide"><button type="submit" class="btn btn-primary">Simpan data lembaga</button></div></form></section>';

      // Libur
      var hol = Store.holidays();
      html += '<section class="panel"><h3 class="panel-title">Libur nasional dan cuti bersama <span class="count">' + hol.length + '</span></h3>' +
        '<p class="panel-sub">Cakupan data ' + UI.fmtDate(UI.coverage.from, 'med') + ' sampai ' + UI.fmtDate(UI.coverage.to, 'med') + '. ' + esc(SEED.holidayNote) + '</p>' +
        '<form id="hol-form" class="form-inline" novalidate>' +
        '<label class="field"><span>Tanggal</span><input type="date" id="hol-date" name="date" min="' + UI.coverage.from + '" max="' + UI.coverage.to + '" required></label>' +
        '<label class="field field-grow"><span>Nama</span><input type="text" id="hol-name" name="name" maxlength="120" required></label>' +
        '<label class="field"><span>Jenis</span><select id="hol-kind" name="kind"><option value="libur_nasional">Libur nasional</option><option value="cuti_bersama">Cuti bersama</option></select></label>' +
        '<button type="submit" class="btn">Tambah libur</button></form><p class="form-error" id="hol-error" role="alert" hidden></p>' +
        '<div class="table-wrap"><table class="table table-compact"><thead><tr><th scope="col">Tanggal</th><th scope="col">Nama</th><th scope="col">Jenis</th><th scope="col"><span class="sr-only">Aksi</span></th></tr></thead><tbody>' +
        hol.map(function (h, i) {
          return '<tr><td class="nowrap">' + UI.fmtDate(h.date, 'day') + '</td><td>' + esc(h.name) + '</td><td>' + (h.kind === 'cuti_bersama' ? 'Cuti bersama' : 'Libur nasional') + '</td>' +
            '<td class="right"><button type="button" class="link-btn link-danger" data-hol-del="' + i + '">Hapus</button></td></tr>';
        }).join('') + '</tbody></table></div></section>';

      // Cadangan
      html += '<section class="panel"><h3 class="panel-title">Cadangan data</h3>' +
        '<p class="panel-sub">Semua perubahan (tahap KAK, tanggal pasti, RAB, pengaturan) disimpan di browser ini saja. Unduh cadangan secara berkala atau untuk dipindahkan ke komputer lain.</p>' +
        '<div class="form-actions"><button type="button" class="btn" data-export>Unduh cadangan (.json)</button>' +
        '<label class="btn file-btn">Pulihkan dari cadangan<input type="file" id="import-file" accept="application/json,.json" class="sr-only"></label>' +
        '<button type="button" class="btn btn-danger-ghost" data-reset>Hapus semua perubahan</button></div></section>';
      return html;
    },
    mount: function (root, ctx) {
      var s = Store.settings();

      // Aturan
      var rf = root.querySelector('#rules-form');
      var rerr = root.querySelector('#rules-error');
      var readRules = function () {
        var out = {}, bad = null;
        RULE_FIELDS.forEach(function (f) {
          var v = intIn(rf.elements[f[0]].value, f[4], f[5]);
          rf.elements[f[0]].classList.toggle('invalid', v === null);
          if (v === null && !bad) bad = '"' + f[1] + '" harus bilangan bulat ' + f[4] + ' sampai ' + f[5] + '.';
          out[f[0]] = v;
        });
        var o = intIn(rf.elements.overdueRepeatWD.value, 1, 10);
        rf.elements.overdueRepeatWD.classList.toggle('invalid', o === null);
        if (o === null && !bad) bad = 'Pengulangan pengingat harus 1 sampai 10 hari kerja.';
        return { rules: out, overdue: o, error: bad };
      };
      rf.addEventListener('input', function () {
        var x = readRules();
        if (!x.error) root.querySelector('#rule-sum').innerHTML = 'Mulai KAK sampai surat registrasi: <strong>' + chainTotal(x.rules) + ' hari kerja</strong>.';
      });
      rf.addEventListener('submit', function (e) {
        e.preventDefault();
        var x = readRules();
        if (x.error) { rerr.textContent = x.error; rerr.hidden = false; return; }
        var fb = failingBatches(x.rules, s.mahalH70, s.mahalLeadDays, ctx.today);
        if (fb.count) { rerr.textContent = 'Dengan aturan ini ' + fb.count + ' batch tidak bisa dihitung (' + fb.first + ') Kurangi durasinya.'; rerr.hidden = false; return; }
        Store.setSettings({ rules: x.rules, overdueRepeatWD: x.overdue });
        UI.toast('Aturan disimpan. Semua tenggat dihitung ulang.');
        ctx.refresh();
      });
      root.querySelector('[data-rules-default]').addEventListener('click', function () {
        var d = Store.defaultSettings();
        Store.setSettings({ rules: d.rules, overdueRepeatWD: d.overdueRepeatWD });
        UI.toast('Aturan dikembalikan ke nilai awal.');
        ctx.refresh();
      });

      // Program mahal
      var mf = root.querySelector('#mahal-form');
      mf.addEventListener('submit', function (e) {
        e.preventDefault();
        var err = root.querySelector('#mahal-error');
        var lead = intIn(mf.elements.lead.value, 30, 120);
        if (lead === null) { err.textContent = 'Isi H- antara 30 dan 120.'; err.hidden = false; return; }
        var on = mf.elements.on.checked;
        var fb = failingBatches(s.rules, on, lead, ctx.today);
        if (fb.count) { err.textContent = 'Dengan pengaturan ini ' + fb.count + ' batch tidak bisa dihitung (' + fb.first + ')'; err.hidden = false; return; }
        Store.setSettings({ mahalH70: on, mahalLeadDays: lead });
        UI.toast(on ? 'Program mahal kini dihitung dari publikasi H-' + lead + '.' : 'Program mahal kembali memakai aturan umum.');
        ctx.refresh();
      });

      // Default RAB
      var df = root.querySelector('#rabdef-form');
      df.addEventListener('submit', function (e) {
        e.preventDefault();
        var err = root.querySelector('#rabdef-error');
        var c = Number(df.elements.cont.value), t = Number(df.elements.target.value);
        if (df.elements.cont.value === '' || !isFinite(c) || c < 0 || c > 50) { err.textContent = 'Biaya tidak terduga harus 0 sampai 50%.'; err.hidden = false; return; }
        if (df.elements.target.value === '' || !isFinite(t) || t < 0 || t > 90) { err.textContent = 'Target margin harus 0 sampai 90%.'; err.hidden = false; return; }
        Store.setSettings({ contingency: Math.round(c * 10) / 1000, targetMargin: Math.round(t * 10) / 1000 });
        UI.toast('Nilai awal RAB disimpan.');
        ctx.refresh();
      });

      // Lembaga
      var lf = root.querySelector('#lembaga-form');
      lf.addEventListener('submit', function (e) {
        e.preventDefault();
        var L = {};
        ['nama', 'akreditasi', 'alamat', 'kontak', 'rekening', 'picNama', 'picWa'].forEach(function (k) { L[k] = lf.elements[k].value.trim(); });
        Store.setSettings({ lembaga: L });
        UI.toast('Data lembaga disimpan.');
        ctx.refresh();
      });

      // Libur
      var hf = root.querySelector('#hol-form');
      hf.addEventListener('submit', function (e) {
        e.preventDefault();
        var err = root.querySelector('#hol-error');
        var d = hf.elements.date.value, name = hf.elements.name.value.trim(), kind = hf.elements.kind.value;
        if (!d || !D.isISODate(d) || d < UI.coverage.from || d > UI.coverage.to) { err.textContent = 'Pilih tanggal di dalam cakupan data.'; err.hidden = false; return; }
        if (!name) { err.textContent = 'Isi nama libur.'; err.hidden = false; return; }
        var list = Store.holidays().slice();
        if (list.some(function (h) { return h.date === d; })) { err.textContent = 'Tanggal ' + UI.fmtDate(d, 'med') + ' sudah ada di daftar.'; err.hidden = false; return; }
        list.push({ date: d, name: name, kind: kind });
        Store.setHolidays(list);
        UI.toast('Libur ditambahkan. Semua tenggat dihitung ulang.');
        ctx.refresh();
      });
      root.querySelectorAll('[data-hol-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var i = Number(btn.getAttribute('data-hol-del'));
          var h = Store.holidays()[i];
          if (!h) return;
          UI.confirmDialog('Hapus libur?', UI.fmtDate(h.date, 'long') + ' (' + h.name + ') akan dihitung sebagai hari kerja biasa.', 'Hapus libur', function () {
            var list = Store.holidays().filter(function (_, j) { return j !== i; });
            Store.setHolidays(list);
            UI.toast('Libur dihapus. Semua tenggat dihitung ulang.');
            ctx.refresh();
          });
        });
      });

      // Cadangan
      root.querySelector('[data-export]').addEventListener('click', function () {
        UI.download('bdi-pusat-kendali-cadangan-' + UI.localToday() + '.json', Store.exportJSON(), 'application/json', 'Cadangan diunduh.');
      });
      root.querySelector('#import-file').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var err = Store.importJSON(String(reader.result));
          if (err) UI.toast('Cadangan tidak dipulihkan: ' + err, 'error');
          else { UI.toast('Cadangan dipulihkan.'); ctx.refresh(); }
        };
        reader.onerror = function () { UI.toast('File tidak bisa dibaca.', 'error'); };
        reader.readAsText(file);
        e.target.value = '';
      });
      root.querySelector('[data-reset]').addEventListener('click', function () {
        UI.confirmDialog('Hapus semua perubahan?', 'Tahap KAK, tanggal pasti, RAB buatan sendiri, libur tambahan, dan pengaturan akan kembali ke data awal. Unduh cadangan dulu bila masih diperlukan.', 'Hapus semua perubahan', function () {
          Store.reset();
          UI.toast('Data dikembalikan ke kondisi awal.');
          ctx.refresh();
        });
      });
    }
  };
})();

</script>
  <script>
/* js/app.js */
/* Kerangka aplikasi: navigasi (hash), tanggal acuan, dan aksi bersama (memajukan tahap KAK). */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var esc = UI.esc;

  window.Pages = window.Pages || {};

  var NAV = [
    { path: '', label: 'Hari ini', page: 'hariIni' },
    { path: 'kak', label: 'Tracker KAK', page: 'kak' },
    { path: 'batch', label: 'Batch 2027', page: 'batch' },
    { path: 'kalender', label: 'Kalender', page: 'kalender' },
    { path: 'rab', label: 'RAB', page: 'rab' },
    { path: 'pengaturan', label: 'Pengaturan', page: 'pengaturan' }
  ];

  var App = {
    today: null,
    realToday: null,
    todayNote: '',
    ui: {},
    current: null
  };

  function clampToCoverage(d) {
    if (d < UI.coverage.from) return UI.coverage.from;
    if (d > UI.coverage.to) return UI.coverage.to;
    return d;
  }

  function initToday() {
    App.realToday = UI.localToday();
    App.today = clampToCoverage(App.realToday);
    if (App.today !== App.realToday) {
      App.todayNote = 'Hari ini (' + UI.fmtDate(App.realToday, 'med') + ') di luar cakupan data libur. Tanggal acuan diatur ke ' + UI.fmtDate(App.today, 'med') + '. Perbarui daftar libur di Pengaturan.';
    }
  }

  // ---------------------------------------------------------------------------
  // Routing

  function parseHash() {
    var h = window.location.hash.replace(/^#\/?/, '');
    var q = '';
    var qi = h.indexOf('?');
    if (qi !== -1) { q = h.slice(qi + 1); h = h.slice(0, qi); }
    var seg = h.split('/').filter(Boolean).map(function (s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    });
    return { seg: seg, query: new URLSearchParams(q) };
  }

  function resolve(route) {
    var s = route.seg;
    if (s.length === 0) return { page: 'hariIni', params: {} };
    if (s[0] === 'kak' && s.length === 1) return { page: 'kak', params: {} };
    if (s[0] === 'batch' && s.length === 1) return { page: 'batch', params: {} };
    if (s[0] === 'batch' && s.length >= 2) return { page: 'batchDetail', params: { id: s[1], tab: s[2] || 'ringkasan' } };
    if (s[0] === 'kalender') return { page: 'kalender', params: {} };
    if (s[0] === 'rab' && s.length === 1) return { page: 'rab', params: {} };
    if (s[0] === 'rab' && s.length >= 2) return { page: 'rabEdit', params: { id: s[1] } };
    if (s[0] === 'pengaturan') return { page: 'pengaturan', params: {} };
    return { page: 'notFound', params: {} };
  }

  function navKeyFor(page) {
    if (page === 'batchDetail') return 'batch';
    if (page === 'rabEdit') return 'rab';
    return page;
  }

  function renderNav(activePage) {
    var key = navKeyFor(activePage);
    var reminders = UI.remindersToday(App.today).length;
    var html = NAV.map(function (n) {
      var active = n.page === key;
      var count = n.page === 'hariIni' && reminders > 0 ? '<span class="nav-count" aria-label="' + reminders + ' pengingat">' + reminders + '</span>' : '';
      return '<li><a href="#/' + n.path + '"' + (active ? ' aria-current="page" class="active"' : '') + '>' + esc(n.label) + count + '</a></li>';
    }).join('');
    document.getElementById('nav-list').innerHTML = html;
  }

  function renderTopbar(title) {
    document.getElementById('page-title').textContent = title;
    var input = document.getElementById('acuan');
    input.min = UI.coverage.from;
    input.max = UI.coverage.to;
    input.value = App.today;
    var reset = document.getElementById('acuan-reset');
    reset.hidden = App.today === clampToCoverage(App.realToday);
    var note = document.getElementById('global-note');
    var msgs = [];
    if (App.todayNote) msgs.push(App.todayNote);
    if (App.today !== clampToCoverage(App.realToday)) msgs.push('Mode simulasi: semua hitungan memakai tanggal acuan ' + UI.fmtDate(App.today, 'long') + ', bukan hari ini.');
    if (!Store.storageOk()) msgs.push('Browser ini tidak mengizinkan penyimpanan lokal. Perubahan hanya bertahan sampai halaman ditutup; unduh cadangan di Pengaturan.');
    note.innerHTML = msgs.map(function (m) { return '<p>' + esc(m) + '</p>'; }).join('');
    note.hidden = msgs.length === 0;
  }

  function render(opts) {
    var route = parseHash();
    var r = resolve(route);
    var page = window.Pages[r.page] || window.Pages.notFound;
    var main = document.getElementById('main');
    var keepScroll = opts && opts.keepScroll;
    var scrollY = window.scrollY;
    var focusId = keepScroll && document.activeElement && document.activeElement.id && main.contains(document.activeElement) ? document.activeElement.id : null;
    var ctx = {
      today: App.today,
      params: r.params,
      query: route.query,
      ui: App.ui,
      refresh: function () { render({ keepScroll: true }); },
      go: function (hash) { window.location.hash = hash; }
    };
    App.current = r.page;
    var title;
    try {
      title = typeof page.title === 'function' ? page.title(ctx) : page.title;
      // Wadah baru tiap render, supaya event listener halaman lama ikut hilang (tidak menumpuk).
      var root = document.createElement('div');
      root.className = 'page page-' + r.page;
      root.innerHTML = page.render(ctx);
      main.replaceChildren(root);
      if (page.mount) page.mount(root, ctx);
    } catch (e) {
      title = 'Terjadi kesalahan';
      main.innerHTML = '<div class="empty"><h2>Halaman tidak bisa ditampilkan</h2><p>' + esc(e.message) + '</p><p><a href="#/">Kembali ke Hari ini</a></p></div>';
      if (window.console) console.error(e);
    }
    renderTopbar(title || 'BDI Pusat Kendali');
    renderNav(r.page);
    document.title = (title ? title + ' – ' : '') + 'BDI Pusat Kendali';
    document.body.classList.remove('nav-open');
    if (keepScroll) {
      window.scrollTo(0, scrollY);
      if (focusId) {
        var again = document.getElementById(focusId);
        if (again) { try { again.focus({ preventScroll: true }); } catch (e) { again.focus(); } }
      }
    } else {
      window.scrollTo(0, 0);
      var h = main.querySelector('h1, h2');
      if (h && opts && opts.focus) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
  }

  App.refresh = function () { render({ keepScroll: true }); };

  // ---------------------------------------------------------------------------
  // Aksi bersama: memajukan tahap KAK satu langkah

  App.advanceStage = function (batchId, onDone) {
    var b = Store.getBatch(batchId);
    if (!b) return;
    var stage = D.stageOf(b);
    var act = UI.STAGE_ACTION[stage];
    if (!act) return;
    var prevField = null;
    var idx = Store.STAGE_FIELDS.indexOf(act.field);
    for (var i = idx - 1; i >= 0; i--) { if (b[Store.STAGE_FIELDS[i]]) { prevField = Store.STAGE_FIELDS[i]; break; } }
    var minDate = prevField ? b[prevField] : UI.coverage.from;
    var defDate = App.today < minDate ? minDate : App.today;
    var isLetter = act.field === 'registrationLetterAt';
    var body =
      '<p class="dlg-lead">' + esc(b.label) + ': ' + esc(b.programName) + '</p>' +
      '<label class="field"><span>Tanggal ' + esc(UI.FIELD_LABEL[act.field].toLowerCase()) + '</span>' +
      '<input type="date" name="date" required value="' + esc(defDate) + '" min="' + esc(minDate) + '" max="' + esc(App.today < minDate ? minDate : App.today) + '"></label>' +
      (isLetter ? '<label class="field"><span>Nomor surat registrasi</span><input type="text" name="no" autocomplete="off" placeholder="Contoh: PL.02.03/F/…" maxlength="120"></label>' : '') +
      (prevField ? '<p class="hint">Tidak boleh sebelum ' + esc(UI.FIELD_LABEL[prevField].toLowerCase()) + ' (' + UI.fmtDate(b[prevField], 'med') + ') dan tidak boleh setelah tanggal acuan.</p>' : '<p class="hint">Tidak boleh setelah tanggal acuan.</p>');
    UI.dialog({
      title: act.label,
      body: body,
      submitLabel: act.label,
      onSubmit: function (form) {
        var d = form.elements.date.value;
        if (!d || !D.isISODate(d)) return 'Isi tanggal dengan benar.';
        if (d < UI.coverage.from || d > UI.coverage.to) return 'Tanggal harus di antara ' + UI.fmtDate(UI.coverage.from, 'med') + ' dan ' + UI.fmtDate(UI.coverage.to, 'med') + '.';
        if (d < minDate) return 'Tanggal tidak boleh sebelum ' + UI.fmtDate(minDate, 'med') + '.';
        if (d > App.today && d > minDate) return 'Tanggal tidak boleh setelah tanggal acuan (' + UI.fmtDate(App.today, 'med') + ').';
        var patch = {};
        patch[act.field] = d;
        if (isLetter) patch.registrationNo = form.elements.no.value.trim();
        Store.updateBatch(batchId, patch);
        var nb = Store.getBatch(batchId);
        UI.toast(act.done + ': ' + nb.label + ' sekarang di tahap ' + UI.STAGE_LABEL[D.stageOf(nb)] + '.');
        if (onDone) onDone(); else App.refresh();
      }
    });
  };

  // ---------------------------------------------------------------------------
  // Halaman tidak ditemukan

  window.Pages.notFound = {
    title: 'Halaman tidak ditemukan',
    render: function () {
      return '<div class="empty"><h2>Halaman ini tidak ada</h2><p>Alamatnya mungkin salah ketik atau datanya sudah dihapus.</p><p><a class="btn" href="#/">Buka Hari ini</a></p></div>';
    }
  };

  // ---------------------------------------------------------------------------
  // Mulai

  function start() {
    initToday();
    document.getElementById('acuan').addEventListener('change', function (e) {
      var v = e.target.value;
      if (!v || !D.isISODate(v)) { e.target.value = App.today; return; }
      var c = clampToCoverage(v);
      if (c !== v) UI.toast('Tanggal acuan dibatasi ke cakupan data libur.', 'error');
      App.today = c;
      render({ keepScroll: true });
    });
    document.getElementById('acuan-reset').addEventListener('click', function () {
      App.today = clampToCoverage(App.realToday);
      render({ keepScroll: true });
    });
    document.getElementById('menu-btn').addEventListener('click', function () {
      var open = document.body.classList.toggle('nav-open');
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.getElementById('nav-scrim').addEventListener('click', function () {
      document.body.classList.remove('nav-open');
      document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
        document.body.classList.remove('nav-open');
        document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
      }
    });
    // Tutup dialog bila klik di luar kotak dialog.
    var dlg = document.getElementById('dlg');
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    window.addEventListener('hashchange', function () { render({ focus: true }); });
    render();
  }

  window.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
