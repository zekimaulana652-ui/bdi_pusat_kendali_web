              ? 'KAK terlambat: unggah ke Kemenkes seharusnya ' + ms('UPLOAD').due + '. Perkiraan surat ' + projected + ', jendela pemasaran ' + marketingWindowDays + ' hari.'
              : 'Unggah ke Kemenkes paling lambat ' + ms('UPLOAD').due + ' (' + nl + ' hari kerja lagi).';
            break;
          case 'terupload':
            message = delayWD > 0
              ? 'Diunggah ' + b.kakUploadedAt + ', tetapi sudah melewati batas ' + ms('UPLOAD').due + ': perkiraan surat ' + projected + ', jendela pemasaran ' + marketingWindowDays + ' hari.'
              : 'Menunggu Kemenkes. Perkiraan surat registrasi ' + projected + '.';
            break;
          case 'dokumen_lengkap':
            message = 'Dokumen dinyatakan lengkap ' + b.kemenkesCompleteAt + '. Perkiraan surat ' + projected + '.';
            break;
          case 'teregistrasi':
            message = 'Surat registrasi diterima ' + b.registrationLetterAt + ': publikasikan sekarang (jendela pemasaran ' + marketingWindowDays + ' hari).';
            break;
          default:
            message = 'Dipublikasikan ' + b.publishedAt + ': jendela pemasaran ' + marketingWindowDays + ' hari.';
        }
        return {
          id: b.id, stage: stage, plan: plan, eventStartAssumed: assumed, next: next, risk: risk,
          projectedLetter: projected, delayWD: delayWD, marketingWindowDays: marketingWindowDays, message: message
        };
      }

      // ---------------------------------------------------------------------------
      // 3. Pengingat harian (reminders.ts)

      var OPEN = {
        belum_mulai: ['KICKOFF', 'PREP_DONE', 'DRAFT_DONE', 'UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        penyusunan: ['DRAFT_DONE', 'UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        review: ['UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        terupload: ['KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        dokumen_lengkap: ['ESCALATE', 'PUBLISH'],
        teregistrasi: ['PUBLISH'],
        dipublikasikan: []
      };

      function findRule(cfg, code) {
        for (var i = 0; i < cfg.rules.length; i++) if (cfg.rules[i].code === code) return cfg.rules[i];
        return null;
      }

      function remindersForDate(evaluations, today, cfg, cal) {
        var out = [];
        evaluations.forEach(function (item) {
          var label = item.label;
          var ev = item.ev;
          var open = OPEN[ev.stage];
          var ordered = ev.plan.milestones.filter(function (m) { return open.indexOf(m.code) !== -1; });
          var blocking = null;
          for (var i = 0; i < ordered.length; i++) {
            if (workingDaysBetween(today, ordered[i].due, cal) < 0) { blocking = ordered[i]; break; }
          }
          if (blocking) {
            var rule = findRule(cfg, blocking.code);
            var left = workingDaysBetween(today, blocking.due, cal);
            if (rule && (-left) % cfg.overdueRepeatWD === 0) {
              out.push({
                batchId: ev.id, code: blocking.code, due: blocking.due, workingDaysLeft: left, to: rule.to, kind: 'terlambat',
                message: '[TERLAMBAT ' + (-left) + ' hari kerja] ' + label + ': ' + blocking.title + ' (tenggat ' + blocking.due + '). ' + ev.message
              });
            }
            return;
          }
          ordered.forEach(function (m) {
            var r = findRule(cfg, m.code);
            if (!r) return;
            var l = workingDaysBetween(today, m.due, cal);
            if (r.beforeWD.indexOf(l) !== -1) {
              var kind = l === 0 ? 'jatuh_tempo' : 'pengingat';
              var when = l === 0 ? 'HARI INI' : l + ' hari kerja lagi (' + m.due + ')';
              out.push({ batchId: ev.id, code: m.code, due: m.due, workingDaysLeft: l, to: r.to, kind: kind, message: label + ': ' + m.title + '. Tenggat ' + when + '.' });
            }
          });
        });
        return out;
      }

      // ---------------------------------------------------------------------------
      // 4. RAB dan target margin (rab.ts)

      function lineTotal(l) { return l.qty * l.duration * l.unitPrice; }
      function round6(x) { return Math.round(x * 1e6) / 1e6; }
      function round2(x) { return Math.round(x * 100) / 100; }

      function minParticipants(F, v, P, c, m) {
        if (P <= 0) return null;
        var den = (1 - m) * P - v * (1 + c);
        if (den <= 0) return null;
        return Math.ceil(round6((F * (1 + c)) / den));
      }

      function computeRab(input) {
        var participants = 0, revenue = 0;
        input.revenue.forEach(function (r) { participants += r.participants; revenue += r.participants * r.price; });
        var sectionTotals = {};
        var baseCost = 0, F = 0, V = 0;
        input.lines.forEach(function (l) {
          var t = lineTotal(l);
          baseCost += t;
          sectionTotals[l.section] = (sectionTotals[l.section] || 0) + t;
          if (l.kind === 'tetap') F += t; else V += t;
        });
        var c = input.contingency;
        var contingencyCost = baseCost * c;
        var totalCost = baseCost + contingencyCost;
        var profit = revenue - totalCost;
        var margin = revenue > 0 ? profit / revenue : 0;
        var P = participants > 0 ? revenue / participants : 0;
        var v = participants > 0 ? V / participants : 0;
        return {
          participants: participants, revenue: revenue, baseCost: baseCost, contingencyCost: contingencyCost,
          totalCost: totalCost, costPerParticipant: participants > 0 ? totalCost / participants : 0,
          profit: profit, profitPerParticipant: participants > 0 ? profit / participants : 0,
          margin: margin, sectionTotals: sectionTotals, fixedCost: F, variableCost: V,
          avgRevenuePerParticipant: P, variableCostPerParticipant: v,
          breakEvenParticipants: participants > 0 ? minParticipants(F, v, P, c, 0) : null,
          targetParticipants: participants > 0 ? minParticipants(F, v, P, c, input.targetMargin) : null,
          minAvgPriceForTarget: participants > 0 ? ((F + V) * (1 + c)) / (participants * (1 - input.targetMargin)) : 0,
          meetsTarget: revenue > 0 && round6(margin - input.targetMargin) >= 0
        };
      }

      function projectAt(result, n, c) {
        var P = result.avgRevenuePerParticipant;
        var v = result.variableCostPerParticipant;
        var rev = P * n;
        var cost = (result.fixedCost + v * n) * (1 + c);
        return { n: n, revenue: rev, totalCost: cost, profit: rev - cost, margin: rev > 0 ? (rev - cost) / rev : 0 };
      }

      // ---------------------------------------------------------------------------
      // 5. File kalender .ics (ics.ts)

      function icsEscape(s) {
        return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
      }

      function fold(line) {
        if (line.length <= 75) return line;
        var parts = [line.slice(0, 75)];
        for (var i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
        return parts.join('\r\n');
      }

      function toICS(events, opts) {
        var ymd = function (d) { return d.replace(/-/g, ''); };
        var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BDI Pusat Kendali//KAK//ID', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:' + icsEscape(opts.calName)];
        events.forEach(function (e) {
          lines.push(
            'BEGIN:VEVENT', 'UID:' + icsEscape(e.uid), 'DTSTAMP:' + opts.stamp,
            'DTSTART;VALUE=DATE:' + ymd(e.date), 'DTEND;VALUE=DATE:' + ymd(addDays(e.date, 1)),
            'SUMMARY:' + icsEscape(e.summary)
          );
          if (e.description) lines.push('DESCRIPTION:' + icsEscape(e.description));
          lines.push('TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(e.summary), 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        return lines.map(fold).join('\r\n') + '\r\n';
      }

      // ---------------------------------------------------------------------------
      // 6. Validasi tautan berkas (tautan.ts)

      function periksaTautan(url) {
        var u = String(url || '').trim();
        if (u === '') return { valid: false, penyedia: null, pesan: 'Tautan kosong.' };
        if (/\s/.test(u)) return { valid: false, penyedia: null, pesan: 'Tautan mengandung spasi atau baris baru (biasanya terpotong saat disalin).' };
        var m = /^https:\/\/([a-z0-9.-]+)(\/[^\s]*)?$/i.exec(u);
        if (!m) return { valid: false, penyedia: null, pesan: 'Tautan harus diawali https:// dan berisi alamat yang lengkap.' };
        var host = m[1].toLowerCase();
        var penyedia = host === 'drive.google.com' ? 'google_drive' : host === 'docs.google.com' ? 'google_docs' : 'lainnya';
        return { valid: true, penyedia: penyedia, pesan: null };
      }

      // ---------------------------------------------------------------------------
      // 7. Absensi peserta per JPL (kehadiran.ts)

      var MENIT_PER_JPL = 45;
      function jpl(menit) { return menit / MENIT_PER_JPL; }

      function fraksiHadir(c, sesi) {
        if (c.status !== 'hadir' && c.status !== 'terlambat') return 0;
        if (c.menitHadir === undefined || c.menitHadir === null || c.menitHadir === '') return 1;
        return Math.min(1, Math.max(0, Number(c.menitHadir) / sesi.menit));
      }

      function hitungKehadiran(sesi, catatan, pesertaIds) {
        var jplTotal = sesi.reduce(function (s, x) { return s + jpl(x.menit); }, 0);
        var bySesi = {};
        sesi.forEach(function (s) { bySesi[s.id] = s; });
        var idx = {};
        catatan.forEach(function (c) {
          if (!bySesi[c.sesiId]) return;
          idx[c.pesertaId + '\u0000' + c.sesiId] = c;
        });
        return pesertaIds.map(function (p) {
          var hadir = 0, belum = 0, alpa = 0;
          sesi.forEach(function (s) {
            var c = idx[p + '\u0000' + s.id];
            if (!c) { belum++; return; }
            if (c.status === 'alpa') alpa++;
            hadir += jpl(s.menit) * fraksiHadir(c, s);
          });
          return {
            pesertaId: p,
            jplTotal: round6(jplTotal),
            jplHadir: round6(hadir),
            persen: jplTotal > 0 ? round6(hadir / jplTotal) : 0,
            belumDicatat: belum,
            alpa: alpa
          };
        });
      }

      function memenuhiKehadiran(persen, minimal) { return round6(persen) >= round6(minimal); }

      var JENDELA_DEFAULT = { bukaSebelumMenit: 15, terlambatSetelahMenit: 15, tutupSetelahMenit: 30 };

      function jendelaAbsen(mulaiMs, selesaiMs, sekarangMs, a) {
        var cfg = a || JENDELA_DEFAULT;
        var m = 60000;
        if (sekarangMs < mulaiMs - cfg.bukaSebelumMenit * m) return 'belum_dibuka';
        if (sekarangMs > selesaiMs + cfg.tutupSetelahMenit * m) return 'ditutup';
        if (sekarangMs > mulaiMs + cfg.terlambatSetelahMenit * m) return 'terlambat';
        return 'terbuka';
      }

      function statusDariJendela(j) {
        return j === 'terbuka' ? 'hadir' : j === 'terlambat' ? 'terlambat' : null;
      }

      // ---------------------------------------------------------------------------
      // 8. Penilaian, kelulusan & kepuasan (penilaian.ts)

      var ATURAN_DEFAULT = { nilaiMinimal: 80, kehadiranMin: 0.8, maksRemedial: 5 };

      function validasiPembobotan(komponen, nilaiMinimal) {
        var err = [];
        var total = komponen.reduce(function (s, k) { return s + Number(k.bobot || 0); }, 0);
        if (Math.abs(total - 100) > 1e-9) err.push('V02: total bobot ' + total + ', harus 100');
        if (nilaiMinimal < 70) err.push('V01: nilai minimal kelulusan ' + nilaiMinimal + ' < 70');
        komponen.forEach(function (k) {
          if (k.nilaiMin < 70) err.push('V01: nilai minimal komponen ' + k.nama + ' (' + k.nilaiMin + ') < 70');
          if (k.bobot <= 0) err.push('bobot komponen ' + k.nama + ' harus > 0');
        });
        return err;
      }

      function terakhirNilai(nilai) {
        var m = {};
        nilai.forEach(function (n) {
          var cur = m[n.komponenId];
          if (!cur || n.percobaan > cur.percobaan) m[n.komponenId] = n;
        });
        return m;
      }

      function hitungKelulusan(komponen, nilai, kehadiranPersen, aturan) {
        var a = aturan || ATURAN_DEFAULT;
        var t = terakhirNilai(nilai);
        var belum = komponen.filter(function (k) { return !t[k.id]; }).map(function (k) { return k.id; });
        if (belum.length) return { status: 'belum_lengkap', nilaiAkhir: null, alasan: null, belumDinilai: belum, perluRemedial: [] };
        var nilaiAkhir = round2(komponen.reduce(function (s, k) { return s + (k.bobot * t[k.id].skor) / 100; }, 0));
        if (!memenuhiKehadiran(kehadiranPersen, a.kehadiranMin)) {
          return { status: 'tidak_lulus', nilaiAkhir: nilaiAkhir, alasan: 'kehadiran', belumDinilai: [], perluRemedial: [] };
        }
        var gagal = komponen.filter(function (k) { return t[k.id].skor < k.nilaiMin; });
        if (gagal.length === 0 && nilaiAkhir >= a.nilaiMinimal) {
          return { status: 'lulus', nilaiAkhir: nilaiAkhir, alasan: null, belumDinilai: [], perluRemedial: [] };
        }
        var terpakai = function (k) { return t[k.id].percobaan - 1; };
        var kandidat = gagal.length ? gagal : komponen;
        var habis = gagal.length
          ? gagal.some(function (k) { return terpakai(k) >= a.maksRemedial; })
          : komponen.every(function (k) { return terpakai(k) >= a.maksRemedial; });
        if (habis) return { status: 'tidak_lulus', nilaiAkhir: nilaiAkhir, alasan: 'remedial_habis', belumDinilai: [], perluRemedial: [] };
        return {
          status: 'remedial', nilaiAkhir: nilaiAkhir, alasan: 'nilai', belumDinilai: [],
          perluRemedial: kandidat.filter(function (k) { return terpakai(k) < a.maksRemedial; }).map(function (k) { return k.id; })
        };
      }

      function nGain(pre, post) {
        if (pre === null || pre === undefined || post === null || post === undefined || !isFinite(pre) || !isFinite(post)) return null;
        if (pre >= 100) return null;
        return Math.round(((post - pre) / (100 - pre)) * 10000) / 10000;
      }

      function ringkasanKelas(hasil) {
        var c = function (s) { return hasil.filter(function (h) { return h.kelulusan.status === s; }).length; };
        var lengkap = hasil.length - c('belum_lengkap');
        var nilai = hasil.map(function (h) { return h.kelulusan.nilaiAkhir; }).filter(function (x) { return x !== null; });
        var avg = function (arr) { return arr.length ? round2(arr.reduce(function (s, x) { return s + x; }, 0) / arr.length) : null; };
        return {
          peserta: hasil.length,
          lulus: c('lulus'), remedial: c('remedial'), tidakLulus: c('tidak_lulus'), belumLengkap: c('belum_lengkap'),
          persenLulus: lengkap ? Math.round((c('lulus') / lengkap) * 10000) / 100 : null,
          rataNilaiAkhir: avg(nilai),
          rataKehadiran: avg(hasil.map(function (h) { return h.kehadiran * 100; }))
        };
      }

      function ringkasanKepuasan(jawaban, aspek) {
        var rata = {};
        aspek.forEach(function (a) {
          var v = jawaban.map(function (j) { return j[a]; }).filter(function (x) { return typeof x === 'number' && isFinite(x); });
          if (v.some(function (x) { return x < 1 || x > 5; })) throw new Error('Skor aspek ' + a + ' di luar 1..5');
          if (v.length) rata[a] = round2(v.reduce(function (s, x) { return s + x; }, 0) / v.length);
        });
        var keys = Object.keys(rata);
        var per = jawaban.map(function (j) {
          var v = aspek.map(function (a) { return j[a]; }).filter(function (x) { return typeof x === 'number' && isFinite(x); });
          return v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : null;
        }).filter(function (x) { return x !== null; });
        return {
          responden: jawaban.length,
          rata: rata,
          rataKeseluruhan: keys.length ? round2(keys.reduce(function (s, k) { return s + rata[k]; }, 0) / keys.length) : null,
          persenPuas: per.length ? Math.round((per.filter(function (x) { return x >= 4; }).length / per.length) * 10000) / 100 : null
        };
      }

      // ---------------------------------------------------------------------------
      // 9. Materi H-1 & Penugasan (materi.ts)

      function kekuranganMateri(sesiIds, items, syarat) {
        var req = syarat || 'final';
        var rank = { belum: 0, draf: 1, final: 2, diunggah: 3 };
        var ok = function (i) { return (rank[i.status] || 0) >= (rank[req] || 0); };
        var out = [];
        sesiIds.forEach(function (s) {
          if (!items.some(function (i) { return i.sesiId === s && (i.jenis === 'bahan_tayang' || i.jenis === 'modul') && ok(i); })) {
            out.push({ sesiId: s, butuh: 'bahan_tayang_atau_modul' });
          }
        });
        if (!items.some(function (i) { return i.jenis === 'informasi_penyelenggaraan' && ok(i); })) {
          out.push({ sesiId: null, butuh: 'informasi_penyelenggaraan' });
        }
        if (!items.some(function (i) { return i.jenis === 'evaluasi' && ok(i); })) {
          out.push({ sesiId: null, butuh: 'evaluasi' });
        }
        return out;
      }

      var ATURAN_MATERI_DEFAULT = { tenggatHariSebelum: 1, finalHariKerjaSebelumTenggat: 5 };

      function evaluasiMateri(eventStart, sesiIds, items, today, cal, a) {
        var cfg = a || ATURAN_MATERI_DEFAULT;
        var tenggat = prevWorkingDay(addDays(eventStart, -cfg.tenggatHariSebelum), cal);
        var targetFinal = addWorkingDays(tenggat, -cfg.finalHariKerjaSebelumTenggat, cal);
        var belumFinal = kekuranganMateri(sesiIds, items, 'final');
        var belumUnggah = kekuranganMateri(sesiIds, items, 'diunggah');
        var sisa = today <= tenggat ? workingDaysBetween(today, tenggat, cal) : -workingDaysBetween(tenggat, today, cal) || 0;
        var risiko, pesan;
        if (belumUnggah.length === 0) { risiko = 'selesai'; pesan = 'Semua bahan wajib sudah diunggah ke Kemenkes.'; }
        else if (today > tenggat) { risiko = 'terlambat'; pesan = 'Tenggat unggah ' + tenggat + ' sudah lewat; ' + belumUnggah.length + ' bahan wajib belum diunggah.'; }
        else if (belumFinal.length > 0 && today >= targetFinal) { risiko = 'segera'; pesan = belumFinal.length + ' bahan wajib belum final; target final ' + targetFinal + ', tenggat unggah ' + tenggat + '.'; }
        else if (belumFinal.length === 0) { risiko = 'aman'; pesan = 'Bahan sudah final; unggah paling lambat ' + tenggat + '.'; }
        else { risiko = 'aman'; pesan = 'Target final ' + targetFinal + ', tenggat unggah ' + tenggat + '.'; }
        return {
          tenggatUnggah: tenggat, targetFinal: targetFinal, kurang: belumUnggah,
          sudahDiunggah: belumUnggah.length === 0, risiko: risiko, sisaHariKerjaKeTenggat: sisa, pesan: pesan
        };
      }

      function statusPenugasan(tenggat, pesertaIds, kumpul) {
        var by = {};
        kumpul.forEach(function (k) { by[k.pesertaId] = k; });
        var terkumpul = 0, terlambat = 0, dinilai = 0;
        pesertaIds.forEach(function (p) {
          var k = by[p];
          if (!k) return;
          terkumpul++;
          if (k.dikumpulkanPada && tenggat && k.dikumpulkanPada > tenggat) terlambat++;
          if (k.skor !== null && k.skor !== undefined && k.skor !== '') dinilai++;
        });
        return {
          terdaftar: pesertaIds.length, terkumpul: terkumpul, terlambat: terlambat,
          belumMengumpulkan: pesertaIds.length - terkumpul, sudahDinilai: dinilai, belumDinilai: terkumpul - dinilai
        };
      }

      // ---------------------------------------------------------------------------
      // 10. Pemeriksa KAK sebelum unggah (kak-periksa.ts)

      function hariBulan(y, m) {
        return [31, y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
      }

      function tanggalIsoValid(s) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
        if (!m) return false;
        var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
        return mo >= 1 && mo <= 12 && d >= 1 && d <= hariBulan(y, mo);
      }

      function menitJam(s) {
        var p = String(s || '00:00').split(':');
        return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
      }

      function periksaKak(k) {
        var t = [];
        var kur = (k.kurikulum || []).reduce(function (a, r) { return a + Number(r.jpl || 0); }, 0);
        if (kur !== Number(k.jplTertulis)) {
          t.push({ kode: 'K01', tingkat: 'galat', pesan: 'Jumlah JPL baris kurikulum ' + kur + ', tetapi butir 5 menulis ' + k.jplTertulis + '.' });
        }
        var jadList = k.jadwal || [];
        if (jadList.length === 0) {
          t.push({ kode: 'K02', tingkat: 'galat', pesan: 'Jadwal kegiatan (butir 24) kosong.' });
        } else {
          var jad = jadList.reduce(function (a, r) { return a + Number(r.jpl || 0); }, 0);
          if (jad !== kur) {
            t.push({ kode: 'K03', tingkat: 'galat', pesan: 'Jadwal baru memuat ' + jad + ' JPL dari ' + kur + ' JPL kurikulum (kurang ' + (kur - jad) + '). Periksa hari yang belum ada dan sesi luring.' });
          }
          jadList.forEach(function (r) {
            var menit = menitJam(r.selesai) - menitJam(r.mulai);
            if (menit <= 0) {
              t.push({ kode: 'K04', tingkat: 'galat', pesan: 'Hari ' + r.hari + ' ' + r.mulai + '-' + r.selesai + ' "' + r.materi + '": jam selesai tidak setelah jam mulai.' });
              return;
            }
            if (Number(r.jpl) > 0 && Math.abs(menit / MENIT_PER_JPL - Number(r.jpl)) > 1e-9) {
              t.push({ kode: 'K04', tingkat: 'peringatan', pesan: 'Hari ' + r.hari + ' "' + r.materi + '": ' + menit + ' menit = ' + (menit / MENIT_PER_JPL) + ' JPL, tertulis ' + r.jpl + '.' });
            }
          });
        }
        [['tanggal KAK', k.tanggalKak], ['tanggal mulai', k.tanggalMulai], ['tanggal selesai', k.tanggalSelesai]].forEach(function (pair) {
          if (!tanggalIsoValid(pair[1])) {
            t.push({ kode: 'K05', tingkat: 'galat', pesan: pair[0] + ' "' + pair[1] + '" tidak ada di kalender.' });

          '<label class="field"><span>Maks remedial (kali)</span><input type="number" data-rule-k="maksRemedial" min="0" max="10" value="' + a.maksRemedial + '" style="width:110px"></label>' +

        } else {
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Peserta</th><th class="num">Hadir</th><th class="num">Pre Test</th>' +

              var k = r.kelulusan;

                }).join('') +
                '<td class="num strong">' + (k.nilaiAkhir !== null ? k.nilaiAkhir : '–') + '</td>' +
                '<td class="num">' + (r.ngain !== null ? UI.dec(r.ngain) : '<span class="muted">–</span>') + '</td>' +
                '<td><span class="badge badge-' + k.status + '">' + esc(KELULUSAN_LABEL[k.status]) + '</span>' +
                (detailAlasan ? '<div class="small muted">' + esc(detailAlasan) + '</div>' : '') +

                '<td class="right"><button type="button" class="btn btn-xs" data-input-nilai="' + esc(r.peserta.id) + '">Input Nilai</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Sub-tab 4: Evaluasi Kepuasan & Ringkasan LMS

      function renderKepuasan(b, pel) {
        var aspekAll = SEED.pembelajaran.aspek_kepuasan;
        var aspFas = aspekAll.filter(function (a) { return a.untuk === 'fasilitator'; });
        var aspPen = aspekAll.filter(function (a) { return a.untuk === 'penyelenggaraan'; });

        var resFas = D.ringkasanKepuasan((pel.kepuasan.fasilitator || []).map(function (x) { return x.jawaban; }), aspFas.map(function (a) { return a.kode; }));
        var resPen = D.ringkasanKepuasan((pel.kepuasan.penyelenggaraan || []).map(function (x) { return x.jawaban; }), aspPen.map(function (a) { return a.kode; }));

        var html = '<div class="detail-grid">';

        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Evaluasi Fasilitator (8 Aspek BDI)</h3>' +

          '<p class="panel-sub">Responden: <strong>' + resPen.responden + '</strong> · Rata-rata: <strong>' + (resPen.rataKeseluruhan || '–') + ' / 5</strong> · Puas (≥4): <strong>' + (resPen.persenPuas !== null ? resPen.persenPuas + '%' : '–') + '</strong></p>' +
          '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Aspek Penyelenggaraan</th><th class="num">Rata-rata</th></tr></thead><tbody>' +
          aspPen.map(function (a) { return '<tr><td>' + esc(a.nama) + '</td><td class="num strong">' + (resPen.rata[a.kode] !== undefined ? resPen.rata[a.kode] : '–') + '</td></tr>'; }).join('') +
          '</tbody></table></div></section></div>';

        // Ringkasan LMS Plataran Sehat
        var lms = pel.ringkasanLms;
        var p5 = D.persenRating(lms.rating, 5);

      // ---------------------------------------------------------------------------
      // Sub-tab 5: Laporan Kegiatan Resmi BDI + Pemeriksa Angka Laporan (L01–L05)

      function buildDataLaporan(pel, demoMismatch) {
        if (demoMismatch) {
          return {
            pesertaTerdaftar: 145, pesertaLulus: 136,
            jenisKelamin: { L: 42, P: 268 },
            progresLms: { '0-<100': 4, '100': 305 },
            rating: { '5': 294 }, jumlahUlasan: 294,
            nilaiPre: { min: 0, max: 90, rata: 44 }, nilaiPost: { min: 0, max: 100, rata: 87 }
          };
        }
        var att = computeAttendanceMap(pel);
        var g = computeGrades(pel, att.map);
        var L = pel.peserta.filter(function (p) { return p.jk === 'L'; }).length;
        var P = pel.peserta.filter(function (p) { return p.jk === 'P'; }).length;
        var lms = pel.ringkasanLms;
        return {
          pesertaTerdaftar: pel.peserta.length,
          pesertaLulus: g.summary.lulus,
          jenisKelamin: { L: L, P: P },
          progresLms: lms.progres,
          rating: lms.rating,
          jumlahUlasan: lms.jumlahUlasan,
          nilaiPre: lms.nilaiPre,
          nilaiPost: lms.nilaiPost
        };
      }

      function renderLaporan(b, pel, st) {
        var dataLap = buildDataLaporan(pel, st.lapDemoMismatch);
        var temuan = D.periksaLaporan(dataLap);
        var L = Store.settings().lembaga;
        var tpl = SEED.pembelajaran.laporan_template;
        var nar = pel.laporan || {};
        var sesiJpl = jplSesi(pel);
        var totalJpl = sesiJpl.reduce(function (s, x) { return s + D.jpl(x.menit); }, 0);
        var narsumList = [];
        pel.sesi.forEach(function (s) { if (s.narasumber && s.narasumber !== '-' && narsumList.indexOf(s.narasumber) === -1) narsumList.push(s.narasumber); });

        var html = '<section class="panel no-print"><div class="panel-head"><h3 class="panel-title">' + UI.icon('shield') + ' Pemeriksa Konsistensi Angka Laporan (L01–L05)</h3>' +
          '<div class="toolbar-actions">' +
          '<button type="button" class="btn btn-xs" data-toggle-lap-demo>' + (st.lapDemoMismatch ? 'Kembali ke data batch ini' : 'Uji Contoh Template BDI (145 vs 310)') + '</button>' +
          '<button type="button" class="btn btn-xs" data-print-lap>Cetak / Simpan PDF</button>' +
          '<button type="button" class="btn btn-xs btn-primary" data-export-lap>Unduh Laporan (.html / Word)</button>' +
          '</div></div>';

        if (st.lapDemoMismatch) {
          html += '<div class="notice notice-warn"><p><strong>Mode Uji Contoh (Workshop Perawatan Luka, 24–25 Jun 2024):</strong> 145 peserta terdaftar tetapi tabel jenis kelamin 310, kemajuan LMS 309, ulasan 294. Pemeriksa langsung menangkap semua ketidaksesuaian!</p></div>';
        }
        if (!temuan.length) {
          html += '<div class="notice notice-ok"><p><strong>Semua angka laporan konsisten (0 temuan L01–L05).</strong> Siap direview Pengendali Mutu dan diekspor.</p></div>';
        } else {
          html += '<ul class="findings">' + temuan.map(function (t) {
            return '<li class="finding finding-galat"><span class="finding-code">' + esc(t.kode) + '</span><span>' + esc(t.pesan) + '</span></li>';
          }).join('') + '</ul>';
        }
        html += '</section>';

        // Narasi manual (tidak tertimpa)
        html += '<section class="panel no-print"><h3 class="panel-title">Narasi Koordinator (Tidak Tertimpa Saat Data Berubah)</h3>' +
          '<div class="form-grid">' +
          '<label class="field"><span>Tanggal &amp; jam briefing peserta (Bagian 4.3)</span><input type="text" data-lap="tanggalBriefing" value="' + esc(nar.tanggalBriefing || '') + '" placeholder="Contoh: 18 Feb 2027, 15.00 WIB"></label>' +
          '<label class="field field-wide"><span>Alat bantu penyelenggaraan (Bagian 4.5)</span><input type="text" data-lap="alatBantu" value="' + esc(nar.alatBantu || '') + '" placeholder="Contoh: Zoom Meeting Pro, LMS Plataran Sehat, Manekin Resusitasi"></label>' +
          '<label class="field field-wide"><span>Ringkasan latar belakang (Bagian 1)</span><textarea data-lap="latarBelakang" placeholder="Kosongkan untuk teks baku otomatis dari KAK...">' + esc(nar.latarBelakang || '') + '</textarea></label>' +
          '<label class="field field-wide"><span>Catatan tambahan / evaluasi koordinator</span><textarea data-lap="narasiTambahan" placeholder="Kendala, tindak lanjut, atau catatan khusus...">' + esc(nar.narasiTambahan || '') + '</textarea></label>' +
          '</div></section>';

        // Pratinjau Struktur Resmi Laporan BDI
        html += '<article class="report-doc" id="report-preview">' +
          '<div class="report-kop"><h2>' + esc(tpl.judul_dokumen) + '</h2>' +
          '<p class="strong">' + esc(b.programName) + ' — Angkatan ' + b.seq + '</p>' +
          '<p class="small muted">' + esc(L.nama) + ' · ' + esc(L.akreditasi) + '</p></div>' +
          '<div class="report-sec"><h4>1. Latar Belakang &amp; 2. Tujuan Kegiatan</h4><p>' + esc(nar.latarBelakang || ('Kegiatan ' + b.programName + ' diselenggarakan oleh ' + L.nama + ' untuk meningkatkan kompetensi tenaga kesehatan sesuai standar kurikulum Kemenkes RI.')) + '</p></div>' +
          '<div class="report-sec"><h4>3. Cakupan dan Registrasi Kegiatan</h4><p>Cakupan: <strong>' + esc(b.cakupan || 'Nasional') + '</strong> · Total <strong>' + UI.dec(totalJpl) + ' JPL</strong> · SKP: <strong>' + esc(b.skp || '(isi di Ringkasan)') + '</strong>. Diregistrasikan melalui SIAKPEL dan dilaksanakan pada LMS Plataran Sehat Kemenkes RI' + (b.registrationNo ? ' (Surat Registrasi: ' + esc(b.registrationNo) + ')' : '') + '.</p></div>' +
          '<div class="report-sec"><h4>4. Pelaksanaan Kegiatan</h4>' +
          '<p><strong>4.1 Waktu &amp; Metode:</strong> ' + (b.eventStart ? UI.fmtDate(b.eventStart, 'long') : UI.fmtMonth(b.plannedMonth) + ' (perkiraan)') + ' · Metode: ' + esc(b.metode || 'Belum diisi') + ' · Tempat/Link: ' + esc(b.tempat || 'Belum diisi') + '.</p>' +
          '<p><strong>4.2 Instansi &amp; Fasilitator:</strong> ' + esc(L.nama) + ' (' + esc(L.akreditasi) + '). Mitra kerja sama: ' + esc(b.bentuk === 'kerja sama' && b.mitra ? b.mitra : 'tidak ada') + '. Fasilitator: ' + esc(narsumList.length ? narsumList.join(', ') : '(belum ada sesi)') + '.</p>' +
          '<p><strong>4.3 Rangkaian:</strong> Persiapan administrasi, briefing peserta (' + esc(nar.tanggalBriefing || 'belum diisi') + '), pelaksanaan ' + pel.sesi.length + ' sesi.</p>' +
          '<p><strong>4.4 Peserta:</strong> Terdaftar <strong>' + dataLap.pesertaTerdaftar + '</strong> peserta (Laki-laki: ' + dataLap.jenisKelamin.L + ', Perempuan: ' + dataLap.jenisKelamin.P + ').</p>' +
          '<p><strong>4.5 Alat Bantu:</strong> ' + esc(nar.alatBantu || 'Zoom Meeting, LMS Plataran Sehat, bahan tayang & modul pembelajaran.') + '</p></div>' +
          '<div class="report-sec"><h4>5. Evaluasi Proses Kegiatan &amp; Penyelenggaraan</h4>' +
          '<p><strong>5.1 Evaluasi Peserta:</strong> Lulus <strong>' + dataLap.pesertaLulus + '</strong> dari ' + dataLap.pesertaTerdaftar + ' peserta. Kemajuan LMS 100%: ' + (dataLap.progresLms['100'] || 0) + ' peserta. Nilai Evaluasi Peserta — Pre Test rata-rata ' + dataLap.nilaiPre.rata + ' (' + dataLap.nilaiPre.min + '–' + dataLap.nilaiPre.max + '), Post Test rata-rata ' + dataLap.nilaiPost.rata + ' (' + dataLap.nilaiPost.min + '–' + dataLap.nilaiPost.max + ').</p>' +
          '<p><strong>5.2 &amp; 5.3 Evaluasi Fasilitator &amp; Penyelenggaraan:</strong> Responden fasilitator ' + pel.kepuasan.fasilitator.length + ', penyelenggaraan ' + pel.kepuasan.penyelenggaraan.length + ' (lihat rekap di sub-tab Kepuasan &amp; Lampiran 1–2).</p>' +
          '<p><strong>5.4 Rating &amp; Ulasan:</strong> Total ' + dataLap.jumlahUlasan + ' ulasan (Bintang 5: ' + (D.persenRating(dataLap.rating, 5) !== null ? D.persenRating(dataLap.rating, 5) + '%' : '–') + ').</p></div>' +
          '<div class="report-sec"><h4>Lampiran 3. Dokumentasi (' + pel.dokumentasi.length + ' tautan)</h4>' +
          (pel.dokumentasi.length ? '<ul>' + pel.dokumentasi.map(function (d) { return '<li><strong>' + esc(KAT_DOK[d.kategori] || d.kategori) + ':</strong> ' + esc(d.judul) + ' — ' + esc(d.tautan) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Belum ada tautan dokumentasi di tab Berkas.</p>') +
          (nar.narasiTambahan ? '<p><strong>Catatan Koordinator:</strong> ' + esc(nar.narasiTambahan) + '</p>' : '') +
          '</div></article>';

        return html;
      }

      // ---------------------------------------------------------------------------
      // Tab Utama: Pelaksanaan

      function renderPelaksanaanTab(b, ctx) {
        var st = subState(ctx, b.id);
        var pel = Store.getPelaksanaan(b.id);
        var subs = [
          ['absensi', '1. Sesi & Absensi (JPL)', pel.peserta.length],
          ['materi', '2. Materi H-1 & Tugas', pel.materi.length],
          ['nilai', '3. Nilai & Kelulusan', pel.komponen.length],
          ['kepuasan', '4. Kepuasan & LMS', pel.kepuasan.fasilitator.length + pel.kepuasan.penyelenggaraan.length],
          ['laporan', '5. Laporan BDI', null]
        ];
        var html = '<div class="subpills no-print">' + subs.map(function (s) {
          return '<button type="button" data-pel-sub="' + s[0] + '" class="' + (st.sub === s[0] ? 'active' : '') + '">' + esc(s[1]) +
            (s[2] !== null ? ' <span class="count">' + s[2] + '</span>' : '') + '</button>';
        }).join('') + '</div>';

        if (st.sub === 'absensi') html += renderAbsensi(b, pel);
        else if (st.sub === 'materi') html += renderMateri(b, pel, ctx);
        else if (st.sub === 'nilai') html += renderNilai(b, pel);
        else if (st.sub === 'kepuasan') html += renderKepuasan(b, pel);
        else html += renderLaporan(b, pel, st);
        return html;

          '<button type="button" class="btn btn-sm btn-primary" data-add-dok>+ Tambah Tautan Berkas</button></div>' +
          '<p class="panel-sub">Sistem menyimpan <strong>tautan HTTPS</strong> (Shared Drive BDI / Google Docs), bukan mengunggah file besar. Setiap tautan divalidasi otomatis agar tidak terpotong atau mengandung spasi (seperti <code>drive/f olders</code>).</p>';
        if (!pel.dokumentasi.length) {
          html += '<div class="empty-inline"><p>Belum ada dokumentasi untuk batch ini. Simpan tautan folder foto, video, tangkapan layar rating LMS, daftar hadir, dan surat agar otomatis masuk Lampiran 3 Laporan BDI.</p></div>';

                '<td>' + providerBadge(d.tautan) + '</td>' +
                '<td><select data-dok-st="' + i + '" style="min-height:28px;padding:2px 6px;font-size:12px">' +
                Object.keys(STATUS_TAUTAN).map(function (k) { return '<option value="' + k + '"' + (d.statusTautan === k ? ' selected' : '') + '>' + STATUS_TAUTAN[k] + '</option>'; }).join('') +

        // Ringkasan cepat tautan materi
        html += '<section class="panel"><h3 class="panel-title">Tautan Materi Pembelajaran <span class="count">' + pel.materi.length + '</span></h3>' +
          (pel.materi.length ? '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Materi</th><th>Tautan</th><th>Status</th></tr></thead><tbody>' +
            pel.materi.map(function (m) {
              return '<tr><td>' + esc(m.judul) + '</td><td>' + providerBadge(m.tautan) + '</td><td><span class="badge badge-' + m.status + '">' + esc(STATUS_MATERI[m.status]) + '</span></td></tr>';
            }).join('') + '</tbody></table></div>'
            : '<p class="muted small">Belum ada tautan materi. Tambahkan di tab Pelaksanaan → Materi H-1.</p>') + '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Tab Utama: Impor Berkas (Zoom, LMS Plataran Sehat, Google Forms)

      function renderImporTab(b) {
        var pel = Store.getPelaksanaan(b.id);
        var sesiJpl = jplSesi(pel);
        var html = '<section class="panel"><h3 class="panel-title">' + UI.icon('upload') + ' Impor Data dari Zoom, LMS Plataran Sehat, atau Google Forms</h3>' +
          '<p class="panel-sub">Unggah file <code>.csv</code> atau tempel langsung isi tabel (CSV/TSV dari Excel). Baris yang cocok akan masuk otomatis; baris yang tidak dikenali (email/nama tidak cocok atau skor tidak valid) akan ditolak dengan alasan jelas dan dicatat di riwayat impor.</p>' +
          '<form id="impor-form">' +
          '<div class="form-grid" style="margin-bottom:12px">' +
          '<label class="field"><span>Jenis Impor</span><select name="jenis" id="imp-jenis">' +
          '<option value="kehadiran_zoom">Log Kehadiran Zoom (email/nama, menit_hadir, status)</option>' +
          '<option value="nilai_lms">Nilai LMS Plataran Sehat (email/nama, komponen, skor, percobaan)</option>' +
          '<option value="evaluasi_forms">Evaluasi Penyelenggaraan Google Forms (materi, narasumber, praktik, waktu, platform, panitia, manfaat)</option>' +
          '</select></label>' +
          '<label class="field" id="imp-sesi-wrap"><span>Untuk Sesi (khusus Zoom)</span><select name="sesiId">' +
          (sesiJpl.length ? sesiJpl.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.id + ' — ' + s.materi) + '</option>'; }).join('') : '<option value="">(Tambah sesi di tab Pelaksanaan dulu)</option>') +
          '</select></label>' +
          '<label class="field"><span>Pilih file CSV (opsional)</span><input type="file" id="imp-file" accept=".csv,.tsv,.txt"></label>' +
          '</div>' +
          '<label class="field"><span>Atau tempel teks CSV / tabel di sini</span>' +
          '<textarea name="raw" id="imp-raw" rows="6" placeholder="email,menit_hadir,status&#10;p1@contoh.bdi.id,180,hadir&#10;p2@contoh.bdi.id,120,terlambat"></textarea></label>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Proses Impor</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" data-fill-sample>Isi Contoh CSV</button></div>' +
          '</form></section>';

        // Riwayat Impor
        html += '<section class="panel"><h3 class="panel-title">Riwayat Impor <span class="count">' + pel.imporLog.length + '</span></h3>';
        if (!pel.imporLog.length) {
          html += '<div class="empty-inline"><p>Belum ada riwayat impor pada batch ini.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Waktu</th><th>Jenis</th><th class="num">Diterima</th><th class="num">Ditolak</th><th>Rincian Baris Ditolak</th></tr></thead><tbody>' +
            pel.imporLog.slice().reverse().map(function (l) {
              return '<tr><td class="nowrap small">' + esc(l.waktu) + '</td><td>' + esc(l.jenis) + '</td>' +
                '<td class="num num-good">' + l.diterima + '</td><td class="num ' + (l.ditolak ? 'num-bad' : '') + '">' + l.ditolak + '</td>' +
                '<td class="small">' + (l.detailDitolak && l.detailDitolak.length ? l.detailDitolak.map(function (d) { return 'Baris ' + d.baris + ': ' + esc(d.alasan); }).join('<br>') : '<span class="muted">Semua baris valid</span>') + '</td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Mount Event Listeners untuk Pelaksanaan, Berkas & Impor

      function mountPelaksanaan(root, bOrCtx, maybeCtx, maybeTab) {
        var b, ctx, tab;
        if (bOrCtx && bOrCtx.today !== undefined && bOrCtx.refresh !== undefined) {
          ctx = bOrCtx;
          var bId = typeof maybeCtx === 'string' ? maybeCtx : (maybeCtx && maybeCtx.id ? maybeCtx.id : (ctx.params && ctx.params.batchId) || Store.prefs().lastBatchId);
          b = Store.getBatch(bId) || Store.getBatches()[0];
          tab = maybeTab;
        } else {
          b = typeof bOrCtx === 'string' ? Store.getBatch(bOrCtx) : bOrCtx;
          ctx = maybeCtx;
          tab = maybeTab;
        }
        if (!b) b = Store.getBatches()[0];
        if (!ctx) ctx = window.App || {};
        var pel = Store.getPelaksanaan(b.id);
        var st = subState(ctx, b.id);
        var save = function () { Store.savePelaksanaan(b.id, pel); };

        root.querySelectorAll('[data-pel-sub]').forEach(function (btn) {
          btn.addEventListener('click', function () { st.sub = btn.getAttribute('data-pel-sub'); ctx.refresh(); });
        });

        root.querySelectorAll('[data-load-golden]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            Store.loadGoldenSample(b.id);
            UI.toast('Data uji emas (8 peserta, 3 sesi JPL + 2 non-JPL) berhasil dimuat!', 'ok');
            ctx.refresh();
          });
        });

        // Tambah / Hapus Sesi
        var addSesi = root.querySelector('[data-add-sesi]');
        if (addSesi) addSesi.addEventListener('click', function () {
          UI.dialog({
            title: 'Tambah Sesi Jadwal',
            body: '<div class="form-grid">' +
              '<label class="field"><span>Kode Sesi</span><input type="text" name="id" value="S' + (pel.sesi.length + 1) + '" required></label>' +
              '<label class="field"><span>Hari ke-</span><input type="number" name="hari" min="1" value="1" required></label>' +
              '<label class="field"><span>Jam Mulai</span><input type="text" name="mulai" value="08:00" placeholder="08:00"></label>' +
              '<label class="field"><span>Jam Selesai</span><input type="text" name="selesai" value="09:30" placeholder="09:30"></label>' +
              '<label class="field field-wide"><span>Nama Materi / Kegiatan</span><input type="text" name="materi" required placeholder="Contoh: Bantuan Hidup Dasar atau Registrasi"></label>' +
              '<label class="field"><span>Durasi (menit)</span><input type="number" name="menit" min="5" step="5" value="90" required><small class="hint">1 JPL = 45 menit (90 mnt = 2 JPL)</small></label>' +
              '<label class="field"><span>Narasumber</span><input type="text" name="narasumber" placeholder="Opsional"></label>' +
              '<label class="check field-wide"><input type="checkbox" name="nonJpl"> Baris Non-JPL (Registrasi, Pre Test, ISHOMA, Penutupan — tidak masuk hitungan absensi)</label></div>',
            submitLabel: 'Tambah Sesi',
            onSubmit: function (fm) {
              var sid = fm.elements.id.value.trim();
              var mat = fm.elements.materi.value.trim();
              var mnt = Number(fm.elements.menit.value);
              if (!sid || !mat || !mnt) return 'Lengkapi kode, materi, dan durasi menit.';
              pel.sesi.push({ id: sid, hari: Number(fm.elements.hari.value) || 1, mulai: fm.elements.mulai.value.trim(), selesai: fm.elements.selesai.value.trim(), materi: mat, menit: mnt, nonJpl: fm.elements.nonJpl.checked, narasumber: fm.elements.narasumber.value.trim() });
              save(); UI.toast('Sesi ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-del-sesi]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            pel.sesi.splice(Number(btn.getAttribute('data-del-sesi')), 1);
            save(); ctx.refresh();
          });
        });

        // Tambah / Hapus Peserta
        var addP = root.querySelector('[data-add-peserta]');
        if (addP) addP.addEventListener('click', function () {
          UI.dialog({
            title: 'Tambah Peserta',
            body: '<div class="form-grid">' +
              '<label class="field"><span>Kode Peserta</span><input type="text" name="id" value="P' + (pel.peserta.length + 1) + '" required></label>' +
              '<label class="field"><span>Jenis Kelamin</span><select name="jk"><option value="P">Perempuan (P)</option><option value="L">Laki-laki (L)</option></select></label>' +
              '<label class="field field-wide"><span>Nama Lengkap</span><input type="text" name="nama" required placeholder="Contoh: Ns. Anita Sari"></label>' +
              '<label class="field"><span>Email (untuk pencocokan Zoom/LMS)</span><input type="text" name="email" placeholder="nama@rs.id"></label>' +
              '<label class="field"><span>Institusi / RS</span><input type="text" name="institusi" placeholder="RSU Bunda..."></label></div>',
            submitLabel: 'Tambah Peserta',
            onSubmit: function (fm) {
              var pid = fm.elements.id.value.trim(), nama = fm.elements.nama.value.trim();
              if (!pid || !nama) return 'Kode dan nama peserta wajib diisi.';
              pel.peserta.push({ id: pid, nama: nama, email: fm.elements.email.value.trim(), jk: fm.elements.jk.value, institusi: fm.elements.institusi.value.trim() });
              save(); UI.toast('Peserta ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-del-peserta]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            pel.peserta.splice(Number(btn.getAttribute('data-del-peserta')), 1);
            save(); ctx.refresh();
          });
        });

        // Update Absensi
        root.querySelectorAll('[data-att-st]').forEach(function (sel) {
          sel.addEventListener('change', function () {
            var pid = sel.getAttribute('data-p'), sid = sel.getAttribute('data-s'), val = sel.value;
            pel.kehadiran = pel.kehadiran.filter(function (c) { return !(c.pesertaId === pid && c.sesiId === sid); });
            if (val) pel.kehadiran.push({ pesertaId: pid, sesiId: sid, status: val });
            save(); ctx.refresh();
          });
        });
        root.querySelectorAll('[data-att-min]').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var pid = inp.getAttribute('data-p'), sid = inp.getAttribute('data-s');
            var rec = pel.kehadiran.filter(function (c) { return c.pesertaId === pid && c.sesiId === sid; })[0];
            if (!rec) return;
            if (inp.value === '') delete rec.menitHadir;
            else rec.menitHadir = Number(inp.value);
            save(); ctx.refresh();
          });
        });

        // Materi H-1
        var addMat = root.querySelector('[data-add-materi]');
        if (addMat) addMat.addEventListener('click', function () {
          var sesiJpl = jplSesi(pel);
          UI.dialog({
            title: 'Tambah Materi Pembelajaran',
            body: '<label class="field"><span>Judul Materi</span><input type="text" name="judul" required placeholder="Contoh: Slide BHD / Informasi Penyelenggaraan"></label>' +
              '<label class="field"><span>Jenis</span><select name="jenis">' + Object.keys(JENIS_MATERI).map(function (k) { return '<option value="' + k + '">' + JENIS_MATERI[k] + '</option>'; }).join('') + '</select></label>' +
              '<label class="field"><span>Cakupan Sesi</span><select name="sesiId"><option value="">Seluruh batch (Info Penyelenggaraan / Evaluasi)</option>' +
              sesiJpl.map(function (s) { return '<option value="' + esc(s.id) + '">Sesi ' + esc(s.id + ' — ' + s.materi) + '</option>'; }).join('') + '</select></label>' +
              '<label class="field"><span>Tautan Google Drive / Docs (https://...)</span><input type="url" name="tautan" placeholder="https://drive.google.com/..."></label>' +
              '<label class="field"><span>Status Awal</span><select name="status"><option value="draf">Draf</option><option value="final">Final</option><option value="diunggah">Diunggah ke Kemenkes</option><option value="belum">Belum ada</option></select></label>',
            submitLabel: 'Simpan Materi',
            onSubmit: function (fm) {
              var j = fm.elements.judul.value.trim(), u = fm.elements.tautan.value.trim();
              if (!j) return 'Isi judul materi.';
              if (u) {
                var chk = D.periksaTautan(u);
                if (!chk.valid) return 'Tautan tidak valid: ' + chk.pesan;
              }
              pel.materi.push({ id: Store.uid('mat-'), sesiId: fm.elements.sesiId.value || null, jenis: fm.elements.jenis.value, judul: j, tautan: u, versi: 1, status: fm.elements.status.value, statusTautan: 'belum_dicek' });
              save(); UI.toast('Materi ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-mat-adv]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var m = pel.materi[Number(btn.getAttribute('data-mat-adv'))];
            if (m && NEXT_MATERI[m.status]) { m.status = NEXT_MATERI[m.status]; save(); UI.toast('Status materi diperbarui menjadi ' + STATUS_MATERI[m.status] + '.', 'ok'); ctx.refresh(); }
          });
        });
        root.querySelectorAll('[data-del-materi]').forEach(function (btn) {
          btn.addEventListener('click', function () { pel.materi.splice(Number(btn.getAttribute('data-del-materi')), 1); save(); ctx.refresh(); });
        });

        // Penugasan
        var addT = root.querySelector('[data-add-tugas]');
        if (addT) addT.addEventListener('click', function () {
          UI.dialog({
            title: 'Tambah Penugasan',
            body: '<label class="field"><span>Judul Penugasan</span><input type="text" name="judul" required placeholder="Contoh: Tugas Studi Kasus"></label>' +
              '<label class="field"><span>Tenggat (YYYY-MM-DD)</span><input type="date" name="tenggat" value="' + ctx.today + '"></label>' +
              '<label class="field"><span>Hubungkan ke Komponen Nilai</span><select name="komp"><option value="">– Opsional –</option>' +
              pel.komponen.map(function (k) { return '<option value="' + esc(k.id) + '">' + esc(k.nama) + '</option>'; }).join('') + '</select></label>',
            submitLabel: 'Tambah',
            onSubmit: function (fm) {
              var j = fm.elements.judul.value.trim();
              if (!j) return 'Judul penugasan wajib diisi.';
              pel.penugasan.push({ id: Store.uid('tgs-'), judul: j, tenggat: fm.elements.tenggat.value, komponenId: fm.elements.komp.value, pengumpulan: [] });
              save(); UI.toast('Penugasan ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-del-tugas]').forEach(function (btn) {
          btn.addEventListener('click', function () { pel.penugasan.splice(Number(btn.getAttribute('data-del-tugas')), 1); save(); ctx.refresh(); });
        });
        root.querySelectorAll('[data-edit-tugas]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var idx = Number(btn.getAttribute('data-edit-tugas'));
            var tg = pel.penugasan[idx];
            if (!pel.peserta.length) { UI.toast('Tambahkan peserta dulu.', 'error'); return; }
            var body = '<label class="field"><span>Peserta</span><select name="pid">' + pel.peserta.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.id + ' — ' + p.nama) + '</option>'; }).join('') + '</select></label>' +
              '<label class="field"><span>Tanggal Dikumpulkan</span><input type="date" name="tgl" value="' + ctx.today + '" required></label>' +
              '<label class="field"><span>Skor (kosongkan jika belum dinilai)</span><input type="number" name="skor" min="0" max="100"></label>';
            UI.dialog({
              title: 'Catat Pengumpulan: ' + tg.judul, body: body, submitLabel: 'Simpan',
              onSubmit: function (fm) {
                var pid = fm.elements.pid.value;
                tg.pengumpulan = (tg.pengumpulan || []).filter(function (x) { return x.pesertaId !== pid; });
                tg.pengumpulan.push({ pesertaId: pid, dikumpulkanPada: fm.elements.tgl.value, skor: fm.elements.skor.value === '' ? null : Number(fm.elements.skor.value) });
                save(); UI.toast('Pengumpulan dicatat.', 'ok'); ctx.refresh();
              }
            });
          });
        });

        // Aturan Kelulusan & Input Nilai
        root.querySelectorAll('[data-rule-k]').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var f = inp.getAttribute('data-rule-k');
            if (f === 'kehadiranMinPct') pel.aturanKelulusan.kehadiranMin = Math.max(0, Math.min(1, Number(inp.value) / 100));
            else pel.aturanKelulusan[f] = Number(inp.value);
            save(); ctx.refresh();
          });
        });
        root.querySelectorAll('[data-preset-komp]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var p = btn.getAttribute('data-preset-komp');
            if (p === 'kak') {
              pel.komponen = [
                { id: 'TUGAS', nama: 'Penugasan/Praktik', bobot: 30, nilaiMin: 85 },
                { id: 'POST', nama: 'Post Test', bobot: 20, nilaiMin: 80 },
                { id: 'UJIAN', nama: 'Ujian Praktik', bobot: 50, nilaiMin: 85 }
              ];
              pel.aturanKelulusan = { nilaiMinimal: 80, kehadiranMin: 0.8, maksRemedial: 5 };
            } else {
              pel.komponen = [
                { id: 'POST', nama: 'Post Test', bobot: 40, nilaiMin: 70 },
                { id: 'TUGAS', nama: 'Penugasan', bobot: 20, nilaiMin: 70 },
                { id: 'PRAKTIK', nama: 'Ujian Praktik', bobot: 40, nilaiMin: 70 }
              ];
              pel.aturanKelulusan = { nilaiMinimal: 70, kehadiranMin: 0.8, maksRemedial: 2 };
            }
            save(); UI.toast('Preset komponen evaluasi diterapkan.', 'ok'); ctx.refresh();
          });
        });
        root.querySelectorAll('[data-input-nilai]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var pid = btn.getAttribute('data-input-nilai');
            var p = pel.peserta.filter(function (x) { return x.id === pid; })[0];
            var body = '<p class="dlg-lead">' + esc(p.nama) + ' (' + esc(p.id) + ')</p>' +
              '<label class="field"><span>Skor Pre Test (untuk N-gain, opsional)</span><input type="number" name="pre" min="0" max="100" value="' + (pel.preTest[pid] !== undefined ? pel.preTest[pid] : '') + '"></label>' +
              '<label class="field"><span>Komponen Nilai</span><select name="komp">' + pel.komponen.map(function (k) { return '<option value="' + esc(k.id) + '">' + esc(k.nama + ' (' + k.bobot + '%, min ' + k.nilaiMin + ')') + '</option>'; }).join('') + '</select></label>' +
              '<div class="form-grid"><label class="field"><span>Skor (0–100)</span><input type="number" name="skor" min="0" max="100" required></label>' +
              '<label class="field"><span>Percobaan ke-</span><input type="number" name="percobaan" min="1" max="10" value="1" required><small class="hint">1 = awal, 2+ = remedial</small></label></div>';
            UI.dialog({
              title: 'Input Nilai / Remedial', body: body, submitLabel: 'Simpan Nilai',
              onSubmit: function (fm) {
                if (fm.elements.pre.value !== '') pel.preTest[pid] = Number(fm.elements.pre.value);
                var kid = fm.elements.komp.value, sk = Number(fm.elements.skor.value), pc = Number(fm.elements.percobaan.value) || 1;
                pel.nilai = pel.nilai.filter(function (n) { return !(n.pesertaId === pid && n.komponenId === kid && n.percobaan === pc); });
                pel.nilai.push({ pesertaId: pid, komponenId: kid, skor: sk, percobaan: pc });
                save(); UI.toast('Nilai disimpan.', 'ok'); ctx.refresh();
              }
            });
          });
        });

        // Kepuasan & LMS
        root.querySelectorAll('[data-add-kep]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var jenis = btn.getAttribute('data-add-kep');
            var list = SEED.pembelajaran.aspek_kepuasan.filter(function (a) { return a.untuk === jenis; });
            var body = (jenis === 'fasilitator' ? '<label class="field"><span>Nama Fasilitator / Narasumber</span><input type="text" name="narsum" required placeholder="dr. ..."></label>' : '') +
              '<div class="form-grid">' + list.map(function (a) {
                return '<label class="field"><span>' + esc(a.nama) + ' (1–5)</span><input type="number" name="a_' + a.kode + '" min="1" max="5" step="1" value="5" required></label>';
              }).join('') + '</div>';
            UI.dialog({
              title: 'Tambah Responden Kepuasan (' + (jenis === 'fasilitator' ? 'Fasilitator' : 'Penyelenggaraan') + ')',
              body: body, submitLabel: 'Simpan',
              onSubmit: function (fm) {
                var jw = {};
                for (var i = 0; i < list.length; i++) {
                  var v = Number(fm.elements['a_' + list[i].kode].value);
                  if (!isFinite(v) || v < 1 || v > 5) return 'Skor harus antara 1 sampai 5.';
                  jw[list[i].kode] = v;
                }
                if (jenis === 'fasilitator') pel.kepuasan.fasilitator.push({ narasumber: fm.elements.narsum.value.trim(), jawaban: jw });
                else pel.kepuasan.penyelenggaraan.push({ jawaban: jw });
                save(); UI.toast('Responden kepuasan ditambahkan.', 'ok'); ctx.refresh();
              }
            });
          });
        });
        root.querySelectorAll('[data-lms]').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var f = inp.getAttribute('data-lms'), v = Number(inp.value) || 0;
            var lms = pel.ringkasanLms;
            if (f === 'p0') lms.progres['0-<100'] = v;
            else if (f === 'p100') lms.progres['100'] = v;
            else if (f === 'r5') lms.rating['5'] = v;
            else if (f === 'r4') lms.rating['4'] = v;
            else if (f === 'r3') lms.rating['3'] = v;
            else if (f === 'ulasan') lms.jumlahUlasan = v;
            else if (f === 'preMin') lms.nilaiPre.min = v;
            else if (f === 'preAvg') lms.nilaiPre.rata = v;
            else if (f === 'preMax') lms.nilaiPre.max = v;
            else if (f === 'postMin') lms.nilaiPost.min = v;
            else if (f === 'postAvg') lms.nilaiPost.rata = v;
            else if (f === 'postMax') lms.nilaiPost.max = v;
            save(); ctx.refresh();
          });
        });

        // Laporan
        root.querySelectorAll('[data-lap]').forEach(function (el) {
          el.addEventListener('change', function () {
            pel.laporan[el.getAttribute('data-lap')] = el.value;
            save(); ctx.refresh();
          });
        });
        var togDemo = root.querySelector('[data-toggle-lap-demo]');
        if (togDemo) togDemo.addEventListener('click', function () { st.lapDemoMismatch = !st.lapDemoMismatch; ctx.refresh(); });
