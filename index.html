      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
    }

    .todo-note {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .todo-batch-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .todo-actions {
      display: flex;
      gap: 4px;
      flex: none;
    }

    .icon-danger:hover {
      color: #E11D48 !important;
      background: #FFF1F2 !important;
    }

    .smart-todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .smart-todo-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px dashed #99F6E4;
      background: #F0FDFA;
    }

    .smart-todo-acts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ---------- Bar Kuota Mini & Keputusan Kegiatan (Jalan / Reschedule / Cancel) ---------- */
    .qmini-wrap {
      min-width: 110px;
    }

    .qmini-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
    }

    .qmini-bar {
      height: 7px;
      border-radius: 999px;
      background: #E2E8F0;
      overflow: hidden;

      height: 16px;
      margin: 0;
    }

    @media (max-width: 760px) {
      .gform-grid {
        grid-template-columns: 1fr;
      }

    /* ====== Official Report Print Layout ====== */
    .report-sign-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 26px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .report-sign-box {
      font-size: 13px;
      color: #0F2942;
    }

    .report-sign-space {
      height: 56px;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 11mm;
      }

      html,
      body {
        background: #fff !important;
        font-size: 10.6px !important;
        line-height: 1.32 !important;
      }

      .sidebar,
      .topbar,
      .nav-scrim,
      .global-note,
      .nt-banner,
      .batch-picker-bar,
      .no-print,
      .subpills,
      .tabs {

      }

      .shell {
        margin-left: 0 !important;
        padding: 0 !important;
      }

      .main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }

      #report-preview {
        border: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        break-inside: auto !important;
      }

      #report-preview .report-kop {
        padding-bottom: 6px !important;
        margin-bottom: 8px !important;
        border-bottom-width: 1.5px !important;
      }

      #report-preview .report-kop h2 {
        font-size: 14.5px !important;
        margin: 0 0 2px !important;
      }

      #report-preview .report-kop p {
        margin: 1px 0 !important;
        font-size: 10.5px !important;
      }

      #report-preview .report-sec {
        margin-bottom: 6px !important;
        padding-bottom: 5px !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      #report-preview .report-sec:last-child {
        margin-bottom: 0 !important;
        padding-bottom: 0 !important;
      }

      #report-preview .report-sec h4 {
        font-size: 11.5px !important;
        margin: 0 0 2px !important;
      }

      #report-preview .report-sec p,
      #report-preview .report-sec li {
        margin: 1.5px 0 !important;
        font-size: 10.5px !important;
        line-height: 1.32 !important;
      }

      #report-preview .report-sec ul {
        margin: 2px 0 0 16px !important;
        padding: 0 !important;
      }

      #report-preview .report-sec .table th,
      #report-preview .report-sec .table td {
        padding: 3px 5px !important;
        font-size: 9.8px !important;
      }

      #report-preview .report-sign-grid {

        gap: 16px !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      #report-preview .report-sign-box {
        font-size: 10.5px !important;
        line-height: 1.25 !important;
      }

      #report-preview .report-sign-space {
        height: 28px !important;
      }
    }

        return Math.round((parseISO(b).getTime() - parseISO(a).getTime()) / MS_PER_DAY);
      }

      function dayOfWeek(s) { return parseISO(s).getUTCDay(); }

      function makeCalendar(holidays, coverage) {
        var set = {};
        holidays.forEach(function (h) { set[h.date] = true; });
        return {
          from: coverage.from,
          to: coverage.to,
          isWorkingDay: function (d) {
            if (d < coverage.from || d > coverage.to) {
              var err = new Error('Tanggal ' + d + ' di luar cakupan data libur (' + coverage.from + ' s.d. ' + coverage.to + ').');
              err.code = 'OUT_OF_COVERAGE';
              throw err;
            }
            var dow = dayOfWeek(d);
            return dow !== 0 && dow !== 6 && !set[d];
          }
        };
      }

      function addWorkingDays(start, n, cal) {
        var step = n < 0 ? -1 : 1;
        var left = Math.abs(n);
        var d = start;
        while (left > 0) {
          d = addDays(d, step);
          if (cal.isWorkingDay(d)) left--;
        }
        return d;
      }

      function prevWorkingDay(d, cal) {
        var x = d;
        while (!cal.isWorkingDay(x)) x = addDays(x, -1);
        return x;
      }

      function nextWorkingDay(d, cal) {
        var x = d;
        while (!cal.isWorkingDay(x)) x = addDays(x, 1);
        return x;
      }

      function workingDaysBetween(a, b, cal) {
        if (a === b) return 0;
        var sign = b > a ? 1 : -1;
        var lo = b > a ? a : b;
        var hi = b > a ? b : a;
        var count = 0;
        var d = lo;
        while (d < hi) {
          d = addDays(d, 1);
          if (cal.isWorkingDay(d)) count++;
        }
        return sign * count;
      }

      // ---------------------------------------------------------------------------
      // 2. Jalur mundur KAK -> Kemenkes (kak-plan.ts)

      var DEFAULT_RULES = {
        publishLeadDays: 30,
        kemenkesServiceWD: 14,
        revisionBufferWD: 5,
        signoffWD: 2,
        draftWD: 5,
        prepWD: 3,
        escalateBeforePublishWD: 3,
        soonThresholdWD: 5,
        materiDaysBeforeEvent: 1
      };

      function buildKakPlan(eventStart, rules, cal) {
        var publish = prevWorkingDay(addDays(eventStart, -rules.publishLeadDays), cal);
        var complete = addWorkingDays(publish, -rules.kemenkesServiceWD, cal);
        var upload = addWorkingDays(complete, -rules.revisionBufferWD, cal);
        var draftDone = addWorkingDays(upload, -rules.signoffWD, cal);
        var prepDone = addWorkingDays(draftDone, -rules.draftWD, cal);
        var kickoff = addWorkingDays(prepDone, -rules.prepWD, cal);
        var escalate = addWorkingDays(publish, -rules.escalateBeforePublishWD, cal);
        var materi = prevWorkingDay(addDays(eventStart, -rules.materiDaysBeforeEvent), cal);

        var milestones = [
          { code: 'KICKOFF', due: kickoff, title: 'Mulai siapkan KAK (RAB final, narasumber, jadwal)', basis: 'asumsi_bdi' },
          { code: 'PREP_DONE', due: prepDone, title: 'Bahan siap: RAB final disetujui, narasumber terkonfirmasi', basis: 'asumsi_bdi' },
          { code: 'DRAFT_DONE', due: draftDone, title: 'Draf KAK v3 + jadwal + daftar narasumber selesai, kirim review/TTD', basis: 'asumsi_bdi' },
          { code: 'UPLOAD', due: upload, title: 'Unggah KAK + jadwal + daftar narasumber ke admin-lms Kemenkes (batas akhir)', basis: 'sumber_kemenkes' },
          { code: 'KEMENKES_COMPLETE', due: complete, title: 'Dokumen harus sudah dinyatakan lengkap oleh Kemenkes (14 hari kerja layanan mulai berjalan)', basis: 'sumber_kemenkes' },
          { code: 'ESCALATE', due: escalate, title: 'Surat registrasi belum terbit? Hubungi PIC Kemenkes', basis: 'aturan_bdi' },
          { code: 'PUBLISH', due: publish, title: 'Surat registrasi terbit: publikasikan pelatihan (H-30)', basis: 'aturan_bdi' },
          { code: 'MATERI', due: materi, title: 'Unggah materi ke sistem Kemenkes (H-1)', basis: 'sumber_kemenkes' }
        ];
        milestones.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
        return {
          eventStart: eventStart,
          publishDue: publish,
          milestones: milestones,
          kickoffLeadDays: diffDays(kickoff, eventStart),
          uploadLeadDays: diffDays(upload, eventStart)
        };
      }

      function milestone(plan, code) {
        for (var i = 0; i < plan.milestones.length; i++) {
          if (plan.milestones[i].code === code) return plan.milestones[i];
        }
        throw new Error('Milestone ' + code + ' tidak ada');
      }

      function earliestLetter(uploadDate, rules, cal) {
        return {
          bestCase: addWorkingDays(uploadDate, rules.kemenkesServiceWD, cal),
          withBuffer: addWorkingDays(uploadDate, rules.kemenkesServiceWD + rules.revisionBufferWD, cal)
        };
      }

      var STAGES = ['belum_mulai', 'penyusunan', 'review', 'terupload', 'dokumen_lengkap', 'teregistrasi', 'dipublikasikan'];

      function stageOf(b) {
        if (b.publishedAt) return 'dipublikasikan';
        if (b.registrationLetterAt) return 'teregistrasi';
        if (b.kemenkesCompleteAt) return 'dokumen_lengkap';
        if (b.kakUploadedAt) return 'terupload';
        if (b.kakDraftDoneAt) return 'review';
        if (b.kakStartedAt) return 'penyusunan';
        return 'belum_mulai';
      }

      function maxDate(a, b) { return a > b ? a : b; }

      function evaluateBatch(b, today, rules, cal) {
        var assumed = b.eventStart === null || b.eventStart === undefined || b.eventStart === '';
        var eventStart = !assumed ? b.eventStart : (b.plannedMonth ? b.plannedMonth + '-01' : null);
        if (eventStart === null) throw new Error('Batch ' + b.id + ': isi eventStart atau plannedMonth');
        var plan = buildKakPlan(eventStart, rules, cal);
        var stage = stageOf(b);
        var ms = function (c) { return milestone(plan, c); };

        var nextCode =
          stage === 'belum_mulai' ? 'KICKOFF'
            : stage === 'penyusunan' ? 'DRAFT_DONE'
              : stage === 'review' ? 'UPLOAD'
                : stage === 'terupload' ? 'KEMENKES_COMPLETE'
                  : (stage === 'dokumen_lengkap' || stage === 'teregistrasi') ? 'PUBLISH'
                    : null;
        var next = nextCode === null ? null : { code: nextCode, due: ms(nextCode).due, workingDaysLeft: workingDaysBetween(today, ms(nextCode).due, cal) };

        var projected;
        var svc = rules.kemenkesServiceWD;
        var est;
        switch (stage) {
          case 'belum_mulai':
            projected = addWorkingDays(today, rules.prepWD + rules.draftWD + rules.signoffWD + rules.revisionBufferWD + svc, cal);
            break;
          case 'penyusunan': {
            var draftLeft = Math.max(0, rules.draftWD - workingDaysBetween(b.kakStartedAt, today, cal));
            projected = addWorkingDays(today, draftLeft + rules.signoffWD + rules.revisionBufferWD + svc, cal);
            break;
          }
          case 'review': {
            var signLeft = Math.max(0, rules.signoffWD - workingDaysBetween(b.kakDraftDoneAt, today, cal));
            projected = addWorkingDays(today, signLeft + rules.revisionBufferWD + svc, cal);
            break;
          }
          case 'terupload':
            est = addWorkingDays(b.kakUploadedAt, rules.revisionBufferWD + svc, cal);
            projected = maxDate(est, today);
            break;
          case 'dokumen_lengkap':
            est = addWorkingDays(b.kemenkesCompleteAt, svc, cal);
            projected = maxDate(est, today);
            break;
          case 'teregistrasi':
            projected = b.registrationLetterAt;
            break;
          default:
            projected = null;
        }

        var refForWindow = stage === 'dipublikasikan' ? b.publishedAt : projected;
        var marketingWindowDays = diffDays(refForWindow, eventStart);
        var delayWD = (projected === null || stage === 'teregistrasi') ? 0 : Math.max(0, workingDaysBetween(plan.publishDue, projected, cal));

        var risk = 'aman';
        if (stage !== 'dipublikasikan' && stage !== 'teregistrasi') {
          if (delayWD > 0) risk = 'terlambat';
          else if (next && next.workingDaysLeft <= rules.soonThresholdWD) risk = 'segera';
        }

        var tgt = rules.publishLeadDays;
        var nl = next ? next.workingDaysLeft : '';
        var message;
        switch (stage) {
          case 'belum_mulai':
            message = delayWD > 0
              ? 'KAK belum dimulai dan sudah lewat jadwal (mulai paling lambat ' + ms('KICKOFF').due + '). Bila dimulai hari ini, surat registrasi paling cepat ' + projected + ': jendela pemasaran ' + marketingWindowDays + ' hari (target ' + tgt + ').'
              : 'Mulai KAK paling lambat ' + ms('KICKOFF').due + ' (' + nl + ' hari kerja lagi).';
            break;
          case 'penyusunan':
            message = delayWD > 0
              ? 'KAK terlambat: draf seharusnya selesai ' + ms('DRAFT_DONE').due + ' dan diunggah ' + ms('UPLOAD').due + '. Perkiraan surat ' + projected + ', jendela pemasaran ' + marketingWindowDays + ' hari.'
              : 'Selesaikan draf paling lambat ' + ms('DRAFT_DONE').due + ' (' + nl + ' hari kerja lagi), unggah ' + ms('UPLOAD').due + '.';
            break;
          case 'review':
            message = delayWD > 0
              ? 'KAK terlambat: unggah ke Kemenkes seharusnya ' + ms('UPLOAD').due + '. Perkiraan surat ' + projected + ', jendela pemasaran ' + marketingWindowDays + ' hari.'
              : 'Unggah ke Kemenkes paling lambat ' + ms('UPLOAD').due + ' (' + nl + ' hari kerja lagi).';
            break;
          case 'terupload':
            message = delayWD > 0
              ? 'Diunggah ' + b.kakUploadedAt + ', tetapi sudah melewati batas ' + ms('UPLOAD').due + ': perkiraan surat ' + projected + ', jendela pemasaran ' + marketingWindowDays + ' hari.'
              : 'Menunggu Kemenkes. Perkiraan surat registrasi ' + projected + '.';
            break;
          case 'dokumen_lengkap':
            message = 'Dokumen dinyatakan lengkap ' + b.kemenkesCompleteAt + '. Perkiraan surat ' + projected + '.';
            break;
          case 'teregistrasi':
            message = 'Surat registrasi diterima ' + b.registrationLetterAt + ': publikasikan sekarang (jendela pemasaran ' + marketingWindowDays + ' hari).';
            break;
          default:
            message = 'Dipublikasikan ' + b.publishedAt + ': jendela pemasaran ' + marketingWindowDays + ' hari.';
        }
        return {
          id: b.id, stage: stage, plan: plan, eventStartAssumed: assumed, next: next, risk: risk,
          projectedLetter: projected, delayWD: delayWD, marketingWindowDays: marketingWindowDays, message: message
        };
      }

      // ---------------------------------------------------------------------------
      // 3. Pengingat harian (reminders.ts)

      var OPEN = {
        belum_mulai: ['KICKOFF', 'PREP_DONE', 'DRAFT_DONE', 'UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        penyusunan: ['DRAFT_DONE', 'UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        review: ['UPLOAD', 'KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        terupload: ['KEMENKES_COMPLETE', 'ESCALATE', 'PUBLISH'],
        dokumen_lengkap: ['ESCALATE', 'PUBLISH'],
        teregistrasi: ['PUBLISH'],
        dipublikasikan: []
      };

      function findRule(cfg, code) {
        for (var i = 0; i < cfg.rules.length; i++) if (cfg.rules[i].code === code) return cfg.rules[i];
        return null;
      }

      function remindersForDate(evaluations, today, cfg, cal) {
        var out = [];
        evaluations.forEach(function (item) {
          var label = item.label;
          var ev = item.ev;
          var open = OPEN[ev.stage];
          var ordered = ev.plan.milestones.filter(function (m) { return open.indexOf(m.code) !== -1; });
          var blocking = null;
          for (var i = 0; i < ordered.length; i++) {
            if (workingDaysBetween(today, ordered[i].due, cal) < 0) { blocking = ordered[i]; break; }
          }
          if (blocking) {
            var rule = findRule(cfg, blocking.code);
            var left = workingDaysBetween(today, blocking.due, cal);
            if (rule && (-left) % cfg.overdueRepeatWD === 0) {
              out.push({
                batchId: ev.id, code: blocking.code, due: blocking.due, workingDaysLeft: left, to: rule.to, kind: 'terlambat',
                message: '[TERLAMBAT ' + (-left) + ' hari kerja] ' + label + ': ' + blocking.title + ' (tenggat ' + blocking.due + '). ' + ev.message
              });
            }
            return;
          }
          ordered.forEach(function (m) {
            var r = findRule(cfg, m.code);
            if (!r) return;
            var l = workingDaysBetween(today, m.due, cal);
            if (r.beforeWD.indexOf(l) !== -1) {
              var kind = l === 0 ? 'jatuh_tempo' : 'pengingat';
              var when = l === 0 ? 'HARI INI' : l + ' hari kerja lagi (' + m.due + ')';
              out.push({ batchId: ev.id, code: m.code, due: m.due, workingDaysLeft: l, to: r.to, kind: kind, message: label + ': ' + m.title + '. Tenggat ' + when + '.' });
            }
          });
        });
        return out;
      }

      // ---------------------------------------------------------------------------
      // 4. RAB dan target margin (rab.ts)

      function lineTotal(l) { return l.qty * l.duration * l.unitPrice; }
      function round6(x) { return Math.round(x * 1e6) / 1e6; }
      function round2(x) { return Math.round(x * 100) / 100; }

      function minParticipants(F, v, P, c, m) {
        if (P <= 0) return null;
        var den = (1 - m) * P - v * (1 + c);
        if (den <= 0) return null;
        return Math.ceil(round6((F * (1 + c)) / den));
      }

      function computeRab(input) {
        var participants = 0, revenue = 0;
        input.revenue.forEach(function (r) { participants += r.participants; revenue += r.participants * r.price; });
        var sectionTotals = {};
        var baseCost = 0, F = 0, V = 0;
        input.lines.forEach(function (l) {
          var t = lineTotal(l);
          baseCost += t;
          sectionTotals[l.section] = (sectionTotals[l.section] || 0) + t;
          if (l.kind === 'tetap') F += t; else V += t;
        });
        var c = input.contingency;
        var contingencyCost = baseCost * c;
        var totalCost = baseCost + contingencyCost;
        var profit = revenue - totalCost;
        var margin = revenue > 0 ? profit / revenue : 0;
        var P = participants > 0 ? revenue / participants : 0;
        var v = participants > 0 ? V / participants : 0;
        return {
          participants: participants, revenue: revenue, baseCost: baseCost, contingencyCost: contingencyCost,
          totalCost: totalCost, costPerParticipant: participants > 0 ? totalCost / participants : 0,
          profit: profit, profitPerParticipant: participants > 0 ? profit / participants : 0,
          margin: margin, sectionTotals: sectionTotals, fixedCost: F, variableCost: V,
          avgRevenuePerParticipant: P, variableCostPerParticipant: v,
          breakEvenParticipants: participants > 0 ? minParticipants(F, v, P, c, 0) : null,
          targetParticipants: participants > 0 ? minParticipants(F, v, P, c, input.targetMargin) : null,
          minAvgPriceForTarget: participants > 0 ? ((F + V) * (1 + c)) / (participants * (1 - input.targetMargin)) : 0,
          meetsTarget: revenue > 0 && round6(margin - input.targetMargin) >= 0
        };
      }

      function projectAt(result, n, c) {
        var P = result.avgRevenuePerParticipant;
        var v = result.variableCostPerParticipant;
        var rev = P * n;
        var cost = (result.fixedCost + v * n) * (1 + c);
        return { n: n, revenue: rev, totalCost: cost, profit: rev - cost, margin: rev > 0 ? (rev - cost) / rev : 0 };
      }

      // ---------------------------------------------------------------------------
      // 5. File kalender .ics (ics.ts)

      function icsEscape(s) {
        return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
      }

      function fold(line) {
        if (line.length <= 75) return line;
        var parts = [line.slice(0, 75)];
        for (var i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
        return parts.join('\r\n');
      }

      function toICS(events, opts) {
        var ymd = function (d) { return d.replace(/-/g, ''); };
        var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BDI Pusat Kendali//KAK//ID', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:' + icsEscape(opts.calName)];
        events.forEach(function (e) {
          lines.push(
            'BEGIN:VEVENT', 'UID:' + icsEscape(e.uid), 'DTSTAMP:' + opts.stamp,
            'DTSTART;VALUE=DATE:' + ymd(e.date), 'DTEND;VALUE=DATE:' + ymd(addDays(e.date, 1)),
            'SUMMARY:' + icsEscape(e.summary)
          );
          if (e.description) lines.push('DESCRIPTION:' + icsEscape(e.description));
          lines.push('TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(e.summary), 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        return lines.map(fold).join('\r\n') + '\r\n';
      }

      // ---------------------------------------------------------------------------
      // 6. Validasi tautan berkas (tautan.ts)

      function periksaTautan(url) {
        var u = String(url || '').trim();
        if (u === '') return { valid: false, penyedia: null, pesan: 'Tautan kosong.' };
        if (/\s/.test(u)) return { valid: false, penyedia: null, pesan: 'Tautan mengandung spasi atau baris baru (biasanya terpotong saat disalin).' };
        var m = /^https:\/\/([a-z0-9.-]+)(\/[^\s]*)?$/i.exec(u);
        if (!m) return { valid: false, penyedia: null, pesan: 'Tautan harus diawali https:// dan berisi alamat yang lengkap.' };
        var host = m[1].toLowerCase();
        var penyedia = host === 'drive.google.com' ? 'google_drive' : host === 'docs.google.com' ? 'google_docs' : 'lainnya';
        return { valid: true, penyedia: penyedia, pesan: null };
      }

      // ---------------------------------------------------------------------------
      // 7. Absensi peserta per JPL (kehadiran.ts)

      var MENIT_PER_JPL = 45;
      function jpl(menit) { return menit / MENIT_PER_JPL; }

      function fraksiHadir(c, sesi) {
        if (c.status !== 'hadir' && c.status !== 'terlambat') return 0;
        if (c.menitHadir === undefined || c.menitHadir === null || c.menitHadir === '') return 1;
        return Math.min(1, Math.max(0, Number(c.menitHadir) / sesi.menit));
      }

      function hitungKehadiran(sesi, catatan, pesertaIds) {
        var jplTotal = sesi.reduce(function (s, x) { return s + jpl(x.menit); }, 0);
        var bySesi = {};
        sesi.forEach(function (s) { bySesi[s.id] = s; });
        var idx = {};
        catatan.forEach(function (c) {
          if (!bySesi[c.sesiId]) return;
          idx[c.pesertaId + '\u0000' + c.sesiId] = c;
        });
        return pesertaIds.map(function (p) {
          var hadir = 0, belum = 0, alpa = 0;
          sesi.forEach(function (s) {
            var c = idx[p + '\u0000' + s.id];
            if (!c) { belum++; return; }
            if (c.status === 'alpa') alpa++;
            hadir += jpl(s.menit) * fraksiHadir(c, s);
          });
          return {
            pesertaId: p,
            jplTotal: round6(jplTotal),
            jplHadir: round6(hadir),
            persen: jplTotal > 0 ? round6(hadir / jplTotal) : 0,
            belumDicatat: belum,
            alpa: alpa
          };
        });
      }

      function memenuhiKehadiran(persen, minimal) { return round6(persen) >= round6(minimal); }

      var JENDELA_DEFAULT = { bukaSebelumMenit: 15, terlambatSetelahMenit: 15, tutupSetelahMenit: 30 };

      function jendelaAbsen(mulaiMs, selesaiMs, sekarangMs, a) {
        var cfg = a || JENDELA_DEFAULT;
        var m = 60000;
        if (sekarangMs < mulaiMs - cfg.bukaSebelumMenit * m) return 'belum_dibuka';
        if (sekarangMs > selesaiMs + cfg.tutupSetelahMenit * m) return 'ditutup';
        if (sekarangMs > mulaiMs + cfg.terlambatSetelahMenit * m) return 'terlambat';
        return 'terbuka';
      }

      function statusDariJendela(j) {
        return j === 'terbuka' ? 'hadir' : j === 'terlambat' ? 'terlambat' : null;
      }

      // ---------------------------------------------------------------------------
      // 8. Penilaian, kelulusan & kepuasan (penilaian.ts)

      var ATURAN_DEFAULT = { nilaiMinimal: 80, kehadiranMin: 0.8, maksRemedial: 5 };

      function validasiPembobotan(komponen, nilaiMinimal) {
        var err = [];
        var total = komponen.reduce(function (s, k) { return s + Number(k.bobot || 0); }, 0);
        if (Math.abs(total - 100) > 1e-9) err.push('V02: total bobot ' + total + ', harus 100');
        if (nilaiMinimal < 70) err.push('V01: nilai minimal kelulusan ' + nilaiMinimal + ' < 70');
        komponen.forEach(function (k) {
          if (k.nilaiMin < 70) err.push('V01: nilai minimal komponen ' + k.nama + ' (' + k.nilaiMin + ') < 70');
          if (k.bobot <= 0) err.push('bobot komponen ' + k.nama + ' harus > 0');
        });
        return err;
      }

      function terakhirNilai(nilai) {
        var m = {};
        nilai.forEach(function (n) {
          var cur = m[n.komponenId];
          if (!cur || n.percobaan > cur.percobaan) m[n.komponenId] = n;
        });
        return m;
      }

      function hitungKelulusan(komponen, nilai, kehadiranPersen, aturan) {
        var a = aturan || ATURAN_DEFAULT;
        var t = terakhirNilai(nilai);
        var belum = komponen.filter(function (k) { return !t[k.id]; }).map(function (k) { return k.id; });
        if (belum.length) return { status: 'belum_lengkap', nilaiAkhir: null, alasan: null, belumDinilai: belum, perluRemedial: [] };
        var nilaiAkhir = round2(komponen.reduce(function (s, k) { return s + (k.bobot * t[k.id].skor) / 100; }, 0));
        if (!memenuhiKehadiran(kehadiranPersen, a.kehadiranMin)) {
          return { status: 'tidak_lulus', nilaiAkhir: nilaiAkhir, alasan: 'kehadiran', belumDinilai: [], perluRemedial: [] };
        }
        var gagal = komponen.filter(function (k) { return t[k.id].skor < k.nilaiMin; });
        if (gagal.length === 0 && nilaiAkhir >= a.nilaiMinimal) {
          return { status: 'lulus', nilaiAkhir: nilaiAkhir, alasan: null, belumDinilai: [], perluRemedial: [] };
        }
        var terpakai = function (k) { return t[k.id].percobaan - 1; };
        var kandidat = gagal.length ? gagal : komponen;
        var habis = gagal.length
          ? gagal.some(function (k) { return terpakai(k) >= a.maksRemedial; })
          : komponen.every(function (k) { return terpakai(k) >= a.maksRemedial; });
        if (habis) return { status: 'tidak_lulus', nilaiAkhir: nilaiAkhir, alasan: 'remedial_habis', belumDinilai: [], perluRemedial: [] };
        return {
          status: 'remedial', nilaiAkhir: nilaiAkhir, alasan: 'nilai', belumDinilai: [],
          perluRemedial: kandidat.filter(function (k) { return terpakai(k) < a.maksRemedial; }).map(function (k) { return k.id; })
        };
      }

      function nGain(pre, post) {

        function textOp(fontKey, size, x, yy, str, rgb) {
          var color = rgb || '0.07 0.14 0.22 rg';
          curOps.push('BT /' + fontKey + ' ' + size + ' Tf ' + color + ' 1 0 0 1 ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' Tm (' + pdfEsc(str) + ') Tj ET');
        }

        function centerText(fontKey, size, yy, str, rgb) {
          var s = sanitizePdfText(str);
          var wEst = s.length * size * (fontKey === 'F2' ? 0.54 : 0.50);
          var x = Math.max(ML, (PW - wEst) / 2);
          textOp(fontKey, size, x, yy, s, rgb);
        }

        function ruleOp(x1, yy, x2, wLine, rgbStroke) {
          curOps.push('q ' + (wLine || 0.8) + ' w ' + (rgbStroke || '0.05 0.58 0.53 RG') + ' ' + x1.toFixed(2) + ' ' + yy.toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + yy.toFixed(2) + ' l S Q');
        }

        function rectFillOp(x, yy, w, h, rgbFill) {

        }

        function rectStrokeOp(x, yy, w, h, rgbStroke) {
          curOps.push('q 0.5 w ' + (rgbStroke || '0.80 0.86 0.88 RG') + ' ' + x.toFixed(2) + ' ' + yy.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re S Q');
        }

        // Header / Kop
        if (docSpec.kopTop) {
          centerText('F2', compact ? 9 : 10, y, docSpec.kopTop, '0.05 0.58 0.53 rg');
          y -= compact ? 13 : 16;
        }
        if (docSpec.title) {
          var tLines = wrapLine(docSpec.title, CW, fTitle, true);
          tLines.forEach(function (ln) {
            centerText('F2', fTitle, y, ln, '0.06 0.16 0.26 rg');
            y -= compact ? 15 : 18;
          });
        }
        if (docSpec.subtitle) {
          var sLines = wrapLine(docSpec.subtitle, CW, fSub, false);
          sLines.forEach(function (ln) {
            centerText('F1', fSub, y, ln, '0.28 0.36 0.42 rg');
            y -= compact ? 12 : 14;
          });
        }
        ruleOp(ML, y - 1, PW - MR, 1.3, '0.05 0.58 0.53 RG');
        y -= compact ? 10 : 14;

        if (docSpec.metaLines && docSpec.metaLines.length) {
          docSpec.metaLines.forEach(function (ml) {
            var mWrap = wrapLine(ml, CW, fKv, false);
            ensureSpace(mWrap.length * fKvLine + 3);
            mWrap.forEach(function (ln) {
              textOp('F1', fKv, ML, y, ln, '0.25 0.35 0.40 rg');
              y -= fKvLine;
            });
          });
          y -= compact ? 3 : 6;
        }

        // Sections
        (docSpec.sections || []).forEach(function (sec) {
          if (sec.heading) {
            ensureSpace(compact ? 24 : 34);
            rectFillOp(ML, y - (compact ? 4 : 5), CW, compact ? 14 : 18, '0.92 0.98 0.96 rg');
            textOp('F2', fHead, ML + 6, y, sec.heading, '0.06 0.25 0.32 rg');
            y -= compact ? 15 : 20;
          }

          if (sec.kv && sec.kv.length) {
            sec.kv.forEach(function (pair) {
              var valLines = wrapLine(pair[1] || '-', CW - 140, fKv, false);
              ensureSpace(valLines.length * fKvLine + 2);
              textOp('F2', fKv, ML + 4, y, pair[0] + ':', '0.12 0.22 0.28 rg');
              valLines.forEach(function (vl, idx) {
                textOp('F1', fKv, ML + 140, y - idx * fKvLine, vl, '0.15 0.20 0.25 rg');
              });
              y -= valLines.length * fKvLine + (compact ? 1.5 : 3);
            });
            y -= compact ? 2 : 4;
          }

          if (sec.paragraphs && sec.paragraphs.length) {
            sec.paragraphs.forEach(function (p) {
              var pLines = wrapLine(p, CW - 4, fBody, false);
              ensureSpace(pLines.length * fLine + 2);
              pLines.forEach(function (ln) {
                textOp('F1', fBody, ML + 2, y, ln, '0.12 0.17 0.22 rg');
                y -= fLine;
              });
              y -= compact ? 1.5 : 3;
            });
          }

          if (sec.bullets && sec.bullets.length) {
            sec.bullets.forEach(function (b) {
              var bLines = wrapLine(b, CW - 18, fKv, false);
              ensureSpace(bLines.length * fKvLine + 2);
              textOp('F2', fKv, ML + 4, y, '-', '0.05 0.58 0.53 rg');
              bLines.forEach(function (ln, idx) {
                textOp('F1', fKv, ML + 14, y - idx * fKvLine, ln, '0.12 0.17 0.22 rg');
              });
              y -= bLines.length * fKvLine + (compact ? 1 : 2);
            });
            y -= compact ? 2 : 4;
          }

          if (sec.table && sec.table.headers && sec.table.headers.length) {
            var hdr = sec.table.headers;
            var rows = sec.table.rows || [];
            var weights = sec.table.widths || hdr.map(function () { return 1; });
            var wSum = weights.reduce(function (a, b) { return a + b; }, 0);
            var colW = weights.map(function (w) { return (w / wSum) * CW; });

            function drawRow(cells, isHead, isAlt) {
              var wrapped = cells.map(function (c, idx) {
                return wrapLine(c == null ? '' : String(c), Math.max(20, colW[idx] - 8), fTbl, isHead);
              });
              var maxLines = wrapped.reduce(function (m, arr) { return Math.max(m, arr.length); }, 1);
              var rh = maxLines * fTblLine + (compact ? 5 : 7);
              ensureSpace(rh + 2);
              var rowBottom = y - rh + (compact ? 4 : 5);
              if (isHead) rectFillOp(ML, rowBottom, CW, rh, '0.06 0.46 0.43 rg');
              else if (isAlt) rectFillOp(ML, rowBottom, CW, rh, '0.96 0.99 0.98 rg');
              var cx = ML;
              for (var c = 0; c < cells.length; c++) {
                rectStrokeOp(cx, rowBottom, colW[c], rh, isHead ? '0.06 0.46 0.43 RG' : '0.84 0.89 0.90 RG');
                var cLines = wrapped[c];
                for (var li = 0; li < cLines.length; li++) {
                  textOp(isHead ? 'F2' : 'F1', fTbl, cx + 4, y - (compact ? 4 : 5) - li * fTblLine, cLines[li], isHead ? '1 1 1 rg' : '0.10 0.16 0.22 rg');
                }
                cx += colW[c];
              }
              y -= rh;
            }

            drawRow(hdr, true, false);
            rows.forEach(function (r, idx) {
              drawRow(r, false, idx % 2 === 1);
            });
            y -= compact ? 4 : 8;
          }

          y -= compact ? 3 : 6;
        });

        if (docSpec.signBlocks && docSpec.signBlocks.length) {
          var sigH = compact ? 54 : 95;
          ensureSpace(sigH);
          y -= compact ? 4 : 10;
          var nSign = docSpec.signBlocks.length;
          var slotW = CW / nSign;
          docSpec.signBlocks.forEach(function (sb, idx) {
            var sx = ML + idx * slotW + 10;
            textOp('F1', fKv, sx, y, sb.role || '', '0.20 0.26 0.32 rg');
            textOp('F2', fKv, sx, y - (compact ? 30 : 52), sb.name || '( .............................. )', '0.07 0.14 0.22 rg');
            if (sb.sub) textOp('F1', compact ? 7.8 : 8.5, sx, y - (compact ? 41 : 65), sb.sub, '0.35 0.42 0.48 rg');
          });
          y -= compact ? 48 : 78;
        }

        if (curOps.length || pages.length === 0) pages.push(curOps);

        var totalPages = pages.length;
        pages.forEach(function (ops, pIdx) {
          var footerText = (docSpec.footer || 'Tim Training BDI - Dokumen Pelaksanaan Resmi') + '   |   Halaman ' + (pIdx + 1) + ' / ' + totalPages;
          ops.push('q 0.5 w 0.82 0.88 0.88 RG ' + ML + ' 36 m ' + (PW - MR).toFixed(2) + ' 36 l S Q');
          ops.push('BT /F1 8 Tf 0.42 0.48 0.52 rg 1 0 0 1 ' + ML + ' 24 Tm (' + pdfEsc(footerText) + ') Tj ET');
        });

        // Assemble PDF 1.4 objects
        var objs = [];
        // 1: Catalog, 2: Pages, 3: F1 Helvetica, 4: F2 Helvetica-Bold
        var pageObjNums = [];
        var nextId = 5;
        for (var i = 0; i < totalPages; i++) {
          pageObjNums.push(nextId);
          nextId += 2;
        }

        objs[1] = '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n';
        objs[2] = '2 0 obj\n<< /Type /Pages /Kids [' + pageObjNums.map(function (n) { return n + ' 0 R'; }).join(' ') + '] /Count ' + totalPages + ' >>\nendobj\n';
        objs[3] = '3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n';
        objs[4] = '4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n';

        for (var p = 0; p < totalPages; p++) {
          var pId = pageObjNums[p];
          var cId = pId + 1;
          var streamStr = pages[p].join('\n') + '\n';
          objs[pId] = pId + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + cId + ' 0 R >>\nendobj\n';
          objs[cId] = cId + ' 0 obj\n<< /Length ' + streamStr.length + ' >>\nstream\n' + streamStr + 'endstream\nendobj\n';
        }

        var chunks = ['%PDF-1.4\n'];
        var offsets = [0];
        var cursor = chunks[0].length;
        for (var id = 1; id < objs.length; id++) {
          offsets[id] = cursor;
          chunks.push(objs[id]);
          cursor += objs[id].length;
        }
        var xrefPos = cursor;
        chunks.push('xref\n0 ' + objs.length + '\n0000000000 65535 f \n');
        for (var k = 1; k < objs.length; k++) {
          chunks.push(String(offsets[k]).padStart(10, '0') + ' 00000 n \n');
        }
        chunks.push('trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF');

        var fullStr = chunks.join('');
        var bytes = new Uint8Array(fullStr.length);
        for (var bi = 0; bi < fullStr.length; bi++) {
          bytes[bi] = fullStr.charCodeAt(bi) & 0xFF;
        }
        return new Blob([bytes], { type: 'application/pdf' });
      }

      function downloadPdf(filename, docSpec) {
        var blob = createPdfBlob(docSpec);
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = /\.pdf$/i.test(filename) ? filename : (filename + '.pdf');
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 250);
        return blob;
      }

      // =========================================================================
      // 3. PDF Text Extractor (supports compressed FlateDecode & plain streams)

      function decompressBytes(u8) {
        if (typeof DecompressionStream !== 'function') return Promise.resolve(null);
        function tryFmt(fmt) {
          try {
            var ds = new DecompressionStream(fmt);
            var stream = new Blob([u8]).stream().pipeThrough(ds);
            return new Response(stream).arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
          } catch (ex) {
            return Promise.reject(ex);
          }
        }
        return tryFmt('deflate').catch(function () {
          return tryFmt('deflate-raw').catch(function () { return null; });
        });
      }

      function bytesToLatin1(u8) {
        var out = [];
        for (var i = 0; i < u8.length; i += 8192) {
          out.push(String.fromCharCode.apply(null, u8.subarray(i, Math.min(u8.length, i + 8192))));
        }
        return out.join('');
      }

      function decodePdfStringLiteral(raw) {
        var out = '';
        for (var i = 0; i < raw.length; i++) {
          var ch = raw[i];
          if (ch !== '\\') { out += ch; continue; }
          i++;
          if (i >= raw.length) break;
          var escCh = raw[i];
          if (escCh === 'n') out += '\n';
          else if (escCh === 'r') out += '\r';
          else if (escCh === 't') out += '\t';
          else if (escCh === 'b') out += '\b';
          else if (escCh === 'f') out += '\f';
          else if (escCh === '(' || escCh === ')' || escCh === '\\') out += escCh;
          else if (escCh >= '0' && escCh <= '7') {
            var oct = escCh;
            if (raw[i + 1] >= '0' && raw[i + 1] <= '7') { oct += raw[++i]; }
            if (raw[i + 1] >= '0' && raw[i + 1] <= '7') { oct += raw[++i]; }
            out += String.fromCharCode(parseInt(oct, 8));
          } else if (escCh === '\r' || escCh === '\n') {
            if (escCh === '\r' && raw[i + 1] === '\n') i++;
          } else {
            out += escCh;
          }
        }
        return out;
      }

      function decodePdfHex(hex) {
        var clean = hex.replace(/[^0-9A-Fa-f]/g, '');
        if (clean.length % 2 === 1) clean += '0';
        var out = '';
        if (clean.slice(0, 4).toUpperCase() === 'FEFF') {
          for (var i = 4; i + 3 < clean.length; i += 4) {
            out += String.fromCharCode(parseInt(clean.slice(i, i + 4), 16));
          }
        } else {
          for (var j = 0; j + 1 < clean.length; j += 2) {
            var code = parseInt(clean.slice(j, j + 2), 16);
            if (code >= 32 || code === 9 || code === 10) out += String.fromCharCode(code);
          }
        }
        return out;
      }

      function extractTextFromContentStream(src) {
        if (!src) return '';
        var items = [];
        var seqLines = [];
        var i = 0, len = src.length;
        var curLine = '';
        var curX = 0, curY = 0, hasCoords = false;
        var numBuf = [];

        function pushItem() {
          var trimmed = curLine.replace(/[ \t]+/g, ' ').trim();
          if (trimmed) {
            items.push({ x: curX, y: curY, text: trimmed, seq: items.length });
            seqLines.push(trimmed);
          }
          curLine = '';
        }

        while (i < len) {
          var ch = src[i];
          if (ch === '(') {
            var buf = '';
            var depth = 1;
            i++;
            while (i < len && depth > 0) {
              var c = src[i];
              if (c === '\\') {
                buf += c + (src[i + 1] || '');
                i += 2;
                continue;
              }
              if (c === '(') depth++;
              else if (c === ')') {
                depth--;
                if (depth === 0) { i++; break; }
              }
              buf += c;
              i++;
            }
            var decoded = decodePdfStringLiteral(buf);
            if (decoded) curLine += decoded;
            continue;
          }
          if (ch === '<' && src[i + 1] !== '<') {
            var endHex = src.indexOf('>', i + 1);
            if (endHex !== -1 && endHex - i < 4096) {
              var hStr = src.slice(i + 1, endHex);
              if (/^[0-9A-Fa-f\s]+$/.test(hStr)) {
                curLine += decodePdfHex(hStr);
                i = endHex + 1;
                continue;
              }
            }
          }
          // Track numbers for Tm / Td / TD
          if ((ch >= '0' && ch <= '9') || ch === '-' || ch === '+' || ch === '.') {
            var prevB = i === 0 || /[\s\[\(\<]/.test(src[i - 1]);
            if (prevB) {
              var j = i + 1;
              while (j < len && ((src[j] >= '0' && src[j] <= '9') || src[j] === '.')) j++;
              var val = Number(src.slice(i, j));
              if (isFinite(val)) {
                numBuf.push(val);
                if (numBuf.length > 8) numBuf.shift();
              }
              i = j;
              continue;
            }
          }
          // BT / ET / Tm / Td / TD / T*
          var prevOk = i === 0 || /[\s\]\d\)]/.test(src[i - 1]);
          var nextOk = i + 2 >= len || /[\s\r\n]/.test(src[i + 2]);
          if (prevOk && nextOk && i + 1 < len) {
            var op = ch + src[i + 1];
            if (op === 'BT') {
              pushItem();
              curX = 0; curY = 0;
              numBuf = [];
              i += 2;
              continue;
            }
            if (op === 'ET') {
              pushItem();
              numBuf = [];
              i += 2;
              continue;
            }
            if (op === 'Tm' && numBuf.length >= 6) {
              pushItem();
              curX = numBuf[numBuf.length - 2];
              curY = numBuf[numBuf.length - 1];
              hasCoords = true;
              numBuf = [];
              i += 2;
              continue;
            }
            if ((op === 'Td' || op === 'TD') && numBuf.length >= 2) {
              pushItem();
              curX += numBuf[numBuf.length - 2];
              curY += numBuf[numBuf.length - 1];
              hasCoords = true;
              numBuf = [];
              i += 2;
              continue;
            }
            if (op === 'T*') {
              pushItem();
              curY -= 12;
              numBuf = [];
              i += 2;
              continue;
            }
          }
          if (ch === 'T' && src[i + 1] === 'J') {
            if (curLine && curLine[curLine.length - 1] !== ' ') curLine += ' ';
          }
          i++;
        }
        pushItem();

        if (!hasCoords || !items.length) return seqLines.join('\n');

        // Group spans on the same horizontal row (|y1 - y2| <= 3.5 pt)
        var rows = [];
        items.forEach(function (it) {
          var target = null;
          for (var r = 0; r < rows.length; r++) {
            if (Math.abs(rows[r].y - it.y) <= 3.5) { target = rows[r]; break; }
          }
          if (!target) {
            target = { y: it.y, spans: [it] };
            rows.push(target);
          } else {
            target.spans.push(it);
          }
        });
        rows.sort(function (a, b) { return b.y - a.y; });
        return rows.map(function (r) {
          r.spans.sort(function (a, b) { return a.x - b.x || a.seq - b.seq; });
          return r.spans.map(function (s) { return s.text; }).join(' | ');
        }).join('\n');
      }

      function extractTextFromPdf(arrayBuffer) {
        var u8 = new Uint8Array(arrayBuffer);
        var latin = bytesToLatin1(u8);
        var streamBlocks = [];
        var idx = 0;
        while (idx < latin.length) {
          var stPos = latin.indexOf('stream', idx);
          if (stPos === -1) break;
          var headerWindow = latin.slice(Math.max(0, stPos - 350), stPos);
          var afterSt = stPos + 6;
          if (latin[afterSt] === '\r' && latin[afterSt + 1] === '\n') afterSt += 2;
          else if (latin[afterSt] === '\n' || latin[afterSt] === '\r') afterSt += 1;
          var endPos = latin.indexOf('endstream', afterSt);
          if (endPos === -1) break;
          var rawSlice = u8.subarray(afterSt, endPos);
          var isFlate = /\/FlateDecode/.test(headerWindow) || (rawSlice.length > 2 && rawSlice[0] === 0x78);
          var isImage = /\/Subtype\s*\/Image/.test(headerWindow);
          if (!isImage && rawSlice.length > 0 && rawSlice.length < 5 * 1024 * 1024) {
            streamBlocks.push({ bytes: rawSlice, flate: isFlate });
          }
          idx = endPos + 9;
        }

        if (!streamBlocks.length) {
          // Fallback: try raw content text directly
          var directText = extractTextFromContentStream(latin);
          return Promise.resolve({
            text: directText,
            lines: directText ? directText.split('\n').filter(Boolean) : [],
            streamCount: 0,
            note: directText ? 'Teks terbaca langsung dari PDF.' : 'Tidak ditemukan stream teks PDF (mungkin PDF berupa gambar/scan).'
          });
        }

        var tasks = streamBlocks.map(function (blk) {
          if (!blk.flate) {
            return Promise.resolve(extractTextFromContentStream(bytesToLatin1(blk.bytes)));
          }
          return decompressBytes(blk.bytes).then(function (dec) {
            if (!dec) return '';
            return extractTextFromContentStream(bytesToLatin1(dec));
          });
        });

        return Promise.all(tasks).then(function (parts) {
          var text = parts.filter(function (p) { return p && p.trim(); }).join('\n');
          var lines = text ? text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean) : [];
          return {
            text: text,
            lines: lines,
            streamCount: streamBlocks.length,
            note: lines.length
              ? ('Berhasil mengekstrak ' + lines.length + ' baris teks dari PDF.')
              : 'PDF berhasil dibaca, namun tidak ada teks terdeteksi (kemungkinan PDF hasil scan/gambar — Anda masih bisa menyimpannya sebagai arsip atau menempelkan datanya secara manual).'
          };
        });
      }

      // =========================================================================
      // 4. Smart Evaluasi PDF Text Parser

      function parseEvaluasiText(rawText, pel) {
        var lines = String(rawText || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        var rows = [];
        var lmsUpdates = {};
        var warnings = [];

        lines.forEach(function (ln, idx) {
          // Summary patterns (LMS / Evaluasi)
          var mPre = ln.match(/Pre\s*Test[^0-9]*([\d]+(?:[.,]\d+)?)/i);
          if (mPre && /rata|avg/i.test(ln)) lmsUpdates.preAvg = Number(mPre[1].replace(',', '.'));
          var mPost = ln.match(/Post\s*Test[^0-9]*([\d]+(?:[.,]\d+)?)/i);
          if (mPost && /rata|avg/i.test(ln)) lmsUpdates.postAvg = Number(mPost[1].replace(',', '.'));
          var mUlas = ln.match(/(?:ulasan|rating)[^0-9]*([\d]+)/i);
          if (mUlas && /ulasan/i.test(ln)) lmsUpdates.jumlahUlasan = Number(mUlas[1]);

          // Skip obvious header/footer lines
          if (/^(no\b|nama\b|peserta\b|daftar\b|evaluasi\b|halaman\b|tim training|laporan|pt bmhs)/i.test(ln) && !/@/.test(ln)) {
            return;
          }

          // Split by pipe, tab, semicolon, comma, or 2+ spaces
          var cols = [];
          if (ln.indexOf('|') !== -1) cols = ln.split('|').map(function (c) { return c.trim(); });
          else if (ln.indexOf('\t') !== -1) cols = ln.split('\t').map(function (c) { return c.trim(); });
          else if (ln.indexOf(';') !== -1) cols = ln.split(';').map(function (c) { return c.trim(); });
          else if (ln.indexOf(',') !== -1) cols = ln.split(',').map(function (c) { return c.trim(); });
          else cols = ln.split(/\s{2,}/).map(function (c) { return c.trim(); });

          // Heuristic: if single line has "Nama 80 85 90" with single spaces
          if (cols.length < 3) {
            var mLine = ln.match(/^(?:\d+[\.\)]\s*)?([A-Za-z.,'\-\s]{3,}?)\s+([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})?\s*((?:\d{1,3}(?:[.,]\d+)?(?:\s+|\s*$)){1,5})/);
            if (mLine) {
              var nums = (mLine[3] || '').trim().split(/\s+/).filter(Boolean);
              cols = [mLine[1].trim()];
              if (mLine[2]) cols.push(mLine[2].trim());
              cols = cols.concat(nums);
            }
          }

          if (cols.length < 2) return;
          // Drop leading sequence number if first cell is pure integer <= 999
          if (/^\d{1,3}\.?$/.test(cols[0]) && cols.length >= 3) cols = cols.slice(1);

          // Extract email if present, name as first non-numeric cell, and numeric scores

      /** Parse CSV/TSV/semicolon-separated text for Impor Berkas. */
      function parseDelimited(text) {
        var cleaned = String(text || '').replace(/^\uFEFF/, '').trim();
        if (!cleaned) return { headers: [], rows: [] };
        var firstLine = cleaned.split(/\r?\n/)[0] || '';
        var delim = firstLine.indexOf('\t') !== -1 ? '\t' : (firstLine.split(';').length > firstLine.split(',').length ? ';' : ',');
        var rows = [], row = [], field = '', q = false;
        for (var i = 0; i < cleaned.length; i++) {
          var ch = cleaned[i];
          if (q) {
            if (ch === '"' && cleaned[i + 1] === '"') { field += '"'; i++; }
            else if (ch === '"') q = false;
            else field += ch;
          } else if (ch === '"') q = true;
          else if (ch === delim) { row.push(field.trim()); field = ''; }
          else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && cleaned[i + 1] === '\n') i++;
            row.push(field.trim()); field = '';
            if (row.some(function (x) { return x !== ''; })) rows.push(row);
            row = [];
          } else field += ch;
        }
        if (field !== '' || row.length) { row.push(field.trim()); rows.push(row); }
        if (!rows.length) return { headers: [], rows: [] };
        var headers = rows[0].map(function (h) { return h.toLowerCase().trim(); });
        var body = rows.slice(1).map(function (r, idx) {
          var obj = { _row: idx + 2 };
          headers.forEach(function (h, i) { obj[h] = r[i] !== undefined ? r[i] : ''; });
          return obj;
        });
        return { headers: headers, rows: body };
      }

    /* Daftar 83 batch 2027: filter cepat, tampilan Tabel <-> Kartu, urutkan, tautan Pelaksanaan/RAB, unduh CSV. */
    (function () {

        var f = ctx.ui.batch;
        var qs = ctx.query.toString();

          f.q = ''; f.bulan = ''; f.tier = ''; f.tahap = ''; f.risiko = ''; f.tanggal = ''; f.keputusan = ''; f.kuotaOk = false; f.batal = false;
          if (ctx.query.get('risiko')) f.risiko = ctx.query.get('risiko');
          if (ctx.query.get('tahap')) f.tahap = ctx.query.get('tahap');
          if (ctx.query.get('tanggal')) f.tanggal = ctx.query.get('tanggal');
          if (ctx.query.get('bulan')) f.bulan = ctx.query.get('bulan');
          if (ctx.query.get('keputusan')) {
            f.keputusan = ctx.query.get('keputusan');

        if (!qs) f.appliedQs = '';

        var list = Store.rabsForBatch(id);
        if (!list.length) return null;
        var latest = list.slice().sort(function (a, b) { return (b.updatedAt || '') < (a.updatedAt || '') ? -1 : 1; })[0];
        var res = D.computeRab(Store.rabInput(latest));

        var maxSesiHari = (pel.sesi || []).reduce(function (m, x) { return Math.max(m, Number(x.hari) || 1); }, 0);
        for (var h = out.length + 1; h <= maxSesiHari; h++) {
          out.push({ hariKe: h, iso: '', label: 'Hari ke-' + h + ' Pelaksanaan' });
        }
        if (!out.length) {
          out.push({ hariKe: 1, iso: '', label: 'Hari ke-1 Pelaksanaan (' + (b ? b.label : 'Batch') + ')' });
        }
        return out;
      }

      function allFoldersForPel(pel) {
        var map = {};
        var list = DEFAULT_FOLDERS.map(function (f) {
          map[f.id] = true;
          return { id: f.id, nama: f.nama, deskripsi: f.deskripsi, jenisDefault: f.jenisDefault, builtin: true };
        });
        (pel.materiFolders || []).forEach(function (f) {
          if (f && f.id && !map[f.id]) {
            map[f.id] = true;
            list.push({ id: f.id, nama: f.nama, deskripsi: f.deskripsi || 'Folder kustom tim BDI', jenisDefault: f.jenisDefault || 'modul', builtin: false });
          }
        });
        return list;
      }

      function itemFolderId(m) {
        if (m.folderId && m.folderId !== 'buku' && m.folderId !== 'bahan_tayang') return m.folderId;
        if (m.jenis === 'cv_narasumber') return 'cv_narasumber';
        if (m.jenis === 'informasi_penyelenggaraan') return 'informasi_penyelenggaraan';
        if (m.jenis === 'evaluasi') return 'evaluasi';
        return 'modul';
      }

      function jplSesi(pel) { return (pel.sesi || []).filter(function (s) { return !s.nonJpl && Number(s.menit) > 0; }); }

      function computeAttendanceMap(pel) {
        var sesiJpl = jplSesi(pel);
        var pIds = (pel.peserta || []).map(function (p) { return p.id; });
        var list = D.hitungKehadiran(sesiJpl, pel.kehadiran || [], pIds);
        var map = {};
        list.forEach(function (x) { map[x.pesertaId] = x; });
        return { list: list, map: map, sesiJpl: sesiJpl };
      }

      function computeGrades(pel, attMap) {
        var komp = pel.komponen || [];
        var aturan = pel.aturanKelulusan || D.ATURAN_DEFAULT;
        var rows = (pel.peserta || []).map(function (p) {
          var att = attMap[p.id] || { persen: 0, jplHadir: 0, jplTotal: 0 };
          var pNilai = (pel.nilai || []).filter(function (n) { return n.pesertaId === p.id; });
          var kel = komp.length ? D.hitungKelulusan(komp, pNilai, att.persen, aturan) : { status: 'belum_lengkap', nilaiAkhir: null, alasan: null, belumDinilai: [], perluRemedial: [] };
          var pre = pel.preTest && pel.preTest[p.id] !== undefined ? Number(pel.preTest[p.id]) : null;
          var postRec = pNilai.filter(function (n) { return n.komponenId === 'POST' || n.komponenId === 'K1'; }).sort(function (a, b) { return b.percobaan - a.percobaan; })[0];
          var ng = (pre !== null && postRec) ? D.nGain(pre, postRec.skor) : null;
          return { peserta: p, kehadiran: att.persen, att: att, kelulusan: kel, pre: pre, post: postRec ? postRec.skor : null, ngain: ng, nilaiList: pNilai };
        });
        return { rows: rows, summary: D.ringkasanKelas(rows) };
      }

      function providerBadge(url) {
        if (!url) return '<span class="muted small">Belum ada tautan</span>';
        var r = D.periksaTautan(url);
        if (!r.valid) return '<span class="badge badge-galat" title="' + esc(r.pesan) + '">Tautan tidak valid</span> <span class="small num-bad">' + esc(r.pesan) + '</span>';
        var lbl = r.penyedia === 'google_drive' ? 'Google Drive' : r.penyedia === 'google_docs' ? 'Google Docs' : 'HTTPS';
        return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" class="badge badge-selesai">' + UI.icon('link') + ' ' + lbl + '</a>';
      }

      // ---------------------------------------------------------------------------
      // Sub-tab 1: Formulir Absensi Peserta (Format Google Forms) + Sesi & Absensi (per JPL)

      function renderAbsensi(b, pel) {
        var att = computeAttendanceMap(pel);
        var totalJpl = att.sesiJpl.reduce(function (s, x) { return s + D.jpl(x.menit); }, 0);
        var minPct = (pel.aturanKelulusan ? pel.aturanKelulusan.kehadiranMin : 0.8);
        var dayOpts = buildBatchDayOptions(b, pel);
        var absLog = pel.absensiLog || [];
        var html = '';

        // Panel Formulir Absensi Peserta (sesuai Google Forms referensi)
        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">📋 Formulir Absensi Peserta Pelatihan <span class="count">' + absLog.length + ' isian</span></h3>' +
          '<div class="toolbar-actions">' +
          '<button type="button" class="btn btn-xs" data-dl-absen-pdf>⬇️ Daftar Hadir (.pdf)</button>' +
          '<button type="button" class="btn btn-xs" data-dl-absen-csv>⬇️ Unduh CSV</button>' +

          '</div></div>' +
          '<p class="panel-sub">Menggunakan format formulir absensi resmi (<strong>Name, Email, Institusi Tempat Kerja, Phone number, Kehadiran Peserta Pelatihan</strong>). Setiap pengisian otomatis mendaftarkan peserta &amp; mencatat hadir pada hari terkait.</p>' +
          '<form id="absen-gform" class="gform-card">' +
          '<div class="gform-head">' +
          '<h4>Absensi ' + esc(b.programName) + ' (' + esc(b.label) + ')</h4>' +
          '<p>' + UI.scheduleText(b) + ' · Semua kolom bertanda <span class="gform-req">*</span> wajib diisi.</p>' +
          '</div>' +
          '<div class="gform-grid">' +
          '<div class="gform-q"><label class="gform-label" for="gf-nama">Name <span class="gform-req">*</span></label>' +
          '<input id="gf-nama" type="text" name="nama" required placeholder="Nama lengkap peserta (beserta gelar)"></div>' +
          '<div class="gform-q"><label class="gform-label" for="gf-email">Email <span class="gform-req">*</span></label>' +
          '<input id="gf-email" type="email" name="email" required placeholder="email@institusi.id"></div>' +
          '<div class="gform-q full"><label class="gform-label" for="gf-inst">Institusi Tempat Kerja <span class="gform-req">*</span></label>' +
          '<input id="gf-inst" type="text" name="institusi" required placeholder="Rumah Sakit / Klinik / Puskesmas / Institusi asal"></div>' +
          '<div class="gform-q"><label class="gform-label" for="gf-hp">Phone number <span class="gform-req">*</span></label>' +
          '<input id="gf-hp" type="tel" name="telepon" required placeholder="Contoh: 0812xxxxxxxx"></div>' +
          '<div class="gform-q full"><span class="gform-label">Kehadiran Peserta Pelatihan <span class="gform-req">*</span></span>' +
          '<div class="gform-radio-list">' +
          dayOpts.map(function (d, idx) {
            return '<label class="gform-radio-opt">' +
              '<input type="radio" name="hariIdx" value="' + idx + '"' + (idx === 0 ? ' checked' : '') + ' required>' +
              '<span>' + esc(d.label) + '</span>' +
              '</label>';
          }).join('') +
          '</div>' +
          '</div>' +
          '</div>' +
          '<div class="form-actions" style="margin-top:12px">' +
          '<button type="submit" class="btn btn-primary">✓ Kirim Absensi Peserta</button>' +
          '</div>' +
          '</form>';

        if (absLog.length) {
          html += '<div class="table-wrap" style="margin-top:14px"><table class="table table-compact"><thead><tr>' +
            '<th>Waktu</th><th>Name</th><th>Email</th><th>Institusi Tempat Kerja</th><th>Phone number</th><th>Kehadiran Peserta Pelatihan</th><th></th></tr></thead><tbody>' +
            absLog.slice().reverse().map(function (r, rIdx) {
              var realIdx = absLog.length - 1 - rIdx;
              return '<tr><td class="nowrap small">' + esc(r.waktu || '-') + '</td>' +
                '<td><strong>' + esc(r.nama) + '</strong></td>' +
                '<td class="small">' + esc(r.email || '-') + '</td>' +
                '<td>' + esc(r.institusi || '-') + '</td>' +
                '<td class="nowrap small">' + esc(r.telepon || '-') + '</td>' +
                '<td><span class="badge badge-selesai">' + esc(r.hariLabel || ('Hari ' + (r.hariKe || 1))) + '</span></td>' +
                '<td class="right"><button type="button" class="icon-btn" data-del-abslog="' + realIdx + '">Hapus</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        } else {
          html += '<div class="empty-inline" style="margin-top:12px"><p>Belum ada isian formulir absensi di batch ini. Isi formulir di atas atau impor CSV Google Forms.</p></div>';
        }
        html += '</section>';

        // Panel Sesi
        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Jadwal Sesi &amp; JPL <span class="count">' + UI.dec(totalJpl) + ' JPL</span></h3>' +
          '<div class="toolbar-actions"><button type="button" class="btn btn-sm" data-add-sesi>+ Tambah Sesi</button>' +
          (pel.peserta.length ? '' : '<button type="button" class="btn btn-sm btn-ghost" data-load-golden>Muat Data Uji</button>') + '</div></div>' +
          '<p class="panel-sub">Kehadiran dihitung <strong>per JPL (1 JPL = 45 menit)</strong>. Baris non-JPL (Registrasi, Pembukaan, Pre Test, ISHOMA, Refleksi, Penutupan) tetap tersimpan agar jadwal utuh tetapi tidak memengaruhi persentase absensi.</p>';
        if (!pel.sesi.length) {
          html += '<div class="empty-inline"><p>Belum ada sesi. Tambahkan sesi materi (ber-JPL) atau sesi non-JPL.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>ID</th><th>Hari / Jam</th><th>Materi / Kegiatan</th><th>Narasumber</th><th class="num">Durasi</th><th>Jenis</th><th></th></tr></thead><tbody>' +
            pel.sesi.map(function (s, i) {
              return '<tr><td><strong>' + esc(s.id) + '</strong></td><td class="nowrap">Hari ' + esc(s.hari || 1) + ' · ' + esc(s.mulai || '–') + '–' + esc(s.selesai || '–') + '</td>' +
                '<td>' + esc(s.materi) + '</td><td class="small muted">' + esc(s.narasumber || '–') + '</td>' +
                '<td class="num nowrap">' + s.menit + ' mnt (' + (s.nonJpl ? '0 JPL' : UI.dec(D.jpl(s.menit)) + ' JPL') + ')</td>' +
                '<td>' + (s.nonJpl ? '<span class="badge badge-info">Non-JPL</span>' : '<span class="badge badge-selesai">Ber-JPL</span>') + '</td>' +
                '<td class="right"><button type="button" class="icon-btn" data-del-sesi="' + i + '">Hapus</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</section>';

        // Panel Peserta & Matriks Absensi
        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Rekap Kehadiran Peserta <span class="count">' + pel.peserta.length + ' peserta</span></h3>' +
          '<div class="toolbar-actions"><button type="button" class="btn btn-sm btn-primary" data-add-peserta>+ Tambah Peserta</button>' +
          '<a class="btn btn-sm" href="#/batch/' + encodeURIComponent(b.id) + '/impor">' + UI.icon('upload') + ' Impor Log Zoom</a></div></div>' +
          '<p class="panel-sub">Ambang minimal kehadiran: <strong>' + UI.pct(minPct) + '</strong> (asumsi BDI, dapat diubah di tab Evaluasi &amp; Nilai). <em>Hadir</em> &amp; <em>Terlambat</em> dihitung penuh (atau proporsional sesuai menit hadir Zoom); <em>Izin/Sakit/Alpa</em> = 0.</p>';

        if (!pel.peserta.length) {
          html += '<div class="empty-inline"><p>Belum ada peserta terdaftar pada modul pelaksanaan batch ini.</p></div>';
        } else {
          var byKey = {};
          (pel.kehadiran || []).forEach(function (c) { byKey[c.pesertaId + '|' + c.sesiId] = c; });
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Peserta</th>' +
            att.sesiJpl.map(function (s) { return '<th>' + esc(s.id) + '<div class="small muted">' + UI.dec(D.jpl(s.menit)) + ' JPL</div></th>'; }).join('') +
            '<th class="num">JPL Hadir</th><th class="num">% Hadir</th><th>Ambang</th><th></th></tr></thead><tbody>' +
            pel.peserta.map(function (p, idx) {
              var rec = att.map[p.id] || { jplHadir: 0, jplTotal: 0, persen: 0, belumDicatat: 0, alpa: 0 };
              var ok = att.sesiJpl.length > 0 && D.memenuhiKehadiran(rec.persen, minPct);
              return '<tr><td><strong>' + esc(p.nama) + '</strong><div class="small muted">' + esc(p.id) + ' · ' + esc(p.telepon || p.jk || '-') + ' · ' + esc(p.institusi || p.email || '') + '</div></td>' +
                att.sesiJpl.map(function (s) {
                  var c = byKey[p.id + '|' + s.id];
                  var st = c ? c.status : '';
                  var mh = (c && c.menitHadir !== undefined && c.menitHadir !== null) ? c.menitHadir : '';
                  return '<td class="nowrap"><select data-att-st data-p="' + esc(p.id) + '" data-s="' + esc(s.id) + '" style="min-height:28px;padding:2px 6px;font-size:12px">' +
                    '<option value="">– Belum –</option>' +
                    STATUS_HADIR.map(function (o) { return '<option value="' + o[0] + '"' + (st === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
                    '</select>' + (st === 'hadir' || st === 'terlambat' ? '<input type="number" data-att-min data-p="' + esc(p.id) + '" data-s="' + esc(s.id) + '" min="0" max="' + s.menit + '" placeholder="' + s.menit + 'm" title="Menit hadir (opsional, dari Zoom)" value="' + esc(mh) + '" style="width:58px;min-height:28px;padding:2px 5px;font-size:12px;margin-left:3px">' : '') + '</td>';
                }).join('') +
                '<td class="num nowrap">' + UI.dec(rec.jplHadir) + ' / ' + UI.dec(rec.jplTotal) + '</td>' +
                '<td class="num ' + (ok ? 'num-good' : 'num-bad') + '">' + UI.pct(rec.persen) + (rec.belumDicatat ? '<div class="small muted">' + rec.belumDicatat + ' belum dicatat</div>' : '') + '</td>' +
                '<td>' + (rec.belumDicatat ? '<span class="badge badge-info">Belum lengkap</span>' : ok ? '<span class="badge badge-aman">Memenuhi</span>' : '<span class="badge badge-terlambat">Di bawah ' + UI.pct(minPct) + '</span>') + '</td>' +
                '<td class="right"><button type="button" class="icon-btn" data-del-peserta="' + idx + '">Hapus</button></td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Sub-tab 2: Folder Materi, Modul & Buku (Kesiapan H-1 Kemenkes + Penugasan)

      function renderMateri(b, pel, ctx) {
        var stSub = subState(ctx, b.id);
        var sesiJpl = jplSesi(pel);
        var sesiIds = sesiJpl.map(function (s) { return s.id; });
        var start = b.eventStart || (b.plannedMonth + '-01');
        var evalMat = null;
        var today = (ctx && ctx.today) || window.App.today;
        try { evalMat = D.evaluasiMateri(start, sesiIds, pel.materi || [], today, Store.calendar()); } catch (e) { evalMat = null; }

        var folders = allFoldersForPel(pel);
        var activeFolderId = stSub.folder || 'all';
        var countByFolder = {};
        folders.forEach(function (f) { countByFolder[f.id] = 0; });
        (pel.materi || []).forEach(function (m) {
          var fid = itemFolderId(m);
          countByFolder[fid] = (countByFolder[fid] || 0) + 1;
        });
        var activeFolder = activeFolderId === 'all' ? null : (folders.filter(function (f) { return f.id === activeFolderId; })[0] || null);
        if (activeFolderId !== 'all' && !activeFolder) {
          activeFolderId = 'all';
          stSub.folder = 'all';
        }
        var visibleItems = [];
        (pel.materi || []).forEach(function (m, idx) {
          if (activeFolderId === 'all' || itemFolderId(m) === activeFolderId) {
            visibleItems.push({ item: m, index: idx });
          }
        });

        var html = '';
        if (evalMat) {
          var nCls = evalMat.risiko === 'selesai' ? 'notice-ok' : evalMat.risiko === 'terlambat' ? 'notice-error' : evalMat.risiko === 'segera' ? 'notice-warn' : '';
          html += '<div class="notice ' + nCls + '"><p><strong>Kesiapan Materi Kemenkes (H-1): ' + esc(evalMat.risiko.toUpperCase()) + '</strong> — ' + UI.humanize(evalMat.pesan) +
            ' <span class="small">(Target final internal: <strong>' + UI.fmtDate(evalMat.targetFinal, 'med') + '</strong> · Tenggat unggah H-1: <strong>' + UI.fmtDate(evalMat.tenggatUnggah, 'med') + '</strong>)</span></p></div>';
        }

        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">📂 Folder Modul, CV Narasumber &amp; Materi Pembelajaran <span class="count">' + pel.materi.length + ' berkas</span></h3>' +
          '<div class="toolbar-actions">' +
          '<button type="button" class="btn btn-sm" data-add-folder>+ Buat Folder</button>' +
          '<button type="button" class="btn btn-sm btn-primary" data-add-materi>+ Tambah Modul / Tautan</button>' +
          '</div></div>' +
          '<p class="panel-sub">Kelola modul pelatihan, CV narasumber, informasi penyelenggaraan, dan berkas H-1 per folder. Klik folder untuk menyaring atau unggah langsung file PDF/DOCX/PPT ke dalam folder tersebut.</p>';

        if (evalMat && evalMat.kurang.length) {
          html += '<div class="notice notice-warn"><p><strong>Masih kurang ' + evalMat.kurang.length + ' syarat wajib untuk diunggah:</strong> ' +
            evalMat.kurang.map(function (k) {
              return k.sesiId ? ('Sesi ' + k.sesiId + ' butuh bahan tayang/modul') : (k.butuh === 'informasi_penyelenggaraan' ? 'Informasi Penyelenggaraan' : 'Instrumen Evaluasi');
            }).join(' · ') + '</p></div>';
        }

        // Grid Folder
        html += '<div class="mat-folder-grid">' +
          '<button type="button" class="mat-folder-card' + (activeFolderId === 'all' ? ' active' : '') + '" data-sel-folder="all">' +
          '<div class="mat-folder-top"><span class="mat-folder-ico">' + (activeFolderId === 'all' ? '📂' : '🗂️') + '</span><span class="badge badge-info">' + pel.materi.length + ' item</span></div>' +
          '<div class="mat-folder-name">Semua Folder</div>' +
          '<div class="mat-folder-desc">Tampilkan seluruh modul, CV narasumber &amp; berkas batch</div>' +
          '</button>' +
          folders.map(function (fl) {
            var isAct = activeFolderId === fl.id;
            var cnt = countByFolder[fl.id] || 0;
            return '<div class="mat-folder-card' + (isAct ? ' active' : '') + '" role="button" tabindex="0" data-sel-folder="' + esc(fl.id) + '">' +
              '<div class="mat-folder-top"><span class="mat-folder-ico">' + (isAct ? '📂' : '📁') + '</span>' +
              '<span style="display:flex;align-items:center;gap:4px"><span class="badge ' + (cnt ? 'badge-selesai' : '') + '">' + cnt + ' item</span>' +
              (!fl.builtin ? '<button type="button" class="icon-btn" data-del-folder="' + esc(fl.id) + '" title="Hapus folder kustom" style="padding:2px 6px">×</button>' : '') +
              '</span></div>' +
              '<div class="mat-folder-name">' + esc(fl.nama) + '</div>' +
              '<div class="mat-folder-desc">' + esc(fl.deskripsi) + '</div>' +
              '</div>';
          }).join('') +
          '</div>';

        // Strip Unggah File Langsung ke Folder Aktif
        var targetFolderName = activeFolder ? activeFolder.nama : 'Modul Pelatihan';
        html += '<div class="mat-upload-strip">' +
          '<div><strong>' + (activeFolder ? '📂 Folder: ' + esc(activeFolder.nama) : '🗂️ Unggah Cepat ke Folder Modul') + '</strong>' +
          '<div class="small muted">Pilih langsung file PDF Modul, CV Narasumber, atau DOCX/PPT dari komputer/HP Anda (tersimpan aman di browser).</div></div>' +
          '<label class="btn btn-sm btn-primary" style="cursor:pointer;margin:0">⬆️ Upload File ke "' + esc(targetFolderName) + '"' +
          '<input type="file" id="mat-upload-file" multiple accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.epub,.txt,.png,.jpg,.jpeg" style="display:none"></label>' +
          '</div>';

        if (!visibleItems.length) {
          html += '<div class="empty-inline"><p>Belum ada berkas atau tautan di ' + (activeFolder ? 'folder <strong>' + esc(activeFolder.nama) + '</strong>' : 'daftar materi') + '. Unggah file di atas atau klik <strong>+ Tambah Modul / Tautan</strong>.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Judul Modul / Berkas</th><th>Folder &amp; Jenis</th><th>Cakupan</th><th>Berkas / Tautan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' +
            visibleItems.map(function (entry) {
              var m = entry.item, i = entry.index;
              var next = NEXT_MATERI[m.status];
              var flObj = folders.filter(function (x) { return x.id === itemFolderId(m); })[0];
              var fileCell = m.fileId
                ? '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">' +
                '<button type="button" class="btn btn-xs" data-prev-file="' + esc(m.fileId) + '" data-prev-name="' + esc(m.fileName || m.judul) + '">📄 Pratinjau</button>' +
                '<button type="button" class="btn btn-xs btn-ghost" data-dl-file="' + esc(m.fileId) + '" data-dl-name="' + esc(m.fileName || m.judul) + '">⬇️</button>' +
                '<span class="small muted">' + esc(window.FileBinStore ? window.FileBinStore.fmtBytes(m.fileSize) : '') + '</span>' +
                '</div>'
                : providerBadge(m.tautan);
              return '<tr><td><strong>' + esc(m.judul) + '</strong>' + (m.fileName ? '<div class="small muted">' + esc(m.fileName) + '</div>' : '') + '</td>' +
                '<td><span class="badge badge-info">📁 ' + esc(flObj ? flObj.nama : itemFolderId(m)) + '</span><div class="small muted">' + esc(JENIS_MATERI[m.jenis] || m.jenis) + '</div></td>' +
                '<td class="nowrap">' + (m.sesiId ? 'Sesi ' + esc(m.sesiId) : 'Seluruh batch') + '</td>' +
                '<td>' + fileCell + '</td>' +
                '<td><span class="badge badge-' + m.status + '">' + esc(STATUS_MATERI[m.status] || m.status) + '</span></td>' +
                '<td class="nowrap">' + (next ? '<button type="button" class="btn btn-xs btn-primary" data-mat-adv="' + i + '">→ ' + esc(STATUS_MATERI[next]) + '</button> ' : '') +

                '<td class="small nowrap">' + esc(ar.importedAt || '-') + '</td>' +

        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Nilai, Remedial, N-gain &amp; Keputusan Kelulusan</h3>' +

        if (!pel.peserta.length) {

          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Peserta</th><th class="num">Hadir</th><th class="num">Pre Test</th>' +

              var k = r.kelulusan;

                pel.komponen.map(function (c) {
                  var n = lastMap[c.id];
                  if (!n) return '<td class="num muted">–</td>';
                  var remTag = n.percobaan > 1 ? ' <span class="small muted">(R' + (n.percobaan - 1) + ')</span>' : '';
                  return '<td class="num ' + (n.skor < c.nilaiMin ? 'num-bad' : '') + '">' + n.skor + remTag + '</td>';
                }).join('') +
                '<td class="num strong">' + (k.nilaiAkhir !== null ? k.nilaiAkhir : '–') + '</td>' +

        html += '</section>';

        var resPen = D.ringkasanKepuasan((pel.kepuasan.penyelenggaraan || []).map(function (x) { return x.jawaban; }), aspPen.map(function (a) { return a.kode; }));

        var html = '<div class="detail-grid">';

        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Evaluasi Fasilitator (8 Aspek BDI)</h3>' +
          '<button type="button" class="btn btn-xs btn-primary" data-add-kep="fasilitator">+ Tambah Responden</button></div>' +

      // ---------------------------------------------------------------------------
      // Sub-tab 5: Laporan Kegiatan Resmi BDI + Pemeriksa Angka Laporan (L01–L05)

      function buildDataLaporan(pel, demoMismatch) {
        if (demoMismatch) {
          return {
            pesertaTerdaftar: 145, pesertaLulus: 136,
            jenisKelamin: { L: 42, P: 268 },
            progresLms: { '0-<100': 4, '100': 305 },
            rating: { '5': 294 }, jumlahUlasan: 294,
            nilaiPre: { min: 0, max: 90, rata: 44 }, nilaiPost: { min: 0, max: 100, rata: 87 }
          };
        }
        var att = computeAttendanceMap(pel);
        var g = computeGrades(pel, att.map);
        var L = pel.peserta.filter(function (p) { return p.jk === 'L'; }).length;
        var P = pel.peserta.filter(function (p) { return p.jk === 'P'; }).length;
        var lms = pel.ringkasanLms;
        return {
          pesertaTerdaftar: pel.peserta.length,
          pesertaLulus: g.summary.lulus,
          jenisKelamin: { L: L, P: P },
          progresLms: lms.progres,
          rating: lms.rating,
          jumlahUlasan: lms.jumlahUlasan,
          nilaiPre: lms.nilaiPre,
          nilaiPost: lms.nilaiPost
        };

        var att = computeAttendanceMap(pel);
        var g = computeGrades(pel, att.map);
        var aspAll = SEED.pembelajaran.aspek_kepuasan;
