            : '<p class="muted small">Belum ada tautan materi. Tambahkan di tab Pelaksanaan → Materi H-1.</p>') + '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Tab Utama: Impor Berkas (Zoom, LMS Plataran Sehat, Google Forms)

      function renderImporTab(b) {
        var pel = Store.getPelaksanaan(b.id);
        var sesiJpl = jplSesi(pel);
        var html = '<section class="panel"><h3 class="panel-title">' + UI.icon('upload') + ' Impor Data dari Zoom, LMS Plataran Sehat, atau Google Forms</h3>' +
          '<p class="panel-sub">Unggah file <code>.csv</code> atau tempel langsung isi tabel (CSV/TSV dari Excel). Baris yang cocok akan masuk otomatis; baris yang tidak dikenali (email/nama tidak cocok atau skor tidak valid) akan ditolak dengan alasan jelas dan dicatat di riwayat impor.</p>' +
          '<form id="impor-form">' +
          '<div class="form-grid" style="margin-bottom:12px">' +
          '<label class="field"><span>Jenis Impor</span><select name="jenis" id="imp-jenis">' +
          '<option value="kehadiran_zoom">Log Kehadiran Zoom (email/nama, menit_hadir, status)</option>' +
          '<option value="nilai_lms">Nilai LMS Plataran Sehat (email/nama, komponen, skor, percobaan)</option>' +
          '<option value="evaluasi_forms">Evaluasi Penyelenggaraan Google Forms (materi, narasumber, praktik, waktu, platform, panitia, manfaat)</option>' +
          '</select></label>' +
          '<label class="field" id="imp-sesi-wrap"><span>Untuk Sesi (khusus Zoom)</span><select name="sesiId">' +
          (sesiJpl.length ? sesiJpl.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.id + ' — ' + s.materi) + '</option>'; }).join('') : '<option value="">(Tambah sesi di tab Pelaksanaan dulu)</option>') +
          '</select></label>' +
          '<label class="field"><span>Pilih file CSV (opsional)</span><input type="file" id="imp-file" accept=".csv,.tsv,.txt"></label>' +
          '</div>' +
          '<label class="field"><span>Atau tempel teks CSV / tabel di sini</span>' +
          '<textarea name="raw" id="imp-raw" rows="6" placeholder="email,menit_hadir,status&#10;p1@contoh.bdi.id,180,hadir&#10;p2@contoh.bdi.id,120,terlambat"></textarea></label>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Proses Impor</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" data-fill-sample>Isi Contoh CSV</button></div>' +
          '</form></section>';

        // Riwayat Impor
        html += '<section class="panel"><h3 class="panel-title">Riwayat Impor <span class="count">' + pel.imporLog.length + '</span></h3>';
        if (!pel.imporLog.length) {
          html += '<div class="empty-inline"><p>Belum ada riwayat impor pada batch ini.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="table table-compact"><thead><tr><th>Waktu</th><th>Jenis</th><th class="num">Diterima</th><th class="num">Ditolak</th><th>Rincian Baris Ditolak</th></tr></thead><tbody>' +
            pel.imporLog.slice().reverse().map(function (l) {
              return '<tr><td class="nowrap small">' + esc(l.waktu) + '</td><td>' + esc(l.jenis) + '</td>' +
                '<td class="num num-good">' + l.diterima + '</td><td class="num ' + (l.ditolak ? 'num-bad' : '') + '">' + l.ditolak + '</td>' +
                '<td class="small">' + (l.detailDitolak && l.detailDitolak.length ? l.detailDitolak.map(function (d) { return 'Baris ' + d.baris + ': ' + esc(d.alasan); }).join('<br>') : '<span class="muted">Semua baris valid</span>') + '</td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</section>';
        return html;
      }

      // ---------------------------------------------------------------------------
      // Mount Event Listeners untuk Pelaksanaan, Berkas & Impor

      function mountPelaksanaan(root, bOrCtx, maybeCtx, maybeTab) {
        var b, ctx, tab;
        if (bOrCtx && bOrCtx.today !== undefined && bOrCtx.refresh !== undefined) {
          ctx = bOrCtx;
          var bId = typeof maybeCtx === 'string' ? maybeCtx : (maybeCtx && maybeCtx.id ? maybeCtx.id : (ctx.params && ctx.params.batchId) || Store.prefs().lastBatchId);
          b = Store.getBatch(bId) || Store.getBatches()[0];
          tab = maybeTab;
        } else {
          b = typeof bOrCtx === 'string' ? Store.getBatch(bOrCtx) : bOrCtx;
          ctx = maybeCtx;
          tab = maybeTab;
        }
        if (!b) b = Store.getBatches()[0];
        if (!ctx) ctx = window.App || {};
        var pel = Store.getPelaksanaan(b.id);
        var st = subState(ctx, b.id);
        var save = function () { Store.savePelaksanaan(b.id, pel); };

        root.querySelectorAll('[data-pel-sub]').forEach(function (btn) {
          btn.addEventListener('click', function () { st.sub = btn.getAttribute('data-pel-sub'); ctx.refresh(); });
        });

        root.querySelectorAll('[data-load-golden]').forEach(function (btn) {
          if (btn.dataset.bound) return;
          btn.dataset.bound = '1';
          btn.addEventListener('click', function () {
            var bId = btn.getAttribute('data-load-golden') || b.id;
            Store.loadGoldenSample(bId);
            UI.toast('Data contoh (8 peserta, nilai, materi, kepuasan, laporan) berhasil dimuat!', 'ok');
            ctx.refresh();
          });
        });

        // Tambah / Hapus Sesi
        var addSesi = root.querySelector('[data-add-sesi]');
        if (addSesi) addSesi.addEventListener('click', function () {
          UI.dialog({
            title: 'Tambah Sesi Jadwal',
            body: '<div class="form-grid">' +
              '<label class="field"><span>Kode Sesi</span><input type="text" name="id" value="S' + (pel.sesi.length + 1) + '" required></label>' +
              '<label class="field"><span>Hari ke-</span><input type="number" name="hari" min="1" value="1" required></label>' +
              '<label class="field"><span>Jam Mulai</span><input type="text" name="mulai" value="08:00" placeholder="08:00"></label>' +
              '<label class="field"><span>Jam Selesai</span><input type="text" name="selesai" value="09:30" placeholder="09:30"></label>' +
              '<label class="field field-wide"><span>Nama Materi / Kegiatan</span><input type="text" name="materi" required placeholder="Contoh: Bantuan Hidup Dasar atau Registrasi"></label>' +
              '<label class="field"><span>Durasi (menit)</span><input type="number" name="menit" min="5" step="5" value="90" required><small class="hint">1 JPL = 45 menit (90 mnt = 2 JPL)</small></label>' +
              '<label class="field"><span>Narasumber</span><input type="text" name="narasumber" placeholder="Opsional"></label>' +
              '<label class="check field-wide"><input type="checkbox" name="nonJpl"> Baris Non-JPL (Registrasi, Pre Test, ISHOMA, Penutupan — tidak masuk hitungan absensi)</label></div>',
            submitLabel: 'Tambah Sesi',
            onSubmit: function (fm) {
              var sid = fm.elements.id.value.trim();
              var mat = fm.elements.materi.value.trim();
              var mnt = Number(fm.elements.menit.value);
              if (!sid || !mat || !mnt) return 'Lengkapi kode, materi, dan durasi menit.';
              pel.sesi.push({ id: sid, hari: Number(fm.elements.hari.value) || 1, mulai: fm.elements.mulai.value.trim(), selesai: fm.elements.selesai.value.trim(), materi: mat, menit: mnt, nonJpl: fm.elements.nonJpl.checked, narasumber: fm.elements.narasumber.value.trim() });
              save(); UI.toast('Sesi ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-del-sesi]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            pel.sesi.splice(Number(btn.getAttribute('data-del-sesi')), 1);
            save(); ctx.refresh();
          });
        });

        // Tambah / Hapus Peserta
        var addP = root.querySelector('[data-add-peserta]');
        if (addP) addP.addEventListener('click', function () {
          UI.dialog({
            title: 'Tambah Peserta',
            body: '<div class="form-grid">' +
              '<label class="field"><span>Kode Peserta</span><input type="text" name="id" value="P' + (pel.peserta.length + 1) + '" required></label>' +
              '<label class="field"><span>Jenis Kelamin</span><select name="jk"><option value="P">Perempuan (P)</option><option value="L">Laki-laki (L)</option></select></label>' +
              '<label class="field field-wide"><span>Nama Lengkap</span><input type="text" name="nama" required placeholder="Contoh: Ns. Anita Sari"></label>' +
              '<label class="field"><span>Email (untuk pencocokan Zoom/LMS)</span><input type="text" name="email" placeholder="nama@rs.id"></label>' +
              '<label class="field"><span>Institusi / RS</span><input type="text" name="institusi" placeholder="RSU Bunda..."></label></div>',
            submitLabel: 'Tambah Peserta',
            onSubmit: function (fm) {
              var pid = fm.elements.id.value.trim(), nama = fm.elements.nama.value.trim();
              if (!pid || !nama) return 'Kode dan nama peserta wajib diisi.';
              pel.peserta.push({ id: pid, nama: nama, email: fm.elements.email.value.trim(), jk: fm.elements.jk.value, institusi: fm.elements.institusi.value.trim() });
              save(); UI.toast('Peserta ditambahkan.', 'ok'); ctx.refresh();
            }
          });
        });
        root.querySelectorAll('[data-del-peserta]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            pel.peserta.splice(Number(btn.getAttribute('data-del-peserta')), 1);
            save(); ctx.refresh();
          });
        });

        // Update Absensi
        root.querySelectorAll('[data-att-st]').forEach(function (sel) {
          sel.addEventListener('change', function () {
            var pid = sel.getAttribute('data-p'), sid = sel.getAttribute('data-s'), val = sel.value;
            pel.kehadiran = pel.kehadiran.filter(function (c) { return !(c.pesertaId === pid && c.sesiId === sid); });
            if (val) pel.kehadiran.push({ pesertaId: pid, sesiId: sid, status: val });
            save(); ctx.refresh();
          });
        });
        root.querySelectorAll('[data-att-min]').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var pid = inp.getAttribute('data-p'), sid = inp.getAttribute('data-s');
            var rec = pel.kehadiran.filter(function (c) { return c.pesertaId === pid && c.sesiId === sid; })[0];
            if (!rec) return;
            if (inp.value === '') delete rec.menitHadir;
            else rec.menitHadir = Number(inp.value);
            save(); ctx.refresh();
          });
        });

        // Formulir Absensi Google-Forms Style
        function upsertAbsensiPeserta(nama, email, institusi, telepon, hariLabel, hariKe, waktuStr) {
          if (!pel.absensiLog) pel.absensiLog = [];
          pel.absensiLog.push({
            id: Store.uid('abs-'),
            waktu: waktuStr || new Date().toLocaleString('id-ID'),
            nama: nama,
            email: email,
            institusi: institusi,
            telepon: telepon,
            hariLabel: hariLabel,
            hariKe: hariKe
          });
          var emLow = (email || '').toLowerCase();
          var nmLow = (nama || '').toLowerCase();
          var p = pel.peserta.filter(function (x) {
            return (emLow && x.email && x.email.toLowerCase() === emLow) || (nmLow && x.nama.toLowerCase() === nmLow);
          })[0];
          if (!p) {
            p = { id: 'P' + (pel.peserta.length + 1), nama: nama, email: email, jk: '-', institusi: institusi, telepon: telepon };
            pel.peserta.push(p);
          } else {
            if (institusi) p.institusi = institusi;
            if (telepon) p.telepon = telepon;
            if (email && !p.email) p.email = email;
          }
          jplSesi(pel).forEach(function (s) {
            if (Number(s.hari || 1) === Number(hariKe || 1)) {
              pel.kehadiran = pel.kehadiran.filter(function (c) { return !(c.pesertaId === p.id && c.sesiId === s.id); });
              pel.kehadiran.push({ pesertaId: p.id, sesiId: s.id, status: 'hadir' });
            }
          });
        }

        var absGform = root.querySelector('#absen-gform');
        if (absGform) {
          absGform.addEventListener('submit', function (e) {
            e.preventDefault();
            var fm = absGform.elements;
            var nama = (fm.nama.value || '').trim();
            var email = (fm.email.value || '').trim();
            var inst = (fm.institusi.value || '').trim();
            var telp = (fm.telepon.value || '').trim();
            var dayOpts = buildBatchDayOptions(b, pel);
            var idx = Number(fm.hariIdx ? fm.hariIdx.value : 0) || 0;
            var dOpt = dayOpts[idx] || dayOpts[0] || { hariKe: 1, label: 'Hari 1' };
            if (!nama || !email || !inst || !telp) { UI.toast('Semua kolom wajib diisi.', 'error'); return; }
            upsertAbsensiPeserta(nama, email, inst, telp, dOpt.label, dOpt.hariKe);
            save();
            UI.toast('Absensi ' + nama + ' (' + dOpt.label + ') tersimpan & tersinkron ke Rekap!', 'ok');
            ctx.refresh();
          });
        }
        root.querySelectorAll('[data-del-abslog]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (!pel.absensiLog) return;
            pel.absensiLog.splice(Number(btn.getAttribute('data-del-abslog')), 1);
            save(); ctx.refresh();
          });
        });
        var dlAbsPdf = root.querySelector('[data-dl-absen-pdf]');
        if (dlAbsPdf) dlAbsPdf.addEventListener('click', function () {
          if (!window.PDFUtil) return;
          var log = pel.absensiLog || [];
          window.PDFUtil.downloadPdf('Daftar_Hadir_' + b.id + '.pdf', {
            kopTop: Store.settings().lembaga.nama,
            title: 'DAFTAR HADIR PESERTA PELATIHAN',
            subtitle: b.programName + ' (' + b.id + ') - ' + UI.scheduleText(b),
            sections: [
              {
                heading: 'REKAP ISIAN FORMULIR ABSENSI PESERTA (' + log.length + ' ISIAN)',
                table: {
                  headers: ['No', 'Name', 'Email', 'Institusi Tempat Kerja', 'Phone number', 'Kehadiran'],
                  widths: [0.4, 1.5, 1.5, 1.6, 1.0, 1.5],
                  rows: log.length ? log.map(function (r, idx) {
                    return [String(idx + 1), r.nama, r.email || '-', r.institusi || '-', r.telepon || '-', r.hariLabel || '-'];
                  }) : [['-', 'Belum ada isian absensi', '-', '-', '-', '-']]
                }
              }
            ],
            footer: 'Daftar Hadir ' + b.id + ' - Tim Training BDI'
          });
          UI.toast('Daftar Hadir PDF berhasil diunduh.', 'ok');
        });
        var dlAbsCsv = root.querySelector('[data-dl-absen-csv]');
        if (dlAbsCsv) dlAbsCsv.addEventListener('click', function () {
          var log = pel.absensiLog || [];
          var csvEsc = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
          var lines = ['Waktu,Name,Email,Institusi Tempat Kerja,Phone number,Kehadiran Peserta Pelatihan'];
          log.forEach(function (r) {
            lines.push([r.waktu, r.nama, r.email, r.institusi, r.telepon, r.hariLabel].map(csvEsc).join(','));
          });
          UI.download('Absensi_' + b.id + '.csv', lines.join('\n'), 'text/csv;charset=utf-8', 'Log absensi CSV berhasil diunduh.');
        });
        var impAbsBtn = root.querySelector('[data-imp-absen-csv]');
        if (impAbsBtn) impAbsBtn.addEventListener('click', function () {
          var dayOpts = buildBatchDayOptions(b, pel);
          UI.dialog({
            title: 'Impor Respon Absensi dari Google Forms (.csv)',
            body: '<p class="small muted">Tempel data CSV hasil unduhan Google Forms (kolom: <code>Name, Email, Institusi Tempat Kerja, Phone number, Kehadiran Peserta Pelatihan</code>).</p>' +
              '<label class="field"><span>Pilih file CSV (opsional)</span><input type="file" id="dlg-abs-file" accept=".csv,.tsv,.txt"></label>' +
              '<label class="field"><span>Teks CSV</span><textarea name="raw" rows="6" required placeholder="Name,Email,Institusi Tempat Kerja,Phone number,Kehadiran Peserta Pelatihan\nNs. Ani,ani@rs.id,RSU Bunda,08123456789,' + esc(dayOpts[0] ? dayOpts[0].label : 'Hari 1') + '"></textarea></label>',
            submitLabel: 'Impor Absensi',
            onOpen: function (dlgRoot) {
              var fi = dlgRoot.querySelector('#dlg-abs-file');
              if (fi) fi.addEventListener('change', function (ev) {
                var f = ev.target.files && ev.target.files[0];
                if (!f) return;
                var rd = new FileReader();
                rd.onload = function () { dlgRoot.querySelector('[name="raw"]').value = String(rd.result); };
                rd.readAsText(f);
              });
            },
            onSubmit: function (fm) {
              var parsed = UI.parseDelimited(fm.elements.raw.value);
              if (!parsed.rows.length) return 'Data CSV masih kosong.';
              var okCnt = 0;
              parsed.rows.forEach(function (r) {
                var nm = (r.name || r.nama || '').trim();
                if (!nm) return;
                var em = (r.email || '').trim();
                var inst = (r.institusi_tempat_kerja || r.institusi || '').trim();
                var hp = (r.phone_number || r.telepon || r.no_hp || '').trim();
                var hLbl = (r.kehadiran_peserta_pelatihan || r.kehadiran || '').trim() || (dayOpts[0] ? dayOpts[0].label : 'Hari 1');
                var matchedDay = dayOpts.filter(function (d) { return hLbl.toLowerCase().indexOf(d.label.toLowerCase().slice(0, 10)) !== -1; })[0];
                upsertAbsensiPeserta(nm, em, inst, hp, hLbl, matchedDay ? matchedDay.hariKe : 1, (r.timestamp || '').trim());
                okCnt++;
              });
              save();
              UI.toast('Berhasil mengimpor ' + okCnt + ' respon absensi.', 'ok');
              ctx.refresh();
            }
          });
        });

        // Materi H-1 (Sistem Folder, Upload File Lokal & Tautan)
        root.querySelectorAll('[data-sel-folder]').forEach(function (card) {
          card.addEventListener('click', function (e) {
            if (e.target && e.target.closest && e.target.closest('[data-del-folder]')) return;
            st.folder = card.getAttribute('data-sel-folder') || 'all';
            ctx.refresh();
          });
        });
        root.querySelectorAll('[data-del-folder]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var fid = btn.getAttribute('data-del-folder');
            pel.materiFolders = (pel.materiFolders || []).filter(function (f) { return f.id !== fid; });
            if (st.folder === fid) st.folder = 'all';
            save(); UI.toast('Folder kustom dihapus.', 'ok'); ctx.refresh();
          });
        });
        var addFolderBtn = root.querySelector('[data-add-folder]');
        if (addFolderBtn) addFolderBtn.addEventListener('click', function () {
          UI.dialog({
            title: 'Buat Folder Materi / Modul Baru',
            body: '<label class="field"><span>Nama Folder</span><input type="text" name="nama" required placeholder="Contoh: Modul Hari 1 / Referensi Jurnal"></label>' +
              '<label class="field"><span>Kategori Isi Utama</span><select name="jenis">' + Object.keys(JENIS_MATERI).map(function (k) { return '<option value="' + k + '">' + JENIS_MATERI[k] + '</option>'; }).join('') + '</select></label>' +
              '<label class="field"><span>Keterangan Singkat</span><input type="text" name="desc" placeholder="Deskripsi isi folder (opsional)"></label>',
            submitLabel: 'Buat Folder',
            onSubmit: function (fm) {
              var nm = fm.elements.nama.value.trim();
              if (!nm) return 'Isi nama folder.';
              if (!pel.materiFolders) pel.materiFolders = [];
              var fid = Store.uid('fld-');
              pel.materiFolders.push({ id: fid, nama: nm, deskripsi: fm.elements.desc.value.trim() || 'Folder berkas tim BDI', jenisDefault: fm.elements.jenis.value });
              st.folder = fid;
              save(); UI.toast('Folder "' + nm + '" dibuat.', 'ok'); ctx.refresh();
            }
          });
        });
        var matUploadInp = root.querySelector('#mat-upload-file');
        if (matUploadInp) matUploadInp.addEventListener('change', function (e) {
          var files = Array.prototype.slice.call(e.target.files || []);
          if (!files.length || !window.FileBinStore) return;
          var folders = allFoldersForPel(pel);
          var targetId = st.folder && st.folder !== 'all' ? st.folder : 'modul';
          var flObj = folders.filter(function (x) { return x.id === targetId; })[0] || folders[0];
          Promise.all(files.map(function (file) {
            var fileId = Store.uid('bin-');
            return window.FileBinStore.put(fileId, file, { name: file.name, type: file.type }).then(function (rec) {
              pel.materi.push({
                id: Store.uid('mat-'),
                folderId: targetId,
                sesiId: null,
                jenis: flObj ? flObj.jenisDefault : 'modul',
                judul: file.name.replace(/\.[^.]+$/, ''),
                tautan: '',
                fileId: fileId,
                fileName: file.name,
                fileSize: rec.size,
                fileMime: file.type,
                versi: 1,
                status: 'final',
                statusTautan: 'baik'
              });
            });
          })).then(function () {
            save();
            UI.toast(files.length + ' berkas berhasil dimasukkan ke folder "' + (flObj ? flObj.nama : targetId) + '".', 'ok');
            ctx.refresh();
          });
        });
        root.querySelectorAll('[data-prev-file]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (window.FileBinStore) window.FileBinStore.preview(btn.getAttribute('data-prev-file'), btn.getAttribute('data-prev-name'));
          });
        });
        root.querySelectorAll('[data-dl-file]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (window.FileBinStore) window.FileBinStore.download(btn.getAttribute('data-dl-file'), btn.getAttribute('data-dl-name'));
          });
        });
        var addMat = root.querySelector('[data-add-materi]');
        if (addMat) addMat.addEventListener('click', function () {
          var sesiJpl = jplSesi(pel);
          var folders = allFoldersForPel(pel);
          var defFolder = (st.folder && st.folder !== 'all') ? st.folder : 'modul';
          var pickedFile = null;
          UI.dialog({
            title: 'Tambah Modul / Buku / Tautan Materi',
            body: '<label class="field"><span>Simpan di Folder</span><select name="folderId">' +
              folders.map(function (fl) { return '<option value="' + esc(fl.id) + '"' + (fl.id === defFolder ? ' selected' : '') + '>📁 ' + esc(fl.nama) + '</option>'; }).join('') +
              '</select></label>' +
              '<label class="field"><span>Judul Modul / Buku / Materi</span><input type="text" name="judul" required placeholder="Contoh: Modul BTCLS / Buku Ajar Keperawatan"></label>' +

        return '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px;flex-wrap:wrap">' +
          '<strong>Pantau Kuota &amp; Keputusan Kegiatan</strong>' + UI.decisionBadge(b) +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px">' +
          '<span>Pendaftar: <strong>' + reg + '</strong> / ' + b.quota + ' (' + pct + '%) · Minimal jalan: <strong>' + b.quotaMin + '</strong></span>' +
          '</div>' +
          '<div class="quota-bar"><div class="quota-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
          (b.rescheduleFrom ? '<p class="small num-warn">Pernah di-reschedule dari jadwal awal: <strong>' + esc(b.rescheduleFrom) + '</strong></p>' : '') +
          (b.keputusanCatatan ? '<p class="small muted">Catatan keputusan: ' + esc(b.keputusanCatatan) + '</p>' : '') +
          '<p class="small muted">' + (minN !== null ? ('Peserta minimal RAB untuk target margin: <strong>' + minN + ' peserta</strong>. ' + (reg >= minN ? '<span class="num-good">Target RAB tercapai!</span>' : 'Kurang ' + (minN - reg) + ' peserta lagi.')) : 'Buat RAB di tab RAB untuk melihat peserta minimal target 40%.') + '</p>' +
          '<div class="dec-quick-btns">' +
          '<button type="button" class="btn btn-xs btn-dec-kak" data-quick-dec="kak">📄 KAK</button>' +
          '<button type="button" class="btn btn-xs btn-dec-ongoing" data-quick-dec="ongoing">🔵 On Going</button>' +
          '<button type="button" class="btn btn-xs btn-dec-jalan" data-quick-dec="jalan">🟢 Terlaksana</button>' +
          '<button type="button" class="btn btn-xs btn-dec-resch" data-quick-dec="reschedule">🟠 Reschedule</button>' +
          '<button type="button" class="btn btn-xs btn-dec-cancel" data-quick-dec="cancel">🔴 Cancel</button>' +
          '</div>' +
          '</div>';
      }

      function ringkasan(b, row, ctx) {
        var ev = row.ev;
        var html = '<div class="detail-grid"><section class="panel"><h3 class="panel-title">Data Pelaksanaan Batch</h3><form class="form-grid" id="batch-form" novalidate>';
        html += '<label class="field"><span>Tanggal pasti hari pertama</span><input type="date" id="f-event" name="eventStart" value="' + esc(b.eventStart || '') + '" min="2027-01-01" max="2027-12-31">' +
          '<small class="hint">Rencana: ' + UI.fmtMonth(b.plannedMonth) + '. Kosongkan untuk memakai perkiraan tanggal 1.' +
          (b.eventStart && b.eventStart.slice(0, 7) !== b.plannedMonth ? ' <span class="num-warn">Berbeda dari bulan rencana.</span>' : '') + '</small></label>';
        html += '<label class="field"><span>Metode</span><select id="f-metode" name="metode">' +
          [['', 'Belum dipilih'], ['Luring', 'Luring (klasikal)'], ['Daring', 'Daring'], ['Blended', 'Blended']].map(function (o) {
            return '<option value="' + o[0] + '"' + (b.metode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') + '</select></label>';
        html += '<label class="field"><span>Cakupan (KAK butir 7)</span><select name="cakupan">' +
          [['nasional', 'Nasional'], ['lokal', 'Lokal']].map(function (o) { return '<option value="' + o[0] + '"' + (b.cakupan === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';
        html += '<label class="field"><span>Bentuk kegiatan (KAK butir 8)</span><select name="bentuk">' +
          [['mandiri', 'Mandiri'], ['kerja sama', 'Kerja sama']].map(function (o) { return '<option value="' + o[0] + '"' + (b.bentuk === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';
        html += '<label class="field"><span>Mitra kerja sama (jika ada)</span><input type="text" name="mitra" maxlength="160" value="' + esc(b.mitra) + '" placeholder="Nama RS / organisasi mitra"></label>';
        html += '<label class="field"><span>Total SKP (opsional)</span><input type="text" name="skp" maxlength="40" value="' + esc(b.skp) + '" placeholder="Contoh: 12 SKP"></label>';
        html += '<label class="field field-wide"><span>Tempat atau link Zoom / meeting</span><input type="text" id="f-tempat" name="tempat" maxlength="300" value="' + esc(b.tempat) + '" placeholder="Nama tempat; untuk daring/blended cantumkan link Zoom"></label>';
        html += '<label class="field"><span>Kuota maksimal pelatihan</span><input type="number" id="f-quota" name="quota" min="1" max="1000" step="1" inputmode="numeric" value="' + esc(b.quota) + '">' +
          '<small class="hint">Batas maksimal peserta per batch.</small></label>';
        html += '<label class="field"><span>Kuota minimal jalan</span><input type="number" id="f-quotaMin" name="quotaMin" min="0" max="1000" step="1" inputmode="numeric" value="' + esc(b.quotaMin) + '">' +
          '<small class="hint">Ambang peserta agar pelatihan dapat jalan.</small></label>';
        html += '<label class="field"><span>Pendaftar saat ini</span><input type="number" id="f-pendaftar" name="pendaftar" min="0" max="10000" step="1" inputmode="numeric" value="' + (b.pendaftar === null ? '' : b.pendaftar) + '">' +
          '<small class="hint">Terdaftar: ' + (b.pendaftar === null ? 0 : b.pendaftar) + ' dari ' + b.quota + ' kuota.</small></label>';
        html += '<label class="check field-wide"><input type="checkbox" id="f-batal" name="cancelled"' + (b.cancelled ? ' checked' : '') + '> Batch dibatalkan (tidak dihitung dan tidak diingatkan)</label>';
        html += '<p class="form-status small muted field-wide" id="form-status" aria-live="polite"></p>';
        html += '</form>' + quotaGateBox(b) + '</section>';

        html += '<section class="panel"><h3 class="panel-title">Progres KAK ke Kemenkes</h3>';
        html += ev ? stageSteps(b, ev) : '<p class="notice notice-error">' + esc(row.error) + '</p>';

      }

      function timeline(b, ev, today) {
        var plan = ev.plan;
        var m = function (c) { return D.milestone(plan, c).due; };
        var start = m('KICKOFF'), end = plan.eventStart;
        var lo = start < today ? start : today;
        var hi = end > today ? end : today;
        if (ev.projectedLetter && ev.projectedLetter > hi) hi = ev.projectedLetter;
        if (ev.projectedLetter && ev.projectedLetter < lo) lo = ev.projectedLetter;
        var span = Math.max(1, D.diffDays(lo, hi));
        var pos = function (d) { return (D.diffDays(lo, d) / span) * 100; };

        var segs = [
          ['KICKOFF', 'PREP_DONE', 'asumsi', 'Persiapan'],
          ['PREP_DONE', 'DRAFT_DONE', 'asumsi', 'Penyusunan'],
          ['DRAFT_DONE', 'UPLOAD', 'asumsi', 'Review & TTD'],
          ['UPLOAD', 'KEMENKES_COMPLETE', 'asumsi', 'Buffer revisi'],
          ['KEMENKES_COMPLETE', 'PUBLISH', 'sumber', 'Layanan Kemenkes 14 hari kerja'],
          ['PUBLISH', null, 'pasar', 'Jendela pemasaran']
        ];
        var segHtml = segs.map(function (s) {
          var a = m(s[0]), z = s[1] ? m(s[1]) : end;
          var left = pos(a), width = Math.max(0.4, pos(z) - left);
          return '<span class="tl-seg tl-' + s[2] + '" style="left:' + left + '%;width:' + width + '%" title="' + esc(s[3]) + ': ' + UI.fmtDate(a, 'med') + ' s.d. ' + UI.fmtDate(z, 'med') + '"></span>';
        }).join('');

        var marks = [
          ['KICKOFF', 'Mulai KAK', m('KICKOFF'), 'top'],
          ['UPLOAD', 'Unggah', m('UPLOAD'), 'bottom'],
          ['KEMENKES_COMPLETE', 'Lengkap', m('KEMENKES_COMPLETE'), 'top'],
          ['PUBLISH', 'Publikasi H-' + Store.rulesFor(b).publishLeadDays, m('PUBLISH'), 'bottom'],
          ['EVENT', 'Hari pertama', end, 'top']
        ];
        var markHtml = marks.map(function (mk) {
          var p = pos(mk[2]), align = p < 6 ? 'start' : p > 94 ? 'end' : 'mid';
          return '<span class="tl-mark tl-' + mk[3] + ' tl-al-' + align + '" style="left:' + p + '%"><span class="tl-tick"></span><span class="tl-label">' + esc(mk[1]) + '<span class="tl-date">' + UI.fmtDate(mk[2], 'short') + '</span></span></span>';
        }).join('');

        var tp = pos(today), todayAlign = tp < 6 ? 'start' : tp > 94 ? 'end' : 'mid';
        var todayHtml = '<span class="tl-today tl-al-' + todayAlign + '" style="left:' + tp + '%"><span class="tl-today-label">Hari ini</span></span>';
        var projHtml = (ev.projectedLetter && ev.delayWD > 0)
          ? '<span class="tl-proj" style="left:' + pos(ev.projectedLetter) + '%" title="Perkiraan surat registrasi ' + UI.fmtDate(ev.projectedLetter, 'med') + '"></span>' : '';

        return '<figure class="timeline" aria-label="Garis waktu jalur mundur KAK">' +
          '<div class="tl-area">' + markHtml + '<div class="tl-track">' + segHtml + projHtml + '</div>' + todayHtml + '</div>' +
          '<figcaption class="tl-legend"><span><i class="sw sw-sumber"></i>Sumber resmi Kemenkes</span><span><i class="sw sw-asumsi"></i>Asumsi BDI (bisa diubah)</span><span><i class="sw sw-pasar"></i>Jendela pemasaran (≥ 30 hari)</span>' +
          (projHtml ? '<span><i class="sw sw-proj"></i>Perkiraan surat registrasi</span>' : '') + '</figcaption></figure>';
      }

      function jalur(b, row, ctx) {
        if (!row.ev) return '<div class="notice notice-error"><p>' + esc(row.error) + '</p></div>';
        var ev = row.ev, plan = ev.plan, today = ctx.today, rules = Store.rulesFor(b), cal = Store.calendar();
        var html = '';
        if (ev.eventStartAssumed) {
          html += '<div class="notice notice-warn"><p><strong>Perkiraan (dihitung dari tanggal 1).</strong> Batch ini belum punya tanggal pasti, jadi tenggat memakai ' + UI.fmtDate(plan.eventStart, 'long') + '. Isi tanggal pasti di tab Ringkasan.</p></div>';
        }
        html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Jalur Mundur ke Publikasi H-' + rules.publishLeadDays + '</h3>' +
          '<button type="button" class="btn btn-sm" data-ics>Unduh .ics batch ini</button></div>' +
          '<p class="lead-msg">' + UI.humanize(ev.message) + '</p>' + timeline(b, ev, today) +
          '<dl class="facts">' +
          '<div><dt>Mulai KAK</dt><dd>H-' + plan.kickoffLeadDays + ' (kalender)</dd></div>' +
          '<div><dt>Unggah ke Kemenkes</dt><dd>H-' + plan.uploadLeadDays + ' (kalender)</dd></div>' +
          '<div><dt>Perkiraan surat registrasi</dt><dd>' + (ev.projectedLetter ? UI.fmtDate(ev.projectedLetter, 'med') : '–') + '</dd></div>' +
          '<div><dt>Jendela pemasaran</dt><dd>' + UI.windowText(ev) + '</dd></div>' +
          '</dl></section>';

        html += '<section class="panel"><h3 class="panel-title">Tonggak &amp; Dasar Tiap Tanggal</h3><div class="table-wrap"><table class="table table-ms"><thead><tr>' +
          '<th>Tonggak</th><th>Tanggal</th><th>Sisa</th><th>Dasar</th><th>Cara Menghitung</th><th>Status</th></tr></thead><tbody>';
        plan.milestones.forEach(function (ms) {
          var left = D.workingDaysBetween(today, ms.due, cal);
          var done = UI.milestoneDone(ms.code, ev.stage);
          var basis = UI.MS_BASIS[ms.code];
          var status = done ? '<span class="badge badge-selesai">Selesai</span>'
            : left < 0 ? '<span class="badge badge-terlambat">Lewat</span>'
              : left <= rules.soonThresholdWD ? '<span class="badge badge-segera">Segera</span>'
                : '<span class="badge badge-aman">Terbuka</span>';
          html += '<tr' + (done ? ' class="row-done"' : '') + '><td><strong>' + esc(UI.MS_LABEL[ms.code]) + '</strong><div class="small muted">' + esc(ms.title) + '</div></td>' +
            '<td class="nowrap">' + UI.fmtDate(ms.due, 'day') + '</td>' +
            '<td class="nowrap ' + (!done && left < 0 ? 'num-bad' : '') + '">' + (done ? '–' : UI.hkText(left)) + '</td>' +
            '<td class="nowrap"><span class="basis basis-' + basis + '">' + UI.BASIS_LABEL[basis] + '</span></td>' +
            '<td class="small">' + esc(UI.msFormula(ms.code, rules)) + '</td><td>' + status + '</td></tr>';
        });
        html += '<tr><td><strong>Hari pertama pelatihan</strong>' + (ev.eventStartAssumed ? '<div class="small muted">Perkiraan (tanggal 1)</div>' : '') + '</td><td class="nowrap">' + UI.fmtDate(plan.eventStart, 'day') + '</td><td class="nowrap">' + UI.hkText(D.workingDaysBetween(today, plan.eventStart, cal)) + '</td><td></td><td></td><td></td></tr></tbody></table></div></section>';

        if (ev.stage === 'belum_mulai' || ev.stage === 'penyusunan' || ev.stage === 'review') {
          var el = D.earliestLetter(today, rules, cal);
          html += '<section class="panel"><h3 class="panel-title">Simulasi: Bila Diunggah Hari Ini</h3><p>Surat registrasi paling cepat terbit <strong>' + UI.fmtDate(el.bestCase, 'long') + '</strong> tanpa revisi, atau <strong>' + UI.fmtDate(el.withBuffer, 'long') + '</strong> bila ada 1 putaran revisi. Target publikasi: <strong>' + UI.fmtDate(plan.publishDue, 'long') + '</strong>.</p></section>';
        }
        return html;
      }

      function kakItem(item, b) {
        var L = Store.settings().lembaga;
        var res = { kind: 'auto', value: '' };
        switch (item.sumber) {
          case 'program.nama': res.value = b.programName; break;
          case 'batch.metode': res = b.metode ? { kind: 'auto', value: b.metode } : { kind: 'todo', value: 'Pilih metode di tab Ringkasan' }; break;
          case 'batch.cakupan': res.value = b.cakupan || 'nasional'; break;
          case 'batch.bentuk': res.value = b.bentuk || 'mandiri'; break;
          case 'batch.mitra': res = b.bentuk === 'kerja sama' ? (b.mitra ? { kind: 'auto', value: b.mitra } : { kind: 'todo', value: 'Wajib diisi di tab Ringkasan' }) : { kind: 'auto', value: '– (mandiri)' }; break;
          case 'konfigurasi.lembaga': res.value = L.nama + ' (' + L.akreditasi + ')'; break;
          case 'batch.nomor_batch': res.value = 'Angkatan ' + b.seq; break;
          case 'batch.tanggal': res = b.eventStart ? { kind: 'auto', value: UI.fmtDate(b.eventStart, 'long') } : { kind: 'todo', value: 'Belum ada tanggal pasti' }; break;
          case 'batch.tempat': res = b.tempat ? { kind: 'auto', value: b.tempat } : { kind: 'todo', value: 'Isi tempat di tab Ringkasan' }; break;
          case 'batch.kuota': res.value = b.quota + ' peserta'; break;
          case 'batch.harga': res = L.rekening ? { kind: 'auto', value: UI.rupiah(b.price) + ', rekening ' + L.rekening } : { kind: 'todo', value: UI.rupiah(b.price) + '; rekening belum diisi di Pengaturan' }; break;
          case 'konfigurasi.pic': res = L.picNama && L.picWa ? { kind: 'auto', value: L.picNama + ' (' + L.picWa + ')' } : { kind: 'todo', value: 'Isi PIC di Pengaturan' }; break;
          case 'kak_lama': res = { kind: 'lama', value: 'Diambil dari KAK lama (dipakai ulang per program)' }; break;
          case 'hitung': res = { kind: 'lama', value: 'Dihitung dari struktur kurikulum' }; break;
          default: res = { kind: 'todo', value: 'Diisi saat menyusun KAK' };
        }
        return res;
      }

      function kak(b) {
        var T = SEED.kakTemplate;
        var items = T.bagian.map(function (it) { return { it: it, r: kakItem(it, b) }; });
        var c = { auto: 0, lama: 0, todo: 0 };
        items.forEach(function (x) { c[x.r.kind]++; });
        var KIND = { auto: ['Terisi dari sistem', 'badge-aman'], lama: ['Dari KAK lama', 'badge-info'], todo: ['Perlu diisi', 'badge-segera'] };
        var html = '<section class="panel"><div class="panel-head"><h3 class="panel-title">Template KAK v3 Kemenkes (25 Butir)</h3>' +
          '<a class="btn btn-sm" href="#/kak">' + UI.icon('kanban') + ' Buka Tracker KAK</a></div>' +
          '<p class="panel-sub"><strong>' + c.auto + '</strong> butir terisi otomatis, <strong>' + c.lama + '</strong> dari KAK lama, <strong>' + c.todo + '</strong> perlu dilengkapi.</p>' +
          '<div class="table-wrap"><table class="table table-compact"><thead><tr><th class="num">No</th><th>Butir</th><th>Isi Saat Ini</th><th>Status</th></tr></thead><tbody>';
        items.forEach(function (x) {
          html += '<tr><td class="num">' + x.it.no + '</td><td><strong>' + esc(x.it.judul) + '</strong>' + (x.it.petunjuk ? '<div class="small muted">' + esc(x.it.petunjuk) + '</div>' : '') + '</td>' +
            '<td>' + esc(x.r.value) + '</td><td><span class="badge ' + KIND[x.r.kind][1] + '">' + KIND[x.r.kind][0] + '</span></td></tr>';
        });
        html += '</tbody></table></div></section>';

        var L = Store.settings().lembaga;
        var V = {
          V04: b.bentuk === 'kerja sama' ? (b.mitra ? ['Terpenuhi', 'ok'] : ['Belum: isi mitra di Ringkasan', 'bad']) : ['Tidak berlaku (mandiri)', 'muted'],
          V05: !b.metode ? ['Belum bisa dicek', 'muted'] : b.metode === 'Luring' ? ['Tidak berlaku (luring)', 'muted'] : (/https?:\/\/|zoom|meet\.|teams/i.test(b.tempat) ? ['Terpenuhi', 'ok'] : ['Belum: cantumkan link meeting', 'bad']),
          V07: L.rekening ? ['Terpenuhi', 'ok'] : ['Belum: isi nomor rekening di Pengaturan', 'bad']
        };
        html += '<section class="panel"><h3 class="panel-title">Aturan Validasi V01–V09</h3><ul class="checklist">' + T.validasi.map(function (v) {
          var st = V[v.id] || ['Dicek di Pemeriksa KAK', 'muted'];
          return '<li><span class="cl-id">' + esc(v.id) + '</span><span class="cl-text">' + esc(v.aturan) + '</span><span class="cl-st cl-' + st[1] + '">' + esc(st[0]) + '</span></li>';
        }).join('') + '</ul></section>';
        return html;
      }

      function rabTab(b) {

        if (!list.length) {
          html += '<div class="empty-inline"><p>Belum ada RAB untuk ' + esc(b.label) + '. Buat dari kerangka RAB BDI atau salin dari RAB contoh 2026 lalu cek target margin 40%.</p></div>';
        } else {

      function batchIcs(b, ev) {

          return { uid: b.id + '-' + m.code + '@bdi-pusat-kendali', date: m.due, summary: b.label + ': ' + UI.MS_LABEL[m.code], description: m.title + (ev.eventStartAssumed ? ' (perkiraan, dihitung dari tanggal 1)' : '') };

      window.Pages.batchDetail = {
        title: function (ctx) {
          var b = Store.getBatch(ctx.params.id);
          return b ? b.label : 'Batch tidak ditemukan';
        },

            '<p class="detail-meta"><span><strong>Angkatan ' + b.seq + '</strong></span><span>' + UI.scheduleText(b) + '</span><span>' + (b.tier === 'mahal' ? 'Tier Mahal' : 'Tier Standar') + '</span><span>' + UI.rupiah(b.price) + '/peserta</span><span>Kuota ' + b.quota + ' (Min ' + b.quotaMin + ')</span></p>' +

            '<div class="detail-status">' + UI.decisionBadge(b) + ' ' + (b.cancelled ? '' : (ev ? UI.riskBadge(ev) + '<span class="detail-stage">' + esc(UI.STAGE_LABEL[ev.stage]) + '</span>' : '<span class="badge badge-terlambat">Error</span>')) +
            '<button type="button" class="btn btn-xs btn-primary" data-open-quota-dlg>Atur Kuota &amp; Keputusan</button></div></header>';

          html += '<nav class="tabs" aria-label="Bagian detail batch">' + TABS.map(function (t) {
            var extra = '';

        var set = {};
        cands.forEach(function (n) { set[n] = true; });
        var range = maxN - minN;
        var step = Math.max(1, Math.ceil(range / 8));
        for (var n = minN; n <= maxN; n += step) set[n] = true;

        var body =
          '<p class="dlg-lead">' + esc(b.label) + ' — ' + esc(b.programName) + '</p>' +
          '<label class="field"><span>Tanggal ' + esc(UI.FIELD_LABEL[act.field].toLowerCase()) + '</span>' +
          '<input type="date" name="date" required value="' + esc(defDate) + '" min="' + esc(minDate) + '" max="' + esc(App.today < minDate ? minDate : App.today) + '"></label>' +
          (isLetter ? '<label class="field"><span>Nomor surat registrasi</span><input type="text" name="no" autocomplete="off" placeholder="Contoh: PL.02.03/F/…" maxlength="120"></label>' : '') +
          (prevField ? '<p class="hint">Tidak boleh sebelum ' + esc(UI.FIELD_LABEL[prevField].toLowerCase()) + ' (' + UI.fmtDate(b[prevField], 'med') + ') dan tidak boleh setelah tanggal acuan.</p>' : '<p class="hint">Tidak boleh setelah tanggal acuan.</p>');
        UI.dialog({
          title: act.label,
          body: body,
          submitLabel: act.label,
          onSubmit: function (form) {
            var d = form.elements.date.value;
            if (!d || !D.isISODate(d)) return 'Isi tanggal dengan benar.';
            if (d < UI.coverage.from || d > UI.coverage.to) return 'Tanggal harus antara ' + UI.fmtDate(UI.coverage.from, 'med') + ' dan ' + UI.fmtDate(UI.coverage.to, 'med') + '.';
            if (d < minDate) return 'Tanggal tidak boleh sebelum ' + UI.fmtDate(minDate, 'med') + '.';
            if (d > App.today && d > minDate) return 'Tanggal tidak boleh setelah tanggal acuan (' + UI.fmtDate(App.today, 'med') + ').';
            var patch = {};
            patch[act.field] = d;
            if (act.field === 'kakStartedAt' && (!b.keputusan || b.keputusan === 'menunggu')) { patch.keputusan = 'kak'; patch.keputusanUpdatedAt = d; }
            else if (act.field === 'kemenkesCompleteAt' && (!b.keputusan || b.keputusan === 'menunggu' || b.keputusan === 'kak')) { patch.keputusan = 'ongoing'; patch.keputusanUpdatedAt = d; }
            else if (act.field === 'publishedAt') { patch.keputusan = 'jalan'; patch.keputusanUpdatedAt = d; }
            if (isLetter) patch.registrationNo = form.elements.no.value.trim();
            Store.updateBatch(batchId, patch);
            var nb = Store.getBatch(batchId);
            UI.toast(act.done + ': ' + nb.label + ' sekarang di tahap ' + UI.STAGE_LABEL[D.stageOf(nb)] + '.', 'ok');
            if (onDone) onDone(); else App.refresh();
          }
        });
      };

      // Pencarian Cepat (Quick Jump Ctrl+K)
      function openQuickSearch() {
        var batches = Store.getBatches();
        var rabs = Store.rabs();
        var pages = [
          { title: 'Beranda (Hari Ini)', sub: 'Halaman utama, KPI & pengingat', href: '#/' },
          { title: 'To-Do List Kerjaan Tim BDI', sub: 'Checklist kerjaan tim harian & pantauan kalender', href: '#/todo' },
          { title: 'Tracker KAK', sub: 'Papan Kanban & daftar progres KAK terhubung Kalender', href: '#/kak' },
          { title: 'Evaluasi & Nilai Pelatihan', sub: 'Pre/Post test, penugasan, ujian praktik, kelulusan, dan evaluasi fasilitator', href: '#/evaluasi' },
          { title: 'Materi & Kesiapan H-1 Kemenkes', sub: 'Bahan tayang, modul, video, info penyelenggaraan, dan instrumen evaluasi', href: '#/materi' },
          { title: 'Kehadiran Peserta & Sesi JPL', sub: 'Absensi per JPL, sesi non-JPL, dan ambang kelulusan kehadiran', href: '#/kehadiran' },
          { title: 'Laporan Pelatihan (Format BDI v1)', sub: 'Pembuatan laporan akhir BDI dan validasi L01–L05', href: '#/laporan' },
          { title: 'Kalender 2027', sub: 'Jadwal pelatihan, harga, & ceklisan KAK/On Going/Terlaksana/Reschedule/Cancel', href: '#/kalender' },
          { title: 'RAB & Target Margin 40%', sub: 'Daftar RAB & kalkulator peserta minimal', href: '#/rab' },
          { title: 'Pengaturan & Cadangan Data', sub: 'Aturan hari kerja, lembaga, libur, JSON', href: '#/pengaturan' }
        ];
        UI.dialog({
          title: 'Pencarian Cepat (Halaman, Batch, atau RAB)',
          hideSubmit: true,
          body: '<input type="search" id="qs-in" placeholder="Ketik nama pelatihan, kode batch (mis. BTCLS-B1), atau RAB..." autocomplete="off">' +
            '<ul class="qs-list" id="qs-list"></ul>',
          onOpen: function (form) {
            var inp = form.querySelector('#qs-in');
            var listEl = form.querySelector('#qs-list');
            var dlg = document.getElementById('dlg');
            var update = function () {
              var q = inp.value.trim().toLowerCase();
              var items = [];
              pages.forEach(function (p) {
                if (!q || (p.title + ' ' + p.sub).toLowerCase().indexOf(q) !== -1) items.push({ t: p.title, s: p.sub, h: p.href, tag: 'Halaman' });
              });
              batches.forEach(function (b) {
                if (!q || (b.label + ' ' + b.programName + ' ' + b.id).toLowerCase().indexOf(q) !== -1) {
                  items.push({ t: b.label + ' — ' + b.programName, s: UI.fmtMonth(b.plannedMonth) + ' · ' + UI.rupiah(b.price), h: '#/batch/' + encodeURIComponent(b.id), tag: 'Batch' });
                }
              });
              rabs.forEach(function (r) {
                if (!q || r.title.toLowerCase().indexOf(q) !== -1) items.push({ t: r.title, s: 'RAB', h: '#/rab/' + encodeURIComponent(r.id), tag: 'RAB' });
              });
              listEl.innerHTML = items.slice(0, 25).map(function (it) {
                return '<li><a href="' + it.h + '" data-qs-go><div><strong>' + esc(it.t) + '</strong><div class="small muted">' + esc(it.s) + '</div></div><span class="badge badge-info">' + it.tag + '</span></a></li>';
              }).join('') || '<li style="padding:12px" class="muted">Tidak ada hasil yang cocok.</li>';
              listEl.querySelectorAll('[data-qs-go]').forEach(function (a) {
                a.addEventListener('click', function () { dlg.close(); });
              });
            };
            inp.addEventListener('input', update);
            update();
          }
        });
      }

      window.Pages.notFound = {
        title: 'Halaman tidak ditemukan',
        render: function () {
          return '<div class="empty"><h2>Halaman ini tidak ada</h2><p>Alamat mungkin salah ketik atau datanya sudah dihapus.</p><p><a class="btn btn-primary" href="#/">Buka Beranda</a></p></div>';
        }
      };

      function start() {
        initToday();
        document.getElementById('acuan').addEventListener('change', function (e) {
          var v = e.target.value;
          if (!v || !D.isISODate(v)) { e.target.value = App.today; return; }
          var c = clampToCoverage(v);
          if (c !== v) UI.toast('Tanggal acuan dibatasi ke cakupan data libur.', 'error');
          App.today = c;
          render({ keepScroll: true });
        });
        document.getElementById('acuan-reset').addEventListener('click', function () {
          App.today = clampToCoverage(App.realToday);
          render({ keepScroll: true });
        });
        document.getElementById('menu-btn').addEventListener('click', function () {
          var open = document.body.classList.toggle('nav-open');
          this.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.getElementById('nav-scrim').addEventListener('click', function () {
          document.body.classList.remove('nav-open');
          document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
        });
        var sbTog = document.getElementById('sb-toggle');
        if (sbTog) sbTog.addEventListener('click', function () {
          Store.setPrefs({ sidebarCollapsed: !Store.prefs().sidebarCollapsed });
          applyPrefsToBody();
        });
        var densTog = document.getElementById('density-toggle');
        if (densTog) densTog.addEventListener('click', function () {
          Store.setPrefs({ density: Store.prefs().density === 'ringkas' ? 'nyaman' : 'ringkas' });
          applyPrefsToBody();
        });
        var qsBtn = document.getElementById('qs-btn');
        if (qsBtn) qsBtn.addEventListener('click', openQuickSearch);

        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            openQuickSearch();
          } else if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
            document.body.classList.remove('nav-open');
            document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
          }
        });
        var dlg = document.getElementById('dlg');
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
        window.addEventListener('hashchange', function () { render({ focus: true }); });
        render();
      }

      window.App = App;
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();

  </script>
</body>

</html>
