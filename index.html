<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDI Pusat Kendali</title>
  <meta name="description" content="Pusat kendali pelatihan BDI: tenggat KAK ke Kemenkes (publikasi H-30), RAB dan target margin, kalender batch 2027.">
  <style>
/* BDI Pusat Kendali
   Warna dasar biru dongker untuk navigasi, putih untuk isi.
   Pola visual utama: garis/label PENUH = sumber resmi, garis/label PUTUS-PUTUS = asumsi BDI. */

:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --ink: #1B2430;
  --ink-2: #4A5563;
  --ink-3: #66717E;
  --line: #D6DCE3;
  --line-2: #E5E9EE;
  --navy: #1E3A5F;
  --navy-2: #2B4C77;
  --navy-soft: #E4EBF4;
  --link: #1F5C99;
  --red: #B3261E;
  --red-soft: #FBEAE8;
  --amber: #8A5300;
  --amber-soft: #FFF2D9;
  --amber-mark: #D99100;
  --green: #1E6B3E;
  --green-soft: #E4F2E9;
  --green-mark: #3E8E5E;
  --focus: #2F6FB2;
  --sidebar-w: 232px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
}

a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: #164674; }

h1, h2, h3, h4 { line-height: 1.3; }

p { margin: 0 0 8px; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip {
  position: absolute; left: 12px; top: -48px; z-index: 200;
  background: var(--surface); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line);
}
.skip:focus { top: 12px; }

/* ------------------------------------------------------------------ */
/* Kerangka */

.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); z-index: 50;
  background: var(--navy); color: #DCE5F0;
  display: flex; flex-direction: column;
}
.brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
.brand-name { margin: 0; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.005em; }
.brand-sub { margin: 2px 0 0; font-size: 12px; color: #AFC0D6; }

.nav { list-style: none; margin: 0; padding: 12px 10px; }
.nav li + li { margin-top: 2px; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 12px; border-radius: 4px;
  color: #DCE5F0; text-decoration: none; font-size: 14px; font-weight: 500;
}
.nav a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav a.active { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #fff; }
.nav-count {
  min-width: 20px; padding: 0 7px; border-radius: 9px; text-align: center;
  background: #fff; color: var(--navy); font-size: 11.5px; font-weight: 700; line-height: 18px;
}
.sidebar-foot { margin: auto 20px 18px; font-size: 12px; color: #93A6BF; }

.nav-scrim { display: none; }

.shell { margin-left: var(--sidebar-w); min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.page-title { flex: 1; min-width: 0; margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acuan { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.acuan input { min-height: 34px; }

.menu-btn {
  display: none; align-items: center; gap: 8px;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); cursor: pointer;
}
.menu-lines { position: relative; display: inline-block; width: 16px; height: 2px; background: var(--ink); box-shadow: 0 -5px 0 var(--ink), 0 5px 0 var(--ink); }

.global-note { padding: 8px 28px; background: var(--amber-soft); border-bottom: 1px solid #EDCB8A; font-size: 13px; color: #5C3A00; }
.global-note p { margin: 0; }

.main { padding: 24px 28px 64px; max-width: 1360px; }
.main:focus { outline: none; }

/* ------------------------------------------------------------------ */
/* Komponen umum */

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 18px 20px; margin-bottom: 20px; min-width: 0;
}
.panel-title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head .panel-title { margin: 0; }
.panel-sub { margin: -4px 0 14px; color: var(--ink-2); max-width: 78ch; font-size: 13.5px; }

.count {
  display: inline-block; min-width: 22px; padding: 0 7px; border-radius: 10px; text-align: center;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  font-size: 12px; font-weight: 600; line-height: 18px;
}

.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.num-bad { color: var(--red); font-weight: 600; }
.num-warn { color: var(--amber); }
.num-good { color: var(--green); font-weight: 600; }
.clamp { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footnote { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-3); max-width: 92ch; }
.crumbs { margin: 0 0 8px; font-size: 13px; }
.page-intro p, .page-intro-inline { margin: 0 0 14px; color: var(--ink-2); max-width: 75ch; }
.page-intro-inline { margin: 0; }

.badge {
  display: inline-block; padding: 1px 8px; border-radius: 4px; border: 1px solid;
  font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap;
}
.badge-terlambat { color: var(--red); background: var(--red-soft); border-color: #F1B8B2; }
.badge-segera { color: var(--amber); background: var(--amber-soft); border-color: #EDCB8A; }
.badge-aman { color: var(--green); background: var(--green-soft); border-color: #A9D5B8; }
.badge-selesai { color: var(--navy); background: var(--navy-soft); border-color: #BFCCE0; }
.badge-info { color: #3D4F66; background: #EEF1F5; border-color: var(--line); }
.badge-batal { color: var(--ink-2); background: #EEF0F2; border-color: var(--line); }

/* Dasar tanggal: penuh = sumber resmi, putus-putus = asumsi */
.basis { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.basis-sumber { background: var(--navy); color: #fff; border: 1px solid var(--navy); }
.basis-asumsi { background: #fff; color: #34465F; border: 1px dashed #5E7392; }
.basis-aturan { background: var(--navy-soft); color: var(--navy); border: 1px solid #BFCCE0; }

.notice {
  margin: 0 0 16px; padding: 10px 14px; border-radius: 4px;
  background: #EEF3F9; border: 1px solid #C9D6E6; border-left: 4px solid var(--navy); font-size: 13.5px;
}
.notice p { margin: 0; max-width: 90ch; }
.notice-error { background: var(--red-soft); border-color: #F1B8B2; border-left-color: var(--red); }

.empty { padding: 36px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.empty h2 { margin: 0 0 6px; font-size: 17px; }
.empty p { color: var(--ink-2); max-width: 65ch; }
.empty-inline p { margin: 4px 0; color: var(--ink-2); max-width: 70ch; }

/* Tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 7px 14px; border-radius: 4px; border: 1px solid #C3CBD5;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; line-height: 1.2;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: #F2F4F7; color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-2); color: #fff; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover { background: #962019; color: #fff; }
.btn-danger-ghost { color: var(--red); border-color: #E7B4AE; }
.btn-danger-ghost:hover { background: var(--red-soft); color: var(--red); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--link); }
.btn-ghost:hover { background: var(--navy-soft); color: #164674; }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.btn-block { width: 100%; }
.link-btn { padding: 0; border: 0; background: none; color: var(--link); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; cursor: pointer; }
.link-btn:hover { color: #164674; }
.link-danger { color: var(--red); }
.link-danger:hover { color: #962019; }
.icon-btn { padding: 4px 6px; border: 0; background: none; color: var(--red); font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.file-btn { position: relative; }
.file-btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Isian */
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  min-height: 36px; padding: 6px 9px; border: 1px solid #BCC5D0; border-radius: 4px; background: #fff; font-size: 14px;
}
input:disabled, select:disabled { background: var(--surface-2); color: var(--ink-2); }
input.invalid { border-color: var(--red); background: #FFF8F7; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; margin: 0; accent-color: var(--navy); flex: none; }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.field > span { font-weight: 500; }
.field-inline { min-width: 150px; }
.field-wide { grid-column: 1 / -1; }
.field-grow { flex: 1; min-width: 200px; }
.field-indent { margin-left: 26px; }
.hint { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
.form-inline { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 8px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.form-error { margin: 8px 0 0; color: var(--red); font-size: 13px; }
.form-status { margin: 0; min-height: 18px; }
.fieldset { margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line-2); border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
.fieldset legend { padding: 0 4px; font-size: 13px; color: var(--ink-2); }
.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 14px; }
.filters .check { min-height: 36px; }
.filters-count { margin: 0 0 0 auto; align-self: center; color: var(--ink-2); font-size: 13px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .filters-count { margin: 0; }
.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tabel */
.table-wrap { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th {
  padding: 8px 10px; text-align: left; vertical-align: bottom; white-space: nowrap;
  font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.table td { padding: 10px; vertical-align: top; border-bottom: 1px solid var(--line-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tfoot th, .table tfoot td { border-top: 1px solid var(--line); border-bottom: 0; background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table-compact th, .table-compact td { padding: 5px 8px; font-size: 13px; }
.row-done td { color: var(--ink-3); }
.row-current td { background: var(--navy-soft); }
.th-sort {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none;
  font-weight: 600; color: inherit; cursor: pointer;
}
th.num .th-sort { justify-content: flex-end; width: 100%; }
.th-sort:hover { color: var(--ink); }
.sort-ind { font-size: 9px; min-width: 9px; }

/* ------------------------------------------------------------------ */
/* Hari ini */

.today-head { margin: 0 0 24px; }
.today-date { margin: 0 0 4px; color: var(--ink-2); font-size: 14px; }
.today-lead { margin: 0 0 16px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; max-width: 62ch; }

.riskbar { display: flex; gap: 2px; height: 14px; border-radius: 3px; overflow: hidden; max-width: 900px; }
.rb-seg { min-width: 4px; }
.rb-terlambat { background: var(--red); }
.rb-segera { background: var(--amber-mark); }
.rb-aman { background: var(--green-mark); }
.rb-selesai { background: #7D93B2; }
.rb-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 13.5px; }
.rb-key { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
.rb-key:hover { text-decoration: underline; color: var(--ink); }
.rb-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

.split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.split-side { min-width: 0; }

.rem-list { list-style: none; margin: 0; padding: 0; }
.rem { padding: 12px 0 12px 14px; border-left: 3px solid var(--line); }
.rem + .rem { margin-top: 10px; }
.rem-terlambat { border-left-color: var(--red); }
.rem-segera { border-left-color: var(--amber-mark); }
.rem-info { border-left-color: #8FA3BE; }
.rem-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rem-due { font-size: 12.5px; color: var(--ink-2); }
.rem-title { margin: 6px 0 2px; font-weight: 600; }
.rem-msg { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; max-width: 78ch; }
.rem-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.todo { list-style: none; margin: 0; padding: 0; }
.todo li { padding: 10px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.todo li:first-child { border-top: 0; padding-top: 0; }

.win-list { list-style: none; margin: 0; padding: 0; }
.win-list li { display: grid; grid-template-columns: minmax(0, 1fr) 100px 62px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.win-bar { position: relative; height: 6px; background: #E6EAEF; border-radius: 3px; }
.win-fill { position: absolute; inset: 0 auto 0 0; background: var(--green-mark); border-radius: 3px; }
.win-fill.bad { background: var(--red); }
.win-target { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3); }
.win-num { text-align: right; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ */
/* Tracker KAK */

.board {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr);
  gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start;
}
.col { background: #E6EAF0; border-radius: 6px; padding: 10px; min-width: 0; }
.col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 4px 10px; font-size: 13.5px; font-weight: 600; }
.col-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.col-empty { margin: 4px; font-size: 13px; color: var(--ink-3); }
.kc { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid #8FA3BE; border-radius: 4px; padding: 10px 12px; }
.kc-terlambat { border-left-color: var(--red); }
.kc-segera { border-left-color: var(--amber-mark); }
.kc-aman { border-left-color: var(--green-mark); }
.kc-selesai { border-left-color: #7D93B2; }
.kc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.kc-title { font-weight: 600; color: var(--ink); text-decoration: none; }
.kc-title:hover { text-decoration: underline; color: var(--ink); }
.kc-date, .kc-next, .kc-win { margin: 4px 0 0; font-size: 13px; }
.kc .btn { margin-top: 10px; }

/* ------------------------------------------------------------------ */
/* Detail batch */

.detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.detail-title { margin: 0 0 6px; font-size: 20px; font-weight: 600; max-width: 62ch; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; color: var(--ink-2); font-size: 13.5px; }
.detail-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.detail-stage { font-size: 13px; color: var(--ink-2); }

.tabs { position: relative; display: flex; gap: 2px; margin: 0 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a {
  padding: 9px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap;
}
.tabs a:hover { color: var(--ink); }
.tabs a.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 2px; width: 2px; background: var(--line); }
.step.done:not(:last-child)::before { background: var(--navy); }
.step-mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B7C1CD; background: #fff; }
.step.done .step-mark { background: var(--navy); border-color: var(--navy); }
.step.current .step-mark { border-color: var(--navy); background: radial-gradient(circle, var(--navy) 0 4px, #fff 5px); }
.step-label { margin: 0; font-weight: 600; }
.step-date { margin: 2px 0 6px; font-size: 13px; }
.step-actions { display: flex; gap: 14px; flex-wrap: wrap; }

.lead-msg { margin: 0 0 4px; max-width: 82ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; margin: 18px 0 0; }
.facts div { border-top: 1px solid var(--line-2); padding-top: 8px; }
.facts dt { font-size: 12.5px; color: var(--ink-2); }
.facts dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Garis waktu jalur mundur */
.timeline { margin: 18px 0 4px; }
.tl-area { position: relative; height: 136px; margin: 0 14px; }
.tl-track { position: absolute; left: 0; right: 0; top: 64px; height: 14px; background: #EEF1F4; border-radius: 2px; }
.tl-seg { position: absolute; top: 0; bottom: 0; }
.tl-sumber { background: var(--navy); }
.tl-asumsi { background: #F4F6F9; border: 2px dashed #5E7392; }
.tl-pasar { background: #9CCBAE; }
.tl-proj { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; background: var(--red); border-radius: 2px; }
.tl-mark { position: absolute; top: 0; bottom: 0; width: 0; }
.tl-tick { position: absolute; left: -1px; width: 2px; background: var(--ink); }
.tl-top .tl-tick { top: 54px; height: 24px; }
.tl-bottom .tl-tick { top: 64px; height: 26px; }
.tl-label { position: absolute; white-space: nowrap; font-size: 12.5px; font-weight: 600; line-height: 1.25; transform: translateX(-50%); }
.tl-top .tl-label { top: 20px; }
.tl-bottom .tl-label { top: 94px; }
.tl-date { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; }
.tl-al-start .tl-label { transform: none; left: -1px; }
.tl-al-end .tl-label { transform: translateX(-100%); left: 1px; text-align: right; }
.tl-today { position: absolute; top: 14px; bottom: 6px; width: 0; border-left: 2px solid var(--ink); margin-left: -1px; }
.tl-today-label {
  position: absolute; top: -14px; transform: translateX(-50%); white-space: nowrap;
  background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 3px; line-height: 16px;
}
.tl-today.tl-al-start .tl-today-label { transform: none; left: -2px; }

  function monthsOptions(sel) {

  function card(r) {

    var k = UI.riskKey(ev);
    var act = UI.STAGE_ACTION[ev.stage];
    var nextLine = ev.next
      ? '<p class="kc-next"><span class="muted">Berikutnya:</span> ' + esc(UI.MS_LABEL[ev.next.code]) + ', ' + UI.fmtDate(ev.next.due, 'short') +

      '<p class="kc-date">' + UI.scheduleText(b) + '</p>' +

      (ev.stage !== 'dipublikasikan' ? '<p class="kc-win small">Jendela pemasaran ' + UI.windowText(ev) + '</p>' : '') +
      (act ? '<button type="button" class="btn btn-sm btn-block" data-advance="' + esc(b.id) + '">' + esc(act.label) + '</button>' : '') +
      '</li>';
  }

  window.Pages.kak = {
    title: 'Tracker KAK',
    render: function (ctx) {
      var f = filters(ctx);
      var rows = UI.evaluateAll(ctx.today).filter(function (r) { return r.ev && !r.batch.cancelled; });
      var q = f.q.trim().toLowerCase();
      var shown = rows.filter(function (r) {
        if (f.bulan) {
          var month = r.batch.eventStart ? r.batch.eventStart.slice(0, 7) : r.batch.plannedMonth;
          if (month !== f.bulan) return false;
        }
        if (f.risiko && UI.riskKey(r.ev) !== f.risiko) return false;
        if (q && (r.batch.label + ' ' + r.batch.programName).toLowerCase().indexOf(q) === -1) return false;

      var html = '<div class="page-intro"><p>Satu kartu per batch. Tekan tombol di kartu saat sebuah tahap selesai; tenggat dan pengingat berikutnya langsung dihitung ulang.</p></div>';

        '<label class="field field-inline"><span>Cari</span><input type="search" name="q" value="' + esc(f.q) + '" placeholder="Nama program atau batch"></label>' +

        '</select></label>' +
        '<p class="filters-count">' + shown.length + ' dari ' + rows.length + ' batch</p>' +
        '</form>';

      D.STAGES.forEach(function (st) {
        var col = shown.filter(function (r) { return r.ev.stage === st; }).sort(function (a, b) {
          var da = a.ev.next ? a.ev.next.due : (a.batch.publishedAt || '9');

        });
        var limit = f.expanded[st] ? col.length : PAGE_SIZE;
        html += '<section class="col" aria-label="' + esc(UI.STAGE_LABEL[st]) + '">' +
          '<h2 class="col-head"><span>' + esc(UI.STAGE_LABEL[st]) + '</span><span class="count">' + col.length + '</span></h2>';

          if (col.length > limit) html += '<button type="button" class="btn btn-ghost btn-block" data-expand="' + st + '">Tampilkan ' + (col.length - limit) + ' lagi</button>';
          else if (f.expanded[st] && col.length > PAGE_SIZE) html += '<button type="button" class="btn btn-ghost btn-block" data-collapse="' + st + '">Ringkas</button>';

    mount: function (root, ctx) {

      form.elements.risiko.addEventListener('change', function (e) { f.risiko = e.target.value; ctx.refresh(); });
      root.querySelectorAll('[data-advance]').forEach(function (btn) {

      root.querySelectorAll('[data-expand]').forEach(function (btn) {

        btn.addEventListener('click', function () { f.expanded[btn.getAttribute('data-collapse')] = false; ctx.refresh(); });
      });
    }

/* js/pages/batch.js */
/* Daftar 83 batch 2027: filter, urutkan, unduh CSV jalur mundur. */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var esc = UI.esc;

  var RISK_ORDER = { terlambat: 0, segera: 1, aman: 2, selesai: 3 };

  function filters(ctx) {
    if (!ctx.ui.batch) ctx.ui.batch = { q: '', bulan: '', tier: '', tahap: '', risiko: '', tanggal: '', batal: false, sort: 'jadwal', dir: 1, appliedQs: '' };
    var f = ctx.ui.batch;
    var qs = ctx.query.toString();
    if (qs && qs !== f.appliedQs) {
      f.q = ''; f.bulan = ''; f.tier = ''; f.tahap = ''; f.risiko = ''; f.tanggal = '';
      if (ctx.query.get('risiko')) f.risiko = ctx.query.get('risiko');
      if (ctx.query.get('tahap')) f.tahap = ctx.query.get('tahap');
      if (ctx.query.get('tanggal')) f.tanggal = ctx.query.get('tanggal');
      if (ctx.query.get('bulan')) f.bulan = ctx.query.get('bulan');
      f.appliedQs = qs;
    }
    if (!qs) f.appliedQs = '';
    return f;
  }

  function schedKey(b) { return b.eventStart || (b.plannedMonth + '-01'); }

  function rabMargin(id) {
    var list = Store.rabsForBatch(id);
    if (!list.length) return null;
    var latest = list.slice().sort(function (a, b) { return (b.updatedAt || '') < (a.updatedAt || '') ? -1 : 1; })[0];
    var res = D.computeRab(Store.rabInput(latest));
    return { id: latest.id, margin: res.margin, ok: res.meetsTarget, revenue: res.revenue };
  }

  function apply(rows, f) {
    var q = f.q.trim().toLowerCase();
    return rows.filter(function (r) {
      var b = r.batch;
      if (!f.batal && b.cancelled) return false;
      if (f.batal && !b.cancelled) return false;
      var month = b.eventStart ? b.eventStart.slice(0, 7) : b.plannedMonth;
      if (f.bulan && month !== f.bulan) return false;
      if (f.tier && b.tier !== f.tier) return false;
      if (f.tanggal === 'pasti' && !b.eventStart) return false;
      if (f.tanggal === 'perkiraan' && b.eventStart) return false;
      if (q && (b.label + ' ' + b.programName + ' ' + b.program).toLowerCase().indexOf(q) === -1) return false;
      if (f.tahap || f.risiko) {
        if (!r.ev) return false;
        if (f.tahap === 'selesai') { if (UI.riskKey(r.ev) !== 'selesai') return false; }
        else if (f.tahap && r.ev.stage !== f.tahap) return false;
        if (f.risiko && UI.riskKey(r.ev) !== f.risiko) return false;
      }
      return true;
    });
  }

  function sortRows(rows, f) {
    var key = f.sort, dir = f.dir;
    var val = function (r) {
      var b = r.batch, ev = r.ev;
      switch (key) {
        case 'batch': return b.label.toLowerCase();
        case 'harga': return b.price;
        case 'tahap': return ev ? D.STAGES.indexOf(ev.stage) : 99;
        case 'tenggat': return ev && ev.next ? ev.next.due : '9999';
        case 'status': return ev ? RISK_ORDER[UI.riskKey(ev)] * 1000 - (ev.delayWD || 0) : 99999;
        case 'jendela': return ev ? ev.marketingWindowDays : 99999;
        default: return schedKey(b) + b.label;
      }
    };
    return rows.slice().sort(function (a, b) {
      var x = val(a), y = val(b);
      return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
  }

  function th(label, key, f, cls) {
    var active = f.sort === key;
    var aria = active ? (f.dir === 1 ? 'ascending' : 'descending') : 'none';
    return '<th scope="col" aria-sort="' + aria + '"' + (cls ? ' class="' + cls + '"' : '') + '><button type="button" class="th-sort" id="sort-' + key + '" data-sort="' + key + '">' + esc(label) +
      '<span class="sort-ind" aria-hidden="true">' + (active ? (f.dir === 1 ? '▲' : '▼') : '') + '</span></button></th>';
  }

  function select(name, value, opts) {
    return '<select id="bf-' + name + '" name="' + name + '">' + opts.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === value ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select>';
  }

  function toCSV(rows) {
    var head = ['id_batch', 'kode_program', 'program', 'batch', 'bulan_rencana', 'tanggal_mulai', 'tanggal_perkiraan', 'tier', 'kuota', 'harga',
      'tahap', 'mulai_kak', 'draf_selesai', 'unggah_kemenkes', 'dinyatakan_lengkap', 'publikasi_h30', 'status', 'terlambat_hk', 'perkiraan_surat', 'jendela_pemasaran_hari'];
    var lines = [head.join(';')];
    rows.forEach(function (r) {
      var b = r.batch, ev = r.ev;
      var m = function (c) { return ev ? D.milestone(ev.plan, c).due : ''; };
      lines.push([b.id, b.program, b.programName, b.seq, b.plannedMonth, b.eventStart || '', b.eventStart ? 'tidak' : 'ya (tanggal 1)', b.tier, b.quota, b.price,
        ev ? UI.STAGE_LABEL[ev.stage] : 'error', m('KICKOFF'), m('DRAFT_DONE'), m('UPLOAD'), m('KEMENKES_COMPLETE'), ev ? ev.plan.publishDue : '',
        ev ? UI.RISK_LABEL[UI.riskKey(ev)] : r.error, ev ? ev.delayWD : '', ev && ev.projectedLetter ? ev.projectedLetter : '', ev ? ev.marketingWindowDays : ''
      ].map(UI.csvCell).join(';'));
    });
    return '﻿' + lines.join('\r\n') + '\r\n';
  }

  window.Pages.batch = {
    title: 'Batch 2027',
    render: function (ctx) {
      var f = filters(ctx);
      var all = UI.evaluateAll(ctx.today);
      var rows = sortRows(apply(all, f), f);
      var months = [['', 'Semua bulan']];
      for (var m = 1; m <= 12; m++) { var v = '2027-' + String(m).padStart(2, '0'); months.push([v, UI.fmtMonth(v)]); }
      var stages = [['', 'Semua tahap']].concat(D.STAGES.map(function (s) { return [s, UI.STAGE_LABEL[s]]; })).concat([['selesai', 'Teregistrasi atau dipublikasikan']]);
      var cancelled = all.filter(function (r) { return r.batch.cancelled; }).length;

      var html = '<form class="filters" role="search" onsubmit="return false">' +
        '<label class="field field-inline"><span>Cari</span><input type="search" name="q" value="' + esc(f.q) + '" placeholder="Program atau batch"></label>' +
        '<label class="field field-inline"><span>Bulan</span>' + select('bulan', f.bulan, months) + '</label>' +
        '<label class="field field-inline"><span>Tier</span>' + select('tier', f.tier, [['', 'Semua tier'], ['standar', 'Standar'], ['mahal', 'Mahal (≥ Rp10 jt)']]) + '</label>' +
        '<label class="field field-inline"><span>Tahap KAK</span>' + select('tahap', f.tahap, stages) + '</label>' +
        '<label class="field field-inline"><span>Status</span>' + select('risiko', f.risiko, [['', 'Semua status'], ['terlambat', 'Terlambat'], ['segera', 'Segera'], ['aman', 'Aman'], ['selesai', 'Selesai']]) + '</label>' +
        '<label class="field field-inline"><span>Tanggal</span>' + select('tanggal', f.tanggal, [['', 'Semua'], ['pasti', 'Sudah pasti'], ['perkiraan', 'Masih perkiraan']]) + '</label>' +
        '<label class="check"><input type="checkbox" id="bf-batal" name="batal"' + (f.batal ? ' checked' : '') + '> Hanya yang dibatalkan (' + cancelled + ')</label>' +
        '</form>';

      html += '<div class="toolbar"><p class="filters-count">' + rows.length + ' batch ditampilkan</p>' +
        '<div class="toolbar-actions"><button type="button" class="btn btn-ghost" data-reset>Hapus filter</button>' +
        '<button type="button" class="btn" data-csv' + (rows.length ? '' : ' disabled') + '>Unduh CSV</button></div></div>';

      if (rows.length === 0) {
        html += '<div class="empty"><h2>Tidak ada batch yang cocok</h2><p>Ubah atau hapus filter untuk melihat batch lain.</p></div>';
        return html;
      }

      html += '<div class="table-wrap"><table class="table table-batch"><thead><tr>' +
        th('Batch', 'batch', f) + th('Jadwal', 'jadwal', f) + '<th scope="col">Tier</th>' +
        '<th scope="col" class="num">Kuota</th><th scope="col" class="num">Pendaftar</th>' + th('Harga', 'harga', f, 'num') +
        th('Tahap KAK', 'tahap', f) + th('Tenggat berikutnya', 'tenggat', f) + th('Status', 'status', f) + th('Jendela', 'jendela', f, 'num') +
        '<th scope="col" class="num">Margin RAB</th></tr></thead><tbody>';
      html += rows.map(function (r) {
        var b = r.batch, ev = r.ev;
        var rm = rabMargin(b.id);
        var link = '#/batch/' + encodeURIComponent(b.id);
        var cells = '<td><a class="strong" href="' + link + '">' + esc(b.label) + '</a><div class="small muted clamp">' + esc(b.programName) + '</div></td>' +
          '<td class="nowrap">' + UI.scheduleText(b) + '</td>' +
          '<td>' + (b.tier === 'mahal' ? 'Mahal' : 'Standar') + '</td>' +
          '<td class="num">' + b.quota + '</td>' +
          '<td class="num">' + (b.pendaftar === null ? '<span class="muted">–</span>' : b.pendaftar) + '</td>' +
          '<td class="num nowrap">' + UI.rupiah(b.price) + '</td>';
        if (!ev) {
          cells += '<td colspan="4"><span class="badge badge-terlambat">Tidak bisa dihitung</span> <span class="small">' + esc(r.error) + '</span></td>';
        } else {
          cells += '<td>' + (b.cancelled ? '<span class="badge badge-batal">Dibatalkan</span>' : esc(UI.STAGE_LABEL[ev.stage])) + '</td>' +
            '<td class="nowrap">' + (ev.next ? esc(UI.MS_LABEL[ev.next.code]) + '<div class="small ' + (ev.next.workingDaysLeft < 0 ? 'num-bad' : 'muted') + '">' + UI.fmtDate(ev.next.due, 'med') + ', ' + UI.hkText(ev.next.workingDaysLeft) + '</div>' : '<span class="muted">–</span>') + '</td>' +
            '<td>' + (b.cancelled ? '' : UI.riskBadge(ev)) + '</td>' +
            '<td class="num">' + UI.windowText(ev) + '</td>';
        }
        cells += '<td class="num">' + (rm ? '<a href="#/rab/' + encodeURIComponent(rm.id) + '" class="' + (rm.ok ? '' : 'num-bad') + '">' + UI.pct(rm.margin) + '</a>' : '<span class="muted">–</span>') + '</td>';
        return '<tr>' + cells + '</tr>';
      }).join('');
      html += '</tbody></table></div>';
      html += '<p class="footnote">Jadwal bertanda "perkiraan" belum punya tanggal pasti; tenggatnya dihitung dari tanggal 1 bulan itu (paling ketat). Jendela merah berarti publikasi diperkirakan kurang dari 30 hari sebelum pelatihan.</p>';
      return html;
    },
    mount: function (root, ctx) {
      var f = filters(ctx);
      var form = root.querySelector('.filters');
      var t = null;
      form.elements.q.addEventListener('input', function (e) {
        clearTimeout(t);
        var v = e.target.value;
        t = setTimeout(function () {
          f.q = v;
          ctx.refresh();
          var el = document.querySelector('.filters input[name=q]');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }, 250);
      });
      ['bulan', 'tier', 'tahap', 'risiko', 'tanggal'].forEach(function (n) {
        form.elements[n].addEventListener('change', function (e) { f[n] = e.target.value; ctx.refresh(); });
      });
      form.elements.batal.addEventListener('change', function (e) { f.batal = e.target.checked; ctx.refresh(); });
      root.querySelector('[data-reset]').addEventListener('click', function () {
        f.q = ''; f.bulan = ''; f.tier = ''; f.tahap = ''; f.risiko = ''; f.tanggal = ''; f.batal = false;
        if (ctx.query.toString()) { f.appliedQs = ''; ctx.go('#/batch'); } else ctx.refresh();
      });
      var csv = root.querySelector('[data-csv]');
      if (csv) csv.addEventListener('click', function () {
        var rows = sortRows(apply(UI.evaluateAll(ctx.today), f), f);
        UI.download('jalur_kak_2027_' + ctx.today + '.csv', toCSV(rows), 'text/csv;charset=utf-8', 'CSV berisi ' + rows.length + ' batch diunduh.');
      });
      root.querySelectorAll('[data-sort]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var k = btn.getAttribute('data-sort');
          if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = 1; }
          ctx.refresh();
        });
      });
    }
  };
})();

</script>
  <script>
/* js/pages/batch-detail.js */
/* Detail batch: Ringkasan, Jalur KAK (garis waktu + tonggak), KAK v3, RAB. */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var SEED = window.BDI_SEED;
  var esc = UI.esc;

  var TABS = [['ringkasan', 'Ringkasan'], ['jalur', 'Jalur KAK'], ['kak', 'KAK v3'], ['rab', 'RAB']];

  function humanize(msg) { return window.Pages.hariIni.humanize(msg); }

  // ---------------------------------------------------------------------------
  // Ringkasan

  function stageSteps(b, ev, today) {
    var fields = Store.STAGE_FIELDS;
    var last = -1;
    fields.forEach(function (f, i) { if (b[f]) last = i; });
    var act = UI.STAGE_ACTION[ev.stage];
    var html = '<ol class="steps">';
    fields.forEach(function (f, i) {
      var done = !!b[f];
      var current = act && act.field === f;
      html += '<li class="step' + (done ? ' done' : '') + (current ? ' current' : '') + '">' +
        '<span class="step-mark" aria-hidden="true"></span>' +
        '<div class="step-body"><p class="step-label">' + esc(UI.FIELD_LABEL[f]) + '</p>';
      if (done) {
        html += '<p class="step-date">' + UI.fmtDate(b[f], 'long') + '</p>';
        if (f === 'registrationLetterAt' && b.registrationNo) html += '<p class="small muted">Nomor ' + esc(b.registrationNo) + '</p>';
        html += '<div class="step-actions"><button type="button" class="link-btn" data-edit-stage="' + f + '">Ubah tanggal</button>' +
          (i === last ? '<button type="button" class="link-btn link-danger" data-undo-stage="' + f + '">Batalkan tahap ini</button>' : '') + '</div>';
      } else if (current) {
        html += '<p class="step-date muted">Belum</p><button type="button" class="btn btn-sm btn-primary" data-advance>' + esc(act.label) + '</button>';
      } else {
        html += '<p class="step-date muted">Belum</p>';
      }
      html += '</div></li>';
    });
    html += '</ol>';
    return html;
  }

  function ringkasan(b, row, ctx) {
    var ev = row.ev;
    var html = '<div class="detail-grid"><section class="panel"><h3 class="panel-title">Data batch</h3><form class="form-grid" id="batch-form" novalidate>';
    html += '<label class="field"><span>Tanggal pasti hari pertama</span><input type="date" id="f-event" name="eventStart" value="' + esc(b.eventStart || '') + '" min="2027-01-01" max="2027-12-31">' +
      '<small class="hint">Rencana: ' + UI.fmtMonth(b.plannedMonth) + '. Kosongkan untuk memakai perkiraan tanggal 1.' +
      (b.eventStart && b.eventStart.slice(0, 7) !== b.plannedMonth ? ' <span class="num-warn">Berbeda dari bulan rencana.</span>' : '') + '</small></label>';
    html += '<label class="field"><span>Metode</span><select id="f-metode" name="metode">' +
      [['', 'Belum dipilih'], ['Luring', 'Luring (klasikal)'], ['Daring', 'Daring'], ['Blended', 'Blended']].map(function (o) {
        return '<option value="' + o[0] + '"' + (b.metode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>';
    html += '<label class="field field-wide"><span>Tempat atau link meeting</span><input type="text" id="f-tempat" name="tempat" maxlength="300" value="' + esc(b.tempat) + '" placeholder="Nama tempat; untuk daring/blended cantumkan link Zoom"></label>';
    html += '<label class="field"><span>Pendaftar saat ini</span><input type="number" id="f-pendaftar" name="pendaftar" min="0" max="10000" step="1" inputmode="numeric" value="' + (b.pendaftar === null ? '' : b.pendaftar) + '">' +
      '<small class="hint">Kuota ' + b.quota + ' (asumsi dari data 2026).</small></label>';
    html += '<label class="check field-wide"><input type="checkbox" id="f-batal" name="cancelled"' + (b.cancelled ? ' checked' : '') + '> Batch dibatalkan (tidak dihitung dan tidak diingatkan)</label>';
    html += '<p class="form-status small muted field-wide" id="form-status" aria-live="polite"></p>';
    html += '</form></section>';

    html += '<section class="panel"><h3 class="panel-title">Progres KAK</h3>';
    html += ev ? stageSteps(b, ev, ctx.today) : '<p class="notice notice-error">' + esc(row.error) + '</p>';
    html += '</section></div>';
    return html;
  }

  // ---------------------------------------------------------------------------
  // Jalur KAK

  function timeline(b, ev, today) {
    var plan = ev.plan;
    var m = function (c) { return D.milestone(plan, c).due; };
    var start = m('KICKOFF');
    var end = plan.eventStart;
    var lo = start < today ? start : today;
    var hi = end > today ? end : today;
    if (ev.projectedLetter && ev.projectedLetter > hi) hi = ev.projectedLetter;
    if (ev.projectedLetter && ev.projectedLetter < lo) lo = ev.projectedLetter;
    var span = Math.max(1, D.diffDays(lo, hi));
    var pos = function (d) { return (D.diffDays(lo, d) / span) * 100; };

    var segs = [
      ['KICKOFF', 'PREP_DONE', 'asumsi', 'Persiapan'],
      ['PREP_DONE', 'DRAFT_DONE', 'asumsi', 'Penyusunan'],
      ['DRAFT_DONE', 'UPLOAD', 'asumsi', 'Review & TTD'],
      ['UPLOAD', 'KEMENKES_COMPLETE', 'asumsi', 'Buffer revisi'],
      ['KEMENKES_COMPLETE', 'PUBLISH', 'sumber', 'Layanan Kemenkes 14 hari kerja'],
      ['PUBLISH', null, 'pasar', 'Jendela pemasaran']
    ];
    var segHtml = segs.map(function (s) {
      var a = m(s[0]);
      var z = s[1] ? m(s[1]) : end;
      var left = pos(a), width = Math.max(0.4, pos(z) - left);
      return '<span class="tl-seg tl-' + s[2] + '" style="left:' + left + '%;width:' + width + '%" title="' + esc(s[3]) + ': ' + UI.fmtDate(a, 'med') + ' s.d. ' + UI.fmtDate(z, 'med') + '"></span>';
    }).join('');

    var marks = [
      ['KICKOFF', 'Mulai KAK', m('KICKOFF'), 'top'],
      ['UPLOAD', 'Unggah', m('UPLOAD'), 'bottom'],
      ['KEMENKES_COMPLETE', 'Lengkap', m('KEMENKES_COMPLETE'), 'top'],
      ['PUBLISH', 'Publikasi H-' + (window.Store.rulesFor(b).publishLeadDays), m('PUBLISH'), 'bottom'],
      ['EVENT', 'Hari pertama', end, 'top']
    ];
    var markHtml = marks.map(function (mk) {
      var p = pos(mk[2]);
      var align = p < 6 ? 'start' : p > 94 ? 'end' : 'mid';
      return '<span class="tl-mark tl-' + mk[3] + ' tl-al-' + align + '" style="left:' + p + '%"><span class="tl-tick"></span><span class="tl-label">' + esc(mk[1]) + '<span class="tl-date">' + UI.fmtDate(mk[2], 'short') + '</span></span></span>';
    }).join('');

    var tp = pos(today);
    var todayAlign = tp < 6 ? 'start' : tp > 94 ? 'end' : 'mid';
    var todayHtml = '<span class="tl-today tl-al-' + todayAlign + '" style="left:' + tp + '%"><span class="tl-today-label">Hari ini</span></span>';
    var projHtml = '';
    if (ev.projectedLetter && ev.delayWD > 0) {
      var pp = pos(ev.projectedLetter);
      projHtml = '<span class="tl-proj" style="left:' + pp + '%" title="Perkiraan surat registrasi ' + UI.fmtDate(ev.projectedLetter, 'med') + '"></span>';
    }

    return '<figure class="timeline" aria-label="Garis waktu jalur mundur KAK dari ' + UI.fmtDate(start, 'med') + ' sampai ' + UI.fmtDate(end, 'med') + '">' +
      '<div class="tl-area">' + markHtml + '<div class="tl-track">' + segHtml + projHtml + '</div>' + todayHtml + '</div>' +
      '<figcaption class="tl-legend">' +
      '<span><i class="sw sw-sumber"></i>Sumber resmi Kemenkes</span>' +
      '<span><i class="sw sw-asumsi"></i>Asumsi BDI, perlu dikalibrasi</span>' +
      '<span><i class="sw sw-pasar"></i>Jendela pemasaran (target ≥ 30 hari)</span>' +
      (projHtml ? '<span><i class="sw sw-proj"></i>Perkiraan surat registrasi</span>' : '') +
      '</figcaption></figure>';
  }

  function jalur(b, row, ctx) {
    if (!row.ev) return '<div class="notice notice-error"><p>' + esc(row.error) + '</p></div>';
    var ev = row.ev, plan = ev.plan, today = ctx.today;
    var rules = Store.rulesFor(b);
    var cal = Store.calendar();
    var html = '';
    if (ev.eventStartAssumed) {
      html += '<div class="notice"><p><strong>Perkiraan (dihitung dari tanggal 1).</strong> Batch ini belum punya tanggal pasti, jadi semua tenggat di bawah memakai ' + UI.fmtDate(plan.eventStart, 'long') + ' sebagai hari pertama. Isi tanggal pasti di tab Ringkasan.</p></div>';
    }
    html += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Jalur mundur ke publikasi H-' + rules.publishLeadDays + '</h3>' +
      '<button type="button" class="btn btn-sm" data-ics>Unduh .ics batch ini</button></div>' +
      '<p class="lead-msg">' + humanize(ev.message) + '</p>' +
      timeline(b, ev, today) +
      '<dl class="facts">' +
      '<div><dt>Mulai KAK</dt><dd>H-' + plan.kickoffLeadDays + ' (kalender)</dd></div>' +
      '<div><dt>Unggah ke Kemenkes</dt><dd>H-' + plan.uploadLeadDays + ' (kalender)</dd></div>' +
      '<div><dt>Perkiraan surat registrasi</dt><dd>' + (ev.projectedLetter ? UI.fmtDate(ev.projectedLetter, 'med') : '–') + '</dd></div>' +
      '<div><dt>Jendela pemasaran</dt><dd>' + UI.windowText(ev) + '</dd></div>' +
      '</dl></section>';

    html += '<section class="panel"><h3 class="panel-title">Tonggak dan dasar tiap tanggal</h3><div class="table-wrap"><table class="table table-ms"><thead><tr>' +
      '<th scope="col">Tonggak</th><th scope="col">Tanggal</th><th scope="col">Sisa</th><th scope="col">Dasar</th><th scope="col">Cara menghitung</th><th scope="col">Status</th></tr></thead><tbody>';
    plan.milestones.forEach(function (ms) {
      var left = D.workingDaysBetween(today, ms.due, cal);
      var done = UI.milestoneDone(ms.code, ev.stage);
      var basis = UI.MS_BASIS[ms.code];
      var status = done ? '<span class="badge badge-selesai">Selesai</span>'
        : left < 0 ? '<span class="badge badge-terlambat">Lewat</span>'
        : left <= rules.soonThresholdWD ? '<span class="badge badge-segera">Segera</span>'
        : '<span class="badge badge-aman">Terbuka</span>';
      html += '<tr' + (done ? ' class="row-done"' : '') + '><td><strong>' + esc(UI.MS_LABEL[ms.code]) + '</strong><div class="small muted">' + esc(ms.title) + '</div></td>' +
        '<td class="nowrap">' + UI.fmtDate(ms.due, 'day') + '</td>' +
        '<td class="nowrap ' + (!done && left < 0 ? 'num-bad' : '') + '">' + (done ? '–' : UI.hkText(left)) + '</td>' +
        '<td class="nowrap"><span class="basis basis-' + basis + '">' + UI.BASIS_LABEL[basis] + '</span></td>' +
        '<td class="small">' + esc(UI.msFormula(ms.code, rules)) + '</td><td>' + status + '</td></tr>';
    });
    html += '<tr><td><strong>Hari pertama pelatihan</strong>' + (ev.eventStartAssumed ? '<div class="small muted">Perkiraan (tanggal 1)</div>' : '') + '</td><td class="nowrap">' + UI.fmtDate(plan.eventStart, 'day') + '</td><td class="nowrap">' + UI.hkText(D.workingDaysBetween(today, plan.eventStart, cal)) + '</td><td></td><td></td><td></td></tr>';
    html += '</tbody></table></div>' +
      '<p class="footnote">Hanya janji layanan 14 hari kerja setelah KAK, jadwal, dan daftar narasumber lengkap yang bersumber resmi (Ditjen Nakes). Durasi persiapan, penyusunan, TTD, dan buffer revisi adalah asumsi BDI yang bisa diubah di Pengaturan setelah ada data nyata.</p></section>';

    if (ev.stage === 'belum_mulai' || ev.stage === 'penyusunan' || ev.stage === 'review') {
      var el = D.earliestLetter(today, rules, cal);
      html += '<section class="panel"><h3 class="panel-title">Bila diunggah hari ini</h3><p>Surat registrasi paling cepat terbit <strong>' + UI.fmtDate(el.bestCase, 'long') + '</strong> tanpa revisi, atau <strong>' + UI.fmtDate(el.withBuffer, 'long') + '</strong> bila ada satu putaran revisi. Target publikasi: ' + UI.fmtDate(plan.publishDue, 'long') + '.</p></section>';
    }
    return html;
  }

  // ---------------------------------------------------------------------------
  // KAK v3

  function kakItem(item, b) {
    var L = Store.settings().lembaga;
    var src = item.sumber;
    var res = { kind: 'auto', value: '' };
    switch (src) {
      case 'program.nama': res.value = b.programName; break;
      case 'batch.metode': res = b.metode ? { kind: 'auto', value: b.metode } : { kind: 'todo', value: 'Pilih metode di tab Ringkasan' }; break;
      case 'konfigurasi.lembaga': res.value = L.nama + ' (' + L.akreditasi + ')'; break;
      case 'batch.nomor_batch': res.value = 'Angkatan ' + b.seq; break;
      case 'batch.tanggal': res = b.eventStart ? { kind: 'auto', value: UI.fmtDate(b.eventStart, 'long') + (b.metode === 'Blended' ? ' (rentang daring dan klasikal diisi saat konversi)' : '') } : { kind: 'todo', value: 'Belum ada tanggal pasti' }; break;
      case 'batch.tempat': res = b.tempat ? { kind: 'auto', value: b.tempat } : { kind: 'todo', value: 'Isi tempat di tab Ringkasan' }; break;
      case 'batch.kuota': res.value = b.quota + ' peserta'; break;
      case 'batch.harga': res = L.rekening ? { kind: 'auto', value: UI.rupiah(b.price) + ', rekening ' + L.rekening } : { kind: 'todo', value: UI.rupiah(b.price) + '; nomor rekening belum diisi di Pengaturan' }; break;
      case 'konfigurasi.pic': res = L.picNama && L.picWa ? { kind: 'auto', value: L.picNama + ' (' + L.picWa + ')' } : { kind: 'todo', value: 'Isi PIC di Pengaturan' }; break;
      case 'kak_lama': res = { kind: 'lama', value: 'Diambil dari KAK lama (menunggu file KAK lama)' }; break;
      case 'hitung': res = { kind: 'lama', value: 'Dihitung dari struktur kurikulum' }; break;
      case 'manual': res = { kind: 'todo', value: 'Diisi manual saat menyusun KAK' }; break;
      default: res = { kind: 'todo', value: 'Diisi per batch saat menyusun KAK' };
    }
    return res;
  }

  function kak(b) {
    var T = SEED.kakTemplate;
    var items = T.bagian.map(function (it) { return { it: it, r: kakItem(it, b) }; });
    var c = { auto: 0, lama: 0, todo: 0 };
    items.forEach(function (x) { c[x.r.kind]++; });
    var KIND = { auto: ['Terisi dari sistem', 'badge-aman'], lama: ['Dari KAK lama', 'badge-info'], todo: ['Perlu diisi', 'badge-segera'] };
    var html = '<section class="panel"><h3 class="panel-title">Template KAK v3 Kemenkes, 25 butir</h3>' +
      '<p class="panel-sub">' + c.auto + ' butir sudah terisi dari data sistem, ' + c.lama + ' butir diambil dari KAK lama (dipakai ulang per program), ' + c.todo + ' butir perlu diisi. Konversi otomatis dari file KAK lama dan ekspor DOCX belum tersedia.</p>' +
      '<div class="table-wrap"><table class="table table-kak"><thead><tr><th scope="col" class="num">No</th><th scope="col">Butir</th><th scope="col">Isi saat ini</th><th scope="col">Status</th></tr></thead><tbody>';
    items.forEach(function (x) {
      html += '<tr><td class="num">' + x.it.no + '</td><td><strong>' + esc(x.it.judul) + '</strong>' + (x.it.petunjuk ? '<div class="small muted">' + esc(x.it.petunjuk) + '</div>' : '') + '</td>' +
        '<td>' + esc(x.r.value) + '</td><td><span class="badge ' + KIND[x.r.kind][1] + '">' + KIND[x.r.kind][0] + '</span></td></tr>';
    });
    html += '</tbody></table></div></section>';

    var L = Store.settings().lembaga;
    var V = {
      V05: !b.metode ? ['Belum bisa dicek', 'muted'] : b.metode === 'Luring' ? ['Tidak berlaku (luring)', 'muted'] : (/https?:\/\/|zoom|meet\.|teams/i.test(b.tempat) ? ['Terpenuhi', 'ok'] : ['Belum: cantumkan link meeting', 'bad']),
      V07: L.rekening ? ['Terpenuhi', 'ok'] : ['Belum: isi nomor rekening di Pengaturan', 'bad']
    };
    html += '<section class="panel"><h3 class="panel-title">Aturan validasi</h3><ul class="checklist">' + T.validasi.map(function (v) {
      var st = V[v.id] || ['Dicek saat konversi KAK', 'muted'];
      return '<li><span class="cl-id">' + esc(v.id) + '</span><span class="cl-text">' + esc(v.aturan) + '</span><span class="cl-st cl-' + st[1] + '">' + esc(st[0]) + '</span></li>';
    }).join('') + '</ul></section>';
    return html;
  }

  // ---------------------------------------------------------------------------
  // RAB

  function rabTab(b) {
    var list = Store.rabsForBatch(b.id);
    var html = '<section class="panel"><div class="panel-head"><h3 class="panel-title">RAB batch ini</h3><button type="button" class="btn btn-primary btn-sm" data-new-rab>Buat RAB</button></div>';
    if (!list.length) {
      html += '<div class="empty-inline"><p>Belum ada RAB untuk ' + esc(b.label) + '. Buat dari kerangka RAB BDI atau salin RAB program yang sama, lalu cek apakah margin mencapai target.</p></div>';
    } else {
      html += '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">RAB</th><th scope="col" class="num">Peserta</th><th scope="col" class="num">Pendapatan</th><th scope="col" class="num">Total biaya</th><th scope="col" class="num">Margin</th><th scope="col" class="num">Peserta minimal</th></tr></thead><tbody>' +
        list.map(function (r) {
          var res = D.computeRab(Store.rabInput(r));
          return '<tr><td><a class="strong" href="#/rab/' + encodeURIComponent(r.id) + '">' + esc(r.title) + '</a></td><td class="num">' + res.participants + '</td><td class="num">' + UI.rupiah(res.revenue) + '</td><td class="num">' + UI.rupiah(res.totalCost) + '</td>' +
            '<td class="num ' + (res.meetsTarget ? 'num-good' : 'num-bad') + '">' + UI.pct(res.margin) + '</td><td class="num">' + (res.targetParticipants === null ? 'Tidak tercapai' : res.targetParticipants) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section>';
    return html;
  }

  // ---------------------------------------------------------------------------

  function batchIcs(b, ev) {
    var events = ev.plan.milestones.filter(function (m) { return !UI.milestoneDone(m.code, ev.stage); }).map(function (m) {
      return { uid: b.id + '-' + m.code + '@bdi-pusat-kendali', date: m.due, summary: b.label + ': ' + UI.MS_LABEL[m.code], description: m.title + (ev.eventStartAssumed ? ' (perkiraan, dihitung dari tanggal 1)' : '') };
    });
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    return D.toICS(events, { calName: 'Tenggat KAK ' + b.label, stamp: stamp });
  }

  window.Pages.batchDetail = {
    title: function (ctx) {
      var b = Store.getBatch(ctx.params.id);
      return b ? b.label : 'Batch tidak ditemukan';
    },
    render: function (ctx) {
      var b = Store.getBatch(ctx.params.id);
      if (!b) return '<div class="empty"><h2>Batch tidak ditemukan</h2><p>Kode batch "' + esc(ctx.params.id) + '" tidak ada di data 2027.</p><p><a class="btn" href="#/batch">Lihat semua batch</a></p></div>';
      var row = UI.evaluateOne(ctx.today, b.id);
      var tab = TABS.some(function (t) { return t[0] === ctx.params.tab; }) ? ctx.params.tab : 'ringkasan';
      var ev = row.ev;

      var html = '<p class="crumbs"><a href="#/batch">Batch 2027</a></p>';
      html += '<header class="detail-head"><div><h2 class="detail-title">' + esc(b.programName) + '</h2>' +
        '<p class="detail-meta"><span>Angkatan ' + b.seq + '</span><span>' + UI.scheduleText(b) + '</span><span>' + (b.tier === 'mahal' ? 'Tier mahal' : 'Tier standar') + '</span><span>' + UI.rupiah(b.price) + ' per peserta</span><span>Kuota ' + b.quota + '</span></p>' +
        (b.note ? '<p class="small num-warn">Catatan data: ' + esc(b.note) + '</p>' : '') + '</div>' +
        '<div class="detail-status">' + (b.cancelled ? '<span class="badge badge-batal">Dibatalkan</span>' : ev ? UI.riskBadge(ev) + '<span class="detail-stage">' + esc(UI.STAGE_LABEL[ev.stage]) + '</span>' : '<span class="badge badge-terlambat">Tidak bisa dihitung</span>') + '</div></header>';

      html += '<nav class="tabs" aria-label="Bagian detail batch">' + TABS.map(function (t) {
        return '<a href="#/batch/' + encodeURIComponent(b.id) + (t[0] === 'ringkasan' ? '' : '/' + t[0]) + '"' + (t[0] === tab ? ' aria-current="page" class="active"' : '') + '>' + t[1] + '</a>';
      }).join('') + '</nav>';

      if (tab === 'ringkasan') html += ringkasan(b, row, ctx);
      else if (tab === 'jalur') html += jalur(b, row, ctx);
      else if (tab === 'kak') html += kak(b);
      else html += rabTab(b);
      return html;
    },
    mount: function (root, ctx) {
      var id = ctx.params.id;
      var b = Store.getBatch(id);
      if (!b) return;
      var App = window.App;

      var form = root.querySelector('#batch-form');
      if (form) {
        var status = root.querySelector('#form-status');
        var saved = function (msg) {
          setTimeout(function () {
            ctx.refresh();
            var st = document.getElementById('form-status');
            if (st) st.textContent = msg;
          }, 0);
        };
        form.addEventListener('change', function (e) {
          var t = e.target;
          var name = t.name;
          if (name === 'eventStart') {
            var v = t.value;
            if (v && (!D.isISODate(v) || v < '2027-01-01' || v > '2027-12-31')) { status.textContent = 'Tanggal pasti harus di tahun 2027.'; status.className = 'form-status small num-bad field-wide'; return; }
            Store.updateBatch(id, { eventStart: v || null });
            saved(v ? 'Tanggal pasti disimpan. Semua tenggat dihitung ulang.' : 'Tanggal pasti dikosongkan; kembali memakai perkiraan tanggal 1.');
          } else if (name === 'pendaftar') {
            var raw = t.value.trim();
            if (raw === '') { Store.updateBatch(id, { pendaftar: null }); saved('Tersimpan.'); return; }
            var n = Number(raw);
            if (!isFinite(n) || n < 0 || Math.floor(n) !== n || n > 10000) { status.textContent = 'Pendaftar harus bilangan bulat 0 sampai 10.000.'; status.className = 'form-status small num-bad field-wide'; return; }
            Store.updateBatch(id, { pendaftar: n });
            saved('Tersimpan.');
          } else if (name === 'metode' || name === 'tempat') {
            var p = {}; p[name] = t.value.trim(); Store.updateBatch(id, p); saved('Tersimpan.');
          } else if (name === 'cancelled') {
            Store.updateBatch(id, { cancelled: t.checked });
            saved(t.checked ? 'Batch ditandai dibatalkan.' : 'Batch diaktifkan kembali.');
          }
        });
      }

      var adv = root.querySelector('[data-advance]');
      if (adv) adv.addEventListener('click', function () { App.advanceStage(id); });

      root.querySelectorAll('[data-edit-stage]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var f = btn.getAttribute('data-edit-stage');
          var bb = Store.getBatch(id);
          var fields = Store.STAGE_FIELDS;
          var i = fields.indexOf(f);
          var lo = UI.coverage.from, hi = null;
          for (var a = i - 1; a >= 0; a--) if (bb[fields[a]]) { lo = bb[fields[a]]; break; }
          for (var z = i + 1; z < fields.length; z++) if (bb[fields[z]]) { hi = bb[fields[z]]; break; }
          if (!hi) hi = ctx.today > lo ? ctx.today : lo;
          var isLetter = f === 'registrationLetterAt';
          UI.dialog({
            title: 'Ubah tanggal: ' + UI.FIELD_LABEL[f].toLowerCase(),
            body: '<label class="field"><span>Tanggal</span><input type="date" name="date" required value="' + esc(bb[f]) + '" min="' + lo + '" max="' + hi + '"></label>' +
              (isLetter ? '<label class="field"><span>Nomor surat registrasi</span><input type="text" name="no" maxlength="120" value="' + esc(bb.registrationNo) + '"></label>' : '') +
              '<p class="hint">Harus di antara ' + UI.fmtDate(lo, 'med') + ' dan ' + UI.fmtDate(hi, 'med') + ' supaya urutan tahap tetap benar.</p>',
            submitLabel: 'Simpan tanggal',
            onSubmit: function (fm) {
              var d = fm.elements.date.value;
              if (!d || !D.isISODate(d)) return 'Isi tanggal dengan benar.';
              if (d < lo || d > hi) return 'Tanggal harus di antara ' + UI.fmtDate(lo, 'med') + ' dan ' + UI.fmtDate(hi, 'med') + '.';
              var p = {}; p[f] = d;
              if (isLetter) p.registrationNo = fm.elements.no.value.trim();
              Store.updateBatch(id, p);
              UI.toast('Tanggal ' + UI.FIELD_LABEL[f].toLowerCase() + ' disimpan.');
              ctx.refresh();
            }
          });
        });
      });

      root.querySelectorAll('[data-undo-stage]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var f = btn.getAttribute('data-undo-stage');
          UI.confirmDialog('Batalkan tahap ini?', 'Tanggal "' + UI.FIELD_LABEL[f].toLowerCase() + '" akan dihapus dan batch kembali ke tahap sebelumnya. Pengingat dihitung ulang.', 'Batalkan tahap', function () {
            var p = {}; p[f] = null;
            if (f === 'registrationLetterAt') p.registrationNo = '';
            Store.updateBatch(id, p);
            UI.toast('Tahap dibatalkan. ' + Store.getBatch(id).label + ' kembali ke ' + UI.STAGE_LABEL[D.stageOf(Store.getBatch(id))] + '.');
            ctx.refresh();
          });
        });
      });

      var ics = root.querySelector('[data-ics]');
      if (ics) ics.addEventListener('click', function () {
        var row = UI.evaluateOne(ctx.today, id);
        if (!row || !row.ev) return;
        UI.download('tenggat_kak_' + id + '.ics', batchIcs(Store.getBatch(id), row.ev), 'text/calendar;charset=utf-8', 'File kalender diunduh.');
      });

      var nr = root.querySelector('[data-new-rab]');
      if (nr) nr.addEventListener('click', function () { window.Pages.rab.createDialog(id); });
    }
  };
})();

</script>
  <script>
/* js/pages/kalender.js */
/* Kalender bulanan: hari pertama pelatihan, tenggat KAK, dan libur. Unduh .ics. */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var esc = UI.esc;

  var TYPES = [
    ['EVENT', 'Hari pertama pelatihan', 'ev'],
    ['KICKOFF', 'Mulai KAK', 'int'],
    ['PREP_DONE', 'Bahan siap', 'int'],
    ['DRAFT_DONE', 'Draf selesai', 'int'],
    ['UPLOAD', 'Unggah ke Kemenkes', 'kmk'],
    ['KEMENKES_COMPLETE', 'Dinyatakan lengkap', 'kmk'],
    ['ESCALATE', 'Eskalasi ke PIC', 'kmk'],
    ['PUBLISH', 'Publikasi', 'pub'],
    ['MATERI', 'Unggah materi', 'mat']
  ];
  var TYPE_MAP = {};
  TYPES.forEach(function (t) { TYPE_MAP[t[0]] = t; });
  var SHORT = { EVENT: 'Mulai', KICKOFF: 'Mulai KAK', PREP_DONE: 'Bahan siap', DRAFT_DONE: 'Draf', UPLOAD: 'Unggah', KEMENKES_COMPLETE: 'Lengkap', ESCALATE: 'Eskalasi', PUBLISH: 'Publikasi', MATERI: 'Materi' };

  function state(ctx) {
    if (!ctx.ui.kal) {
      ctx.ui.kal = {
        month: ctx.today.slice(0, 7),
        types: { EVENT: true, KICKOFF: true, UPLOAD: true, PUBLISH: true },
        onlyFixed: false,
        hideDone: true,
        selected: ctx.today
      };
    }
    return ctx.ui.kal;
  }

  function monthAdd(ym, n) {
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + String(m + 1).padStart(2, '0');
  }

  function daysInMonth(ym) {
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
    return new Date(Date.UTC(y, m, 0)).getUTCDate();
  }

  function collect(ctx, s, typesOverride) {
    var types = typesOverride || s.types;
    var map = {};
    var add = function (d, it) { (map[d] = map[d] || []).push(it); };
    UI.evaluateAll(ctx.today).forEach(function (r) {
      if (!r.ev || r.batch.cancelled) return;
      if (s.onlyFixed && r.ev.eventStartAssumed) return;
      var b = r.batch, ev = r.ev;
      if (types.EVENT) add(ev.plan.eventStart, { type: 'EVENT', b: b, assumed: ev.eventStartAssumed, done: false, title: 'Hari pertama pelatihan' });
      ev.plan.milestones.forEach(function (m) {
        if (!types[m.code]) return;
        var done = UI.milestoneDone(m.code, ev.stage);
        if (done && s.hideDone) return;
        add(m.due, { type: m.code, b: b, assumed: ev.eventStartAssumed, done: done, title: m.title });
      });
    });
    Object.keys(map).forEach(function (d) {
      map[d].sort(function (a, b) {
        var ta = a.type === 'EVENT' ? 0 : 1, tb = b.type === 'EVENT' ? 0 : 1;
        return (ta - tb) || (a.b.label < b.b.label ? -1 : 1);
      });
    });
    return map;
  }

  function chip(it) {
    var t = TYPE_MAP[it.type];
    return '<span class="chip chip-' + t[2] + (it.done ? ' chip-done' : '') + '">' + esc(SHORT[it.type]) + ': ' + esc(it.b.label) + '</span>';
  }

  function dayPanel(date, items, holiday, ctx) {
    var html = '<section class="panel day-panel" id="day-panel" aria-live="polite"><h3 class="panel-title">' + UI.fmtDate(date, 'long') + '</h3>';
    if (holiday) html += '<p class="holiday-line">' + esc(holiday.name) + (holiday.kind === 'cuti_bersama' ? ' (cuti bersama)' : '') + '</p>';
    var cal = Store.calendar();
    var work = false;
    try { work = cal.isWorkingDay(date); } catch (e) { work = false; }
    if (!holiday && !work) html += '<p class="muted small">Akhir pekan, bukan hari kerja.</p>';
    if (!items || !items.length) {
      html += '<p class="muted">Tidak ada tenggat atau pelatihan pada tanggal ini dengan filter yang dipilih.</p>';
    } else {
      html += '<ul class="day-list">' + items.map(function (it) {
        return '<li><span class="chip chip-' + TYPE_MAP[it.type][2] + (it.done ? ' chip-done' : '') + '">' + esc(TYPE_MAP[it.type][1]) + '</span> ' +
          '<a href="#/batch/' + encodeURIComponent(it.b.id) + '/jalur">' + esc(it.b.label) + '</a>' +
          (it.assumed ? ' <span class="muted small">(perkiraan tanggal 1)</span>' : '') + (it.done ? ' <span class="muted small">(sudah selesai)</span>' : '') +
          '<div class="small muted">' + esc(it.title) + '</div></li>';
      }).join('') + '</ul>';
    }
    html += '</section>';
    return html;
  }

  function icsDialog(ctx, s) {
    var defaults = { KICKOFF: true, DRAFT_DONE: true, UPLOAD: true, ESCALATE: true, PUBLISH: true, MATERI: true };
    var body = '<fieldset class="fieldset"><legend>Batch yang disertakan</legend>' +
      '<label class="check"><input type="radio" name="scope" value="fixed" checked> Hanya batch yang sudah punya tanggal pasti</label>' +
      '<label class="check"><input type="radio" name="scope" value="all"> Semua batch, termasuk perkiraan tanggal 1</label></fieldset>' +
      '<fieldset class="fieldset"><legend>Tonggak</legend><div class="check-grid">' + TYPES.filter(function (t) { return t[0] !== 'EVENT'; }).map(function (t) {
        return '<label class="check"><input type="checkbox" name="t" value="' + t[0] + '"' + (defaults[t[0]] ? ' checked' : '') + '> ' + esc(t[1]) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<p class="hint">Tonggak yang sudah selesai dan batch yang dibatalkan tidak disertakan. Tiap acara punya alarm pukul 09.00 pada hari tenggat.</p>';
    UI.dialog({
      title: 'Unduh kalender tenggat (.ics)',
      body: body,
      submitLabel: 'Unduh .ics',
      onSubmit: function (form) {
        var types = {};
        form.querySelectorAll('input[name=t]:checked').forEach(function (c) { types[c.value] = true; });
        if (!Object.keys(types).length) return 'Pilih paling sedikit satu tonggak.';
        var all = form.querySelector('input[name=scope]:checked').value === 'all';
        var events = [];
        UI.evaluateAll(ctx.today).forEach(function (r) {
          if (!r.ev || r.batch.cancelled) return;
          if (!all && r.ev.eventStartAssumed) return;
          r.ev.plan.milestones.forEach(function (m) {
            if (!types[m.code] || UI.milestoneDone(m.code, r.ev.stage)) return;
            events.push({ uid: r.batch.id + '-' + m.code + '@bdi-pusat-kendali', date: m.due, summary: r.batch.label + ': ' + UI.MS_LABEL[m.code],
              description: m.title + (r.ev.eventStartAssumed ? ' (perkiraan, dihitung dari tanggal 1)' : '') });
          });
        });
        if (!events.length) return all ? 'Tidak ada tenggat terbuka untuk tonggak yang dipilih.' : 'Belum ada batch dengan tanggal pasti. Pilih "Semua batch" atau isi tanggal pasti dulu.';
        var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
        UI.download('tenggat_kak_2027.ics', D.toICS(events, { calName: 'Tenggat KAK BDI 2027', stamp: stamp }), 'text/calendar;charset=utf-8', events.length + ' tenggat diunduh ke file kalender.');
      }
    });
  }

  window.Pages.kalender = {
    title: 'Kalender',
    render: function (ctx) {
      var s = state(ctx);
      var minM = UI.coverage.from.slice(0, 7), maxM = UI.coverage.to.slice(0, 7);
      if (s.month < minM) s.month = minM;
      if (s.month > maxM) s.month = maxM;
      var items = collect(ctx, s);
      var hol = {};
      Store.holidays().forEach(function (h) { hol[h.date] = h; });

      var html = '<div class="cal-bar">' +
        '<div class="cal-nav"><button type="button" class="btn" data-month="-1"' + (s.month <= minM ? ' disabled' : '') + ' aria-label="Bulan sebelumnya">‹</button>' +
        '<h2 class="cal-title">' + UI.fmtMonth(s.month) + '</h2>' +
        '<button type="button" class="btn" data-month="1"' + (s.month >= maxM ? ' disabled' : '') + ' aria-label="Bulan berikutnya">›</button>' +
        '<button type="button" class="btn btn-ghost" data-month="today">Bulan acuan</button></div>' +
        '<button type="button" class="btn" data-ics>Unduh .ics</button></div>';

      html += '<fieldset class="cal-filters"><legend class="sr-only">Tampilkan di kalender</legend>' + TYPES.map(function (t) {
        return '<label class="check chip-check"><input type="checkbox" id="kt-' + t[0] + '" data-type="' + t[0] + '"' + (s.types[t[0]] ? ' checked' : '') + '><span class="chip chip-' + t[2] + '">' + esc(t[1]) + '</span></label>';
      }).join('') +
        '<label class="check"><input type="checkbox" id="ko-fixed" data-opt="onlyFixed"' + (s.onlyFixed ? ' checked' : '') + '> Hanya batch bertanggal pasti</label>' +
        '<label class="check"><input type="checkbox" id="ko-done" data-opt="hideDone"' + (s.hideDone ? ' checked' : '') + '> Sembunyikan tonggak yang sudah selesai</label>' +
        '</fieldset>';

      var first = s.month + '-01';
      var offset = (D.dayOfWeek(first) + 6) % 7;
      var n = daysInMonth(s.month);
      html += '<div class="cal" role="grid" aria-label="Kalender ' + UI.fmtMonth(s.month) + '"><div class="cal-row cal-head" role="row">' +
        ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(function (d) { return '<span role="columnheader">' + d + '</span>'; }).join('') + '</div><div class="cal-body">';
      for (var i = 0; i < offset; i++) html += '<span class="cal-cell cal-empty" aria-hidden="true"></span>';
      for (var d = 1; d <= n; d++) {
        var iso = s.month + '-' + String(d).padStart(2, '0');
        var list = items[iso] || [];
        var h = hol[iso];
        var dow = D.dayOfWeek(iso);
        var weekend = dow === 0 || dow === 6;
        var cls = 'cal-cell' + (weekend ? ' weekend' : '') + (h ? ' holiday' : '') + (iso === ctx.today ? ' today' : '') + (iso === s.selected ? ' selected' : '');
        var label = UI.fmtDate(iso, 'long') + (h ? ', ' + h.name : '') + (list.length ? ', ' + list.length + ' item' : '');
        html += '<button type="button" id="day-' + iso + '" class="' + cls + '" data-day="' + iso + '" aria-label="' + esc(label) + '" aria-pressed="' + (iso === s.selected) + '">' +
          '<span class="cal-num">' + d + '</span>' +
          (h ? '<span class="cal-hol">' + esc(h.name) + '</span>' : '') +
          '<span class="cal-items">' + list.slice(0, 3).map(chip).join('') + (list.length > 3 ? '<span class="more">+' + (list.length - 3) + ' lagi</span>' : '') + '</span>' +
          (list.length ? '<span class="cal-dot" aria-hidden="true">' + list.length + '</span>' : '') +
          '</button>';
      }
      html += '</div></div>';

      if (s.selected && s.selected.slice(0, 7) === s.month) html += dayPanel(s.selected, items[s.selected], hol[s.selected], ctx);
      else html += '<p class="muted footnote">Pilih tanggal untuk melihat semua tenggat pada hari itu.</p>';
      html += '<p class="footnote">' + esc('Libur nasional dan cuti bersama 2027 diambil dari artikel Kemensetneg atas SKB 3 Menteri dan belum dicocokkan dengan PDF SKB asli. Idulfitri dan Iduladha bisa bergeser.') + '</p>';
      return html;
    },
    mount: function (root, ctx) {
      var s = state(ctx);
      root.querySelectorAll('[data-month]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var v = btn.getAttribute('data-month');
          if (v === 'today') { s.month = ctx.today.slice(0, 7); s.selected = ctx.today; }
          else s.month = monthAdd(s.month, Number(v));
          ctx.refresh();
        });
      });
      root.querySelectorAll('[data-type]').forEach(function (c) {
        c.addEventListener('change', function () { s.types[c.getAttribute('data-type')] = c.checked; ctx.refresh(); });
      });
      root.querySelectorAll('[data-opt]').forEach(function (c) {
        c.addEventListener('change', function () { s[c.getAttribute('data-opt')] = c.checked; ctx.refresh(); });
      });
      root.querySelectorAll('[data-day]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          s.selected = btn.getAttribute('data-day');
          ctx.refresh();
          var p = document.getElementById('day-panel');
          if (p && window.matchMedia('(max-width: 760px)').matches) p.scrollIntoView({ block: 'nearest' });
        });
      });
      root.querySelector('[data-ics]').addEventListener('click', function () { icsDialog(ctx, s); });
    }
  };
})();

</script>
  <script>
/* js/pages/rab.js */
/* RAB: daftar, buat/salin, dan form seperti Excel dengan panel Cek Target (margin, peserta minimal, harga minimum, sensitivitas). */
(function () {
  'use strict';

  var D = window.BDIDomain;
  var UI = window.UI;
  var Store = window.Store;
  var SEED = window.BDI_SEED;
  var esc = UI.esc;

  var TIER_LABEL = { internal: 'Internal', eksternal_diskon: 'Eksternal diskon', eksternal: 'Eksternal' };
  var DUR_UNITS = SEED.rabTemplate.satuan_durasi.concat(['HARI', 'PKG']);

  function batchOptions(selected) {
    var groups = {};
    Store.getBatches().forEach(function (b) { (groups[b.program] = groups[b.program] || []).push(b); });
    return SEED.programs.map(function (p) {
      return '<optgroup label="' + esc(p.short) + '">' + (groups[p.code] || []).map(function (b) {
        return '<option value="' + esc(b.id) + '"' + (b.id === selected ? ' selected' : '') + '>' + esc(b.label) + ' (' + UI.fmtMonth(b.plannedMonth, true) + ')</option>';
      }).join('') + '</optgroup>';
    }).join('');
  }

  function rabOptions(program) {
    var list = Store.rabs().slice().sort(function (a, b) {
      var pa = a.program === program ? 0 : 1, pb = b.program === program ? 0 : 1;
      return (pa - pb) || (a.title < b.title ? -1 : 1);
    });
    return list.map(function (r) { return '<option value="' + esc(r.id) + '">' + esc(r.title) + '</option>'; }).join('');
  }

  function createDialog(batchId, copyFromId) {
    var first = batchId || Store.getBatches()[0].id;
    var b0 = Store.getBatch(first);
    var hasRabs = Store.rabs().length > 0;
    var body = '<label class="field"><span>Batch 2027</span><select name="batch" id="nr-batch">' + batchOptions(first) + '</select></label>' +
      '<fieldset class="fieldset"><legend>Mulai dari</legend>' +
      '<label class="check"><input type="radio" name="src" value="kerangka"' + (copyFromId ? '' : ' checked') + '> Kerangka RAB BDI (6 bagian, harga kosong)</label>' +
      (hasRabs ? '<label class="check"><input type="radio" name="src" value="salin"' + (copyFromId ? ' checked' : '') + '> Salin dari RAB yang sudah ada</label>' +
        '<label class="field field-indent"><span class="sr-only">RAB sumber</span><select name="from" id="nr-from">' + rabOptions(b0.program) + '</select></label>' : '') +
      '</fieldset><p class="hint">Pendapatan awal memakai kuota dan harga batch. Baris bertanda "= peserta" mengikuti jumlah peserta.</p>';
    UI.dialog({
      title: copyFromId ? 'Salin RAB ke batch 2027' : 'Buat RAB',
      body: body,
      submitLabel: copyFromId ? 'Salin RAB' : 'Buat RAB',
      onOpen: function (form) {
        if (copyFromId && form.elements.from) form.elements.from.value = copyFromId;
        var sync = function () { if (form.elements.from) form.elements.from.disabled = form.querySelector('input[name=src]:checked').value !== 'salin'; };
        form.querySelectorAll('input[name=src]').forEach(function (r) { r.addEventListener('change', sync); });
        sync();
      },
      onSubmit: function (form) {
        var b = Store.getBatch(form.elements.batch.value);
        if (!b) return 'Pilih batch.';
        var src = form.querySelector('input[name=src]:checked').value;
        var rab;
        if (src === 'salin') {
          var from = Store.getRab(form.elements.from.value);
          if (!from) return 'Pilih RAB sumber.';
          rab = Store.copyRab(from, b);
        } else {
          rab = Store.newRabFromTemplate(b);
        }
        Store.saveRab(rab);
        UI.toast('RAB dibuat untuk ' + b.label + '.');
        window.location.hash = '#/rab/' + encodeURIComponent(rab.id);
      }
    });
  }

  // ---------------------------------------------------------------------------
  // Daftar RAB

  window.Pages.rab = {
    title: 'RAB',
    createDialog: createDialog,
    render: function () {
      var list = Store.rabs().map(function (r) { return { r: r, res: D.computeRab(Store.rabInput(r)) }; });
      var own = list.filter(function (x) { return !x.r.example; });
      var ex = list.filter(function (x) { return x.r.example; });
      var html = '<div class="toolbar"><p class="page-intro-inline">Satu kerangka RAB untuk semua pelatihan. Margin dihitung setelah biaya tidak terduga, lalu dibandingkan dengan target.</p>' +
        '<div class="toolbar-actions"><button type="button" class="btn btn-primary" data-new>Buat RAB</button></div></div>';

      var table = function (rows, showBatch) {
        return '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">RAB</th>' + (showBatch ? '<th scope="col">Batch</th>' : '') +
          '<th scope="col" class="num">Peserta</th><th scope="col" class="num">Pendapatan</th><th scope="col" class="num">Total biaya</th><th scope="col" class="num">Margin</th>' +
          '<th scope="col" class="num">Peserta impas</th><th scope="col" class="num">Peserta minimal target</th></tr></thead><tbody>' +
          rows.map(function (x) {
            var r = x.r, res = x.res;
            var b = r.batchId ? Store.getBatch(r.batchId) : null;
            return '<tr><td><a class="strong" href="#/rab/' + encodeURIComponent(r.id) + '">' + esc(r.title) + '</a>' + (r.updatedAt ? '<div class="small muted">Diubah ' + UI.fmtDate(r.updatedAt.slice(0, 10), 'med') + '</div>' : '') + '</td>' +
              (showBatch ? '<td>' + (b ? '<a href="#/batch/' + encodeURIComponent(b.id) + '">' + esc(b.label) + '</a>' : '<span class="muted">–</span>') + '</td>' : '') +
              '<td class="num">' + res.participants + '</td><td class="num nowrap">' + UI.rupiah(res.revenue) + '</td><td class="num nowrap">' + UI.rupiah(res.totalCost) + '</td>' +
              '<td class="num"><span class="' + (res.meetsTarget ? 'num-good' : 'num-bad') + '">' + UI.pct(res.margin) + '</span><div class="small muted">target ' + UI.pct(r.targetMargin) + '</div></td>' +
              '<td class="num">' + (res.breakEvenParticipants === null ? '–' : res.breakEvenParticipants) + '</td>' +
              '<td class="num">' + (res.targetParticipants === null ? '<span class="num-bad">Tidak tercapai</span>' : res.targetParticipants) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      };

      html += '<section class="panel"><h3 class="panel-title">RAB batch 2027 <span class="count">' + own.length + '</span></h3>';
      html += own.length ? table(own, true) : '<div class="empty-inline"><p>Belum ada RAB untuk batch 2027. Buat dari kerangka, atau salin salah satu RAB contoh di bawah lalu sesuaikan harganya.</p></div>';
      html += '</section>';
      html += '<section class="panel"><h3 class="panel-title">RAB contoh dari data 2026</h3>' +
