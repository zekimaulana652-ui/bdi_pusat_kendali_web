<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tim Training BDI</title>
  <meta name="description"
    content="Pusat kendali pelatihan Tim Training BDI: jadwal pelatihan, harga, status terlaksana/reschedule/cancel, KAK, RAB, dan evaluasi.">
  <style>
    /* BDI Pusat Kendali — Tampilan Modern, Fleksibel & Mudah Dipahami */
    :root {
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --surface-2: #F8FAFC;
      --surface-3: #EEF2F7;
      --ink: #0F172A;
      --ink-2: #475569;
      --ink-3: #64748B;
      --line: #E2E8F0;
      --line-2: #EEF2F6;
      --navy: #0F2942;
      --navy-2: #1A3B5C;
      --navy-soft: #EBF2FA;
      --brand: #2563EB;
      --brand-hover: #1D4ED8;
      --brand-soft: #EFF6FF;
      --link: #1D4ED8;
      --red: #DC2626;
      --red-soft: #FEF2F2;
      --red-line: #FECACA;
      --amber: #B45309;
      --amber-soft: #FFFBEB;
      --amber-line: #FDE68A;
      --amber-mark: #F59E0B;
      --green: #15803D;
      --green-soft: #F0FDF4;
      --green-line: #BBF7D0;
      --green-mark: #22C55E;
      --focus: #2563EB;
      --sidebar-w: 248px;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .04);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, .12);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
    }

    body.compact {
      font-size: 13px;
    }

    body.compact .panel {
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    body.compact .table td,
    body.compact .table th {
      padding: 6px 8px;
    }

    body.compact .main {
      padding: 18px 22px 48px;
    }

    a {
      color: var(--link);
      text-underline-offset: 2px;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      color: var(--brand-hover);
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 8px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .ico {
      width: 16px;
      height: 16px;
      flex: none;
      vertical-align: -2px;
    }

    .ico-lg {
      width: 20px;
      height: 20px;
    }

    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -52px;
      z-index: 300;
      background: var(--surface);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .skip:focus {
      top: 12px;
    }

    /* ------------------------------------------------------------------ */
    /* Kerangka Utama & Sidebar Fleksibel */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-w);
      z-index: 50;
      background: linear-gradient(180deg, #0D2238 0%, #132F4C 100%);
      color: #CBD5E1;
      display: flex;
      flex-direction: column;
      transition: width .2s ease, transform .2s ease;
      border-right: 1px solid rgba(255, 255, 255, .07);
    }

    body.sb-collapsed .sidebar {
      width: 68px;
    }

    body.sb-collapsed .brand-text,
    body.sb-collapsed .nav-group-label,
    body.sb-collapsed .nav-label,
    body.sb-collapsed .nav-count,
    body.sb-collapsed .sidebar-foot {
      display: none;
    }

    body.sb-collapsed .brand {
      justify-content: center;
      padding: 16px 8px;
    }

    body.sb-collapsed .nav a {
      justify-content: center;
      padding: 10px;
    }

    body.sb-collapsed .shell {
      margin-left: 68px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 18px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex: none;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .4);
    }

    .brand-name {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: #94A3B8;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .nav-group {
      margin-bottom: 14px;
    }

    .nav-group-label {
      margin: 0 10px 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #64748B;
    }

    .nav {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav li+li {
      margin-top: 2px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      color: #CBD5E1;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: background .14s ease, color .14s ease;
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
      text-decoration: none;
    }

    .nav a.active {
      background: rgba(59, 130, 246, .22);
      color: #fff;
      font-weight: 600;
      box-shadow: inset 3px 0 0 #60A5FA;
    }

    .nav-label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-count {
      min-width: 20px;
      padding: 0 7px;
      border-radius: 999px;
      text-align: center;
      background: #EF4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
    }

    .sidebar-foot {
      margin: auto 14px 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, .05);
      font-size: 11.5px;
      color: #94A3B8;
      line-height: 1.4;
    }

    .nav-scrim {
      display: none;
    }

    .shell {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      transition: margin-left .2s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .page-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }

    .top-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink-3);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .search-trigger:hover {
      border-color: #CBD5E1;
      background: #fff;
      color: var(--ink);
    }

    .kbd {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink-3);
    }

    .acuan {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .acuan.simulating {
      background: var(--amber-soft);
      border-color: var(--amber-line);
      color: var(--amber);
    }

    .acuan input {
      min-height: 28px;
      padding: 2px 6px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
    }

    .acuan input:hover,
    .acuan input:focus {
      background: #fff;
      border-color: var(--line);
    }

    .icon-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      cursor: pointer;
    }

    .icon-toggle:hover {
      background: var(--surface-2);
      color: var(--ink);
    }

    .menu-btn {
      display: none;
    }

    .global-note {
      padding: 8px 24px;
      background: var(--amber-soft);
      border-bottom: 1px solid var(--amber-line);
      font-size: 13px;
      color: #78350F;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
    }

    .global-note p {
      margin: 0;
    }

    .main {
      padding: 22px 26px 64px;
      max-width: 1440px;
    }

    .main:focus {
      outline: none;
    }

    /* ------------------------------------------------------------------ */
    /* Komponen Umum */

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 18px;
      min-width: 0;
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panel-head .panel-title {
      margin: 0;
    }

    .panel-sub {
      margin: -4px 0 14px;
      color: var(--ink-2);
      max-width: 82ch;
      font-size: 13.5px;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--ink-2);
      font-size: 11.5px;
      font-weight: 700;
    }

    .muted {
      color: var(--ink-3);
    }

    .small {
      font-size: 12.5px;
    }

    .strong {
      font-weight: 600;
    }

    .nowrap {
      white-space: nowrap;
    }

    .right {
      text-align: right;
    }

    .num-bad {
      color: var(--red);
      font-weight: 600;
    }

    .num-warn {
      color: var(--amber);
      font-weight: 600;
    }

    .num-good {
      color: var(--green);
      font-weight: 600;
    }

    .clamp {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footnote {
      margin: 12px 0 0;
      font-size: 12.5px;
      color: var(--ink-3);
      max-width: 96ch;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--ink-3);
    }

    .page-intro {
      margin: 0 0 14px;
      color: var(--ink-2);
      max-width: 84ch;
      font-size: 13.5px;
    }

    .page-intro p {
      margin: 0;
    }

    .pill-est {
      display: inline-block;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px dashed #F59E0B;
      vertical-align: 1px;
    }

    /* Badges & Status */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
    }

    .badge-terlambat,
    .badge-galat,
    .badge-rusak,
    .badge-tidak_lulus {
      color: var(--red);
      background: var(--red-soft);
      border-color: var(--red-line);
    }

    .badge-segera,
    .badge-peringatan,
    .badge-remedial,
    .badge-draf {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: var(--amber-line);
    }

    .badge-aman,
    .badge-baik,
    .badge-lulus,
    .badge-final {
      color: var(--green);
      background: var(--green-soft);
      border-color: var(--green-line);
    }

    .badge-selesai,
    .badge-diunggah {
      color: #1E40AF;
      background: var(--brand-soft);
      border-color: #BFDBFE;
    }

    .badge-info,
    .badge-belum_dicek,
    .badge-belum_lengkap,
    .badge-belum {
      color: #334155;
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .badge-batal {
      color: var(--ink-3);
      background: #F1F5F9;
      border-color: var(--line);
    }

    /* Dasar tanggal: penuh = sumber resmi Kemenkes, putus-putus = asumsi BDI */
    .basis {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
    }

    .basis-sumber {
      background: var(--navy);
      color: #fff;
      border: 1px solid var(--navy);
    }

    .basis-asumsi {
      background: #fff;
      color: #334155;
      border: 1px dashed #64748B;
    }

    .basis-aturan {
      background: var(--brand-soft);
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }

    .notice {
      margin: 0 0 16px;
      padding: 12px 15px;
      border-radius: var(--radius-sm);
      background: var(--brand-soft);
      border: 1px solid #BFDBFE;
      border-left: 4px solid var(--brand);
      font-size: 13.5px;
    }

    .notice p {
      margin: 0;
      max-width: 96ch;
    }

    .notice-error {
      background: var(--red-soft);
      border-color: var(--red-line);
      border-left-color: var(--red);
      color: #7F1D1D;
    }

    .notice-ok {
      background: var(--green-soft);
      border-color: var(--green-line);
      border-left-color: var(--green);
      color: #14532D;
    }

    .notice-warn {
      background: var(--amber-soft);
      border-color: var(--amber-line);
      border-left-color: var(--amber-mark);
      color: #78350F;
    }

    .empty {
      padding: 36px 28px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed #CBD5E1;
      border-radius: var(--radius);
    }

    .empty h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .empty p {
      color: var(--ink-2);
      max-width: 58ch;
      margin: 0 auto 12px;
    }

    .empty-inline {
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px dashed var(--line);
    }

    .empty-inline p {
      margin: 0;
      color: var(--ink-2);
    }

    /* Tombol */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid #CBD5E1;
      background: var(--surface);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background .14s, border-color .14s, box-shadow .14s;
    }

    .btn:hover {
      background: var(--surface-2);
      border-color: #94A3B8;
      color: var(--ink);
      text-decoration: none;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 1px 2px rgba(37, 99, 235, .25);
    }

    .btn-primary:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
      color: #fff;
    }

    .btn-navy {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .btn-navy:hover {
      background: var(--navy-2);
      color: #fff;
    }

    .btn-danger {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .btn-danger:hover {
      background: #B91C1C;
      color: #fff;
    }

    .btn-danger-ghost {
      color: var(--red);
      border-color: var(--red-line);
      background: #fff;
    }

    .btn-danger-ghost:hover {
      background: var(--red-soft);
      color: var(--red);
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: var(--link);
    }

    .btn-ghost:hover {
      background: var(--brand-soft);
      color: var(--brand-hover);
    }

    .btn-sm {
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12.5px;
    }

    .btn-xs {
      min-height: 26px;
      padding: 3px 8px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
    }

    .link-btn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--link);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
      color: var(--brand-hover);
    }

    .link-danger {
      color: var(--red);
    }

    .link-danger:hover {
      color: #B91C1C;
    }

    .icon-btn {
      padding: 4px 7px;
      border: 0;
      background: none;
      color: var(--red);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 5px;
    }

    .icon-btn:hover {
      background: var(--red-soft);
    }

    .file-btn {
      position: relative;
    }

    /* Segmented / View Switcher & Quick Filter Chips */
    .seg {
      display: inline-flex;
      padding: 3px;
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      border: 1px solid var(--line);
      gap: 2px;
    }

    .seg button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
    }

    .seg button:hover {
      color: var(--ink);
    }

    .seg button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all .14s;
    }

    .chip-btn:hover {
      border-color: #94A3B8;
      color: var(--ink);
    }

    .chip-btn.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .chip-btn.active .count {
      background: rgba(255, 255, 255, .2);
      color: #fff;
    }

    /* Isian & Form */
    input[type=text],
    input[type=number],
    input[type=date],
    input[type=time],
    input[type=url],
    input[type=search],
    select,
    textarea {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-sm);
      background: #fff;
      font-size: 13.5px;
      transition: border-color .14s, box-shadow .14s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      outline: none;
    }

    input:disabled,
    select:disabled {
      background: var(--surface-2);
      color: var(--ink-3);
    }

    input.invalid {
      border-color: var(--red);
      background: var(--red-soft);
    }

    input[type=checkbox],
    input[type=radio] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--brand);
      flex: none;
    }

    textarea {
      resize: vertical;
      min-height: 82px;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: var(--ink-2);
      min-width: 0;
    }

    .field>span {
      font-weight: 600;
      color: var(--ink);
    }

    .field-inline {
      min-width: 145px;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    .field-grow {
      flex: 1;
      min-width: 200px;
    }

    .field-indent {
      margin-left: 26px;
    }

    .hint {
      font-size: 12px;
      color: var(--ink-3);
      margin: 0;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--ink);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px 18px;
    }

    .form-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .form-error {
      margin: 8px 0 0;
      color: var(--red);
      font-size: 13px;
      font-weight: 500;
    }

    .form-status {
      margin: 0;
      min-height: 18px;
    }

    .fieldset {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .fieldset legend {
      padding: 0 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: flex-end;
      padding: 14px 16px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .filters .check {
      min-height: 36px;
    }

    .filters-count {
      margin: 0 0 0 auto;
      align-self: center;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 500;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar .filters-count {
      margin: 0;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Tabel */
    .table-wrap {
      position: relative;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .table th {
      padding: 9px 11px;
      text-align: left;
      vertical-align: bottom;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--ink-3);
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .table td {
      padding: 10px 11px;
      vertical-align: middle;
      border-bottom: 1px solid var(--line-2);
    }

    .table tbody tr:hover td {
      background: #F8FAFC;
    }

    .table tbody tr:last-child td {
      border-bottom: 0;
    }

    .table tfoot th,
    .table tfoot td {
      border-top: 2px solid var(--line);
      border-bottom: 0;
      background: var(--surface-2);
      font-weight: 700;
    }

    .table .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-compact th,
    .table-compact td {
      padding: 6px 8px;
      font-size: 13px;
    }

    .row-done td {
      color: var(--ink-3);
    }

    .row-current td {
      background: var(--brand-soft) !important;
    }

    .th-sort {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: 0;
      background: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      font-size: 12px;
      color: inherit;
      cursor: pointer;
    }

    th.num .th-sort {
      justify-content: flex-end;
      width: 100%;
    }

    .th-sort:hover {
      color: var(--ink);
    }

    .sort-ind {
      font-size: 9px;
      min-width: 9px;
      color: var(--brand);
    }

    /* ------------------------------------------------------------------ */
    /* Beranda (Hari Ini) — KPI Cards, Panduan Alur & Aksi Cepat */

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .kpi {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      color: var(--ink);
      text-decoration: none;
      transition: transform .14s, border-color .14s, box-shadow .14s;
      border-top: 3px solid var(--line);
    }

    .kpi:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, .07);
      text-decoration: none;
      border-color: #CBD5E1;
    }

    .kpi-red {
      border-top-color: var(--red);
    }

    .kpi-amber {
      border-top-color: var(--amber-mark);
    }

    .kpi-blue {
      border-top-color: var(--brand);
    }

    .kpi-green {
      border-top-color: var(--green-mark);
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .kpi-val {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .kpi-red .kpi-val {
      color: var(--red);
    }

    .kpi-amber .kpi-val {
      color: var(--amber);
    }

    .kpi-blue .kpi-val {
      color: var(--brand);
    }

    .kpi-green .kpi-val {
      color: var(--green);
    }

    .kpi-sub {
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .guide-box {
      background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 100%);
      border: 1px solid #BFDBFE;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 18px;
    }

    .guide-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .guide-title {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .gstep {
      background: #fff;
      border: 1px solid #DBEAFE;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--ink);
      text-decoration: none;
      transition: border-color .14s, transform .14s;
    }

    .gstep:hover {
      border-color: var(--brand);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .gstep-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .gstep strong {
      font-size: 13.5px;
      color: var(--navy);
    }

    .gstep span {
      font-size: 12px;
      color: var(--ink-2);
      line-height: 1.4;
    }

    .today-head {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .today-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .today-date {
      margin: 0 0 3px;
      color: var(--brand);
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .today-lead {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      max-width: 64ch;
    }

    .quick-acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .riskbar {
      display: flex;
      gap: 3px;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface-3);
    }

    .rb-seg {
      min-width: 6px;
      transition: flex-grow .2s;
    }

    .rb-terlambat {
      background: var(--red);
    }

    .rb-segera {
      background: var(--amber-mark);
    }

    .rb-aman {
      background: var(--green-mark);
    }

    .rb-selesai {
      background: var(--brand);
    }

    .rb-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 10px;
      font-size: 13px;
    }

    .rb-key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 500;
    }

    .rb-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .split-side {
      min-width: 0;
    }

    .rem-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rem {
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      background: var(--surface-2);
    }

    .rem-terlambat {
      border-left-color: var(--red);
      background: #FFF8F8;
    }

    .rem-segera {
      border-left-color: var(--amber-mark);
      background: #FFFDF5;
    }

    .rem-info {
      border-left-color: var(--brand);
    }

    .rem-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rem-due {
      font-size: 12px;
      color: var(--ink-3);
      font-weight: 500;
    }

    .rem-title {
      margin: 6px 0 3px;
      font-weight: 700;
      font-size: 14px;
    }

    .rem-msg {
      margin: 0 0 10px;
      color: var(--ink-2);
      font-size: 13px;
      max-width: 78ch;
    }

    .rem-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .todo {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .todo li {
      padding: 10px 0;
      border-top: 1px solid var(--line-2);
      font-size: 13.5px;
    }

    .todo li:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .win-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .win-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 105px 62px;
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      font-size: 13.5px;
      border-bottom: 1px solid var(--line-2);
    }

    .win-list li:last-child {
      border-bottom: 0;
    }

    .win-bar {
      position: relative;
      height: 7px;
      background: #E2E8F0;
      border-radius: 999px;
    }

    .win-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--green-mark);
      border-radius: 999px;
    }

    .win-fill.bad {
      background: var(--red);
    }

    .win-target {
      position: absolute;
      left: 50%;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: var(--ink-3);
    }

    .win-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ------------------------------------------------------------------ */
    /* Tracker KAK & Batch Grid Cards */

    .board {
      position: relative;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(265px, 1fr);
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 14px;
      align-items: start;
    }

    .col {
      background: #E6ECF4;
      border-radius: var(--radius);
      padding: 10px;
      min-width: 0;
    }

    .col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 4px 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .col-list {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-empty {
      margin: 4px;
      font-size: 12.5px;
      color: var(--ink-3);
      text-align: center;
      padding: 14px 6px;
    }

    .kc {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid #94A3B8;
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }

    .kc-terlambat {
      border-left-color: var(--red);
    }

    .kc-segera {
      border-left-color: var(--amber-mark);
    }

    .kc-aman {
      border-left-color: var(--green-mark);
    }

    .kc-selesai {
      border-left-color: var(--brand);
    }

    .kc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .kc-title {
      font-weight: 700;
      color: var(--ink);
      font-size: 13.5px;
    }

    .kc-date,
    .kc-next,
    .kc-win {
      margin: 4px 0 0;
      font-size: 12.5px;
    }

    .kc .btn {
      margin-top: 10px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .bcard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .bcard-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .bcard-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink);
    }

    .bcard-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .bcard-foot {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line-2);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ------------------------------------------------------------------ */
    /* Detail Batch & Sub-Navigasi Pelaksanaan */

    .detail-head {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .detail-title {
      margin: 0 0 6px;
      font-size: 19px;
      font-weight: 700;
      max-width: 68ch;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin: 0;
      color: var(--ink-2);
      font-size: 13px;
    }

    .detail-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex: none;
    }

    .detail-stage {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .tabs {
      position: relative;
      display: flex;
      gap: 4px;
      margin: 0 0 18px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    .tabs a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      color: var(--ink-2);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: background .14s, color .14s;
    }

    .tabs a:hover {
      background: var(--surface-2);
      color: var(--ink);
      text-decoration: none;
    }

    .tabs a.active {
      background: var(--navy);
      color: #fff;
    }

    .tabs a.active .count {
      background: rgba(255, 255, 255, .22);
      color: #fff;
    }

    .subpills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .subpills button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .subpills button:hover {
      border-color: var(--brand);
      color: var(--brand);
    }

    .subpills button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .subpills button.active .count {
      background: rgba(255, 255, 255, .25);
      color: #fff;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .step {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 12px;
      padding-bottom: 16px;
    }

    .step:not(:last-child)::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 26px;
      bottom: 2px;
      width: 2px;
      background: var(--line);
    }

    .step.done:not(:last-child)::before {
      background: var(--brand);
    }

    .step-mark {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #CBD5E1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .step.done .step-mark {
      background: var(--brand);
      border-color: var(--brand);
    }

    .step.current .step-mark {
      border-color: var(--brand);
      background: radial-gradient(circle, var(--brand) 0 5px, #fff 6px);
    }

    .step-label {
      margin: 0;
      font-weight: 700;
    }

    .step-date {
      margin: 2px 0 6px;
      font-size: 13px;
    }

    .step-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .lead-msg {
      margin: 0 0 6px;
      max-width: 86ch;
      font-size: 14px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px 18px;
      margin: 16px 0 0;
    }

    .facts div {
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .facts dt {
      font-size: 12px;
      color: var(--ink-3);
      font-weight: 600;
    }

    .facts dd {
      margin: 3px 0 0;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Progress Bar Kuota */
    .quota-bar {
      height: 10px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
      margin: 8px 0 6px;
    }

    .quota-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--brand);
      transition: width .2s;
    }

    .quota-fill.ok {
      background: var(--green-mark);
    }

    .quota-fill.warn {
      background: var(--amber-mark);
    }

    /* Garis waktu jalur mundur */
    .timeline {
      margin: 18px 0 4px;
    }

    .tl-area {
      position: relative;
      height: 136px;
      margin: 0 14px;
    }

    .tl-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 64px;
      height: 14px;
      background: #EEF1F4;
      border-radius: 4px;
    }

    .tl-seg {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 2px;
    }

    .tl-sumber {
      background: var(--navy);
    }

    .tl-asumsi {
      background: #F1F5F9;
      border: 2px dashed #64748B;
    }

    .tl-pasar {
      background: #86EFAC;
    }

    .tl-proj {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 4px;
      margin-left: -2px;
      background: var(--red);
      border-radius: 2px;
    }

    .tl-mark {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
    }

    .tl-tick {
      position: absolute;
      left: -1px;
      width: 2px;
      background: var(--ink);
    }

    .tl-top .tl-tick {
      top: 54px;
      height: 24px;
    }

    .tl-bottom .tl-tick {
      top: 64px;
      height: 26px;
    }

    .tl-label {
      position: absolute;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      transform: translateX(-50%);
    }

    .tl-top .tl-label {
      top: 20px;
    }

    .tl-bottom .tl-label {
      top: 94px;
    }

    .tl-date {
      display: block;
      font-weight: 500;
      color: var(--ink-2);
      font-size: 11.5px;
    }

    .tl-al-start .tl-label {
      transform: none;
      left: -1px;
    }

    .tl-al-end .tl-label {
      transform: translateX(-100%);
      left: 1px;
      text-align: right;
    }

    .tl-today {
      position: absolute;
      top: 14px;
      bottom: 6px;
      width: 0;
      border-left: 2px solid var(--brand);
      margin-left: -1px;
    }

    .tl-today-label {
      position: absolute;
      top: -14px;
      transform: translateX(-50%);
      white-space: nowrap;
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      line-height: 16px;
    }

    .tl-today.tl-al-start .tl-today-label {
      transform: none;
      left: -2px;
    }

    .tl-today.tl-al-end .tl-today-label {
      transform: translateX(-100%);
      left: 0;
    }

    .tl-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .sw {
      display: inline-block;
      width: 20px;
      height: 10px;
      margin-right: 6px;
      vertical-align: -1px;
      border-radius: 2px;
    }

    .sw-sumber {
      background: var(--navy);
    }

    .sw-asumsi {
      background: #F1F5F9;
      border: 2px dashed #64748B;
    }

    .sw-pasar {
      background: #86EFAC;
    }

    .sw-proj {
      width: 4px;
      height: 14px;
      vertical-align: -3px;
      background: var(--red);
      border-radius: 2px;
    }

    .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .checklist li {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid var(--line-2);
      font-size: 13.5px;
    }

    .checklist li:first-child {
      border-top: 0;
    }

    .cl-id {
      font-weight: 700;
      color: var(--navy);
    }

    .cl-st {
      white-space: nowrap;
      font-size: 12.5px;
    }

    .cl-ok {
      color: var(--green);
      font-weight: 600;
    }

    .cl-bad {
      color: var(--red);
      font-weight: 600;
    }

    .cl-muted {
      color: var(--ink-3);
    }

    /* Temuan Pemeriksa KAK & Laporan */
    .findings {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .finding {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid;
      font-size: 13.5px;
    }

    .finding-galat {
      background: var(--red-soft);
      border-color: var(--red-line);
      color: #7F1D1D;
    }

    .finding-peringatan {
      background: var(--amber-soft);
      border-color: var(--amber-line);
      color: #78350F;
    }

    .finding-code {
      font-weight: 800;
      font-size: 12px;
      padding: 1px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .85);
      flex: none;
    }

    /* Laporan Pratinjau Resmi */
    .report-doc {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 32px;
      max-width: 920px;
    }

    .report-kop {
      text-align: center;
      border-bottom: 2px solid var(--navy);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .report-kop h2 {
      margin: 0 0 4px;
      font-size: 18px;
      color: var(--navy);
    }

    .report-sec {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-2);
    }

    .report-sec:last-child {
      border-bottom: 0;
    }

    .report-sec h4 {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 14.5px;
    }

    /* ------------------------------------------------------------------ */
    /* Kalender */

    .cal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cal-nav .btn[data-month="-1"],
    .cal-nav .btn[data-month="1"] {
      min-width: 38px;
      font-size: 18px;
      padding: 4px 10px;
    }

    .cal-title {
      margin: 0 6px;
      min-width: 170px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .cal-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 0 0 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .chip-check .chip {
      display: inline-block;
    }

    .cal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .cal-head {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .cal-head span {
      padding: 9px 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .cal-body {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .cal-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      min-height: 112px;
      min-width: 0;
      padding: 6px;
      margin: 0;
      text-align: left;
      background: var(--surface);
      border: 0;
      border-right: 1px solid var(--line-2);
      border-bottom: 1px solid var(--line-2);
      border-radius: 0;
      cursor: pointer;
      color: var(--ink);
    }

    .cal-cell:nth-child(7n) {
      border-right: 0;
    }

    .cal-empty {
      cursor: default;
      background: #FAFBFD;
    }

    button.cal-cell:hover {
      background: #F5F9FF;
    }

    .cal-cell.weekend {
      background: #F8FAFC;
    }

    .cal-cell.selected {
      box-shadow: inset 0 0 0 2px var(--brand);
    }

    .cal-num {
      align-self: flex-start;
      font-size: 13px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .cal-cell.weekend .cal-num {
      color: var(--ink-3);
    }

    .cal-cell.holiday .cal-num {
      color: var(--red);
    }

    .cal-cell.today .cal-num {
      background: var(--brand);
      color: #fff;
    }

    .cal-hol {
      font-size: 11px;
      line-height: 1.25;
      color: var(--red);
      font-weight: 600;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .cal-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .cal-dot {
      display: none;
    }

    .more {
      font-size: 11px;
      color: var(--ink-3);
      padding-left: 3px;
      font-weight: 600;
    }

    .chip {
      display: block;
      padding: 2px 6px;
      border-radius: 4px;
      border-left: 3px solid;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-ev {
      background: var(--navy);
      border-left-color: #091829;
      color: #fff;
    }

    .chip-int {
      background: #F1F5F9;
      border-left-color: #64748B;
      color: var(--ink);
    }

    .chip-kmk {
      background: var(--brand-soft);
      border-left-color: var(--brand);
      color: #1E40AF;
    }

    .chip-pub {
      background: var(--green-soft);
      border-left-color: var(--green-mark);
      color: var(--green);
    }

    .chip-mat {
      background: var(--amber-soft);
      border-left-color: var(--amber-mark);
      color: var(--amber);
    }

    .chip-done {
      opacity: .55;
      text-decoration: line-through;
    }

    .day-panel {
      margin-top: 16px;
    }

    .holiday-line {
      color: var(--red);
      font-weight: 600;
    }

    .day-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .day-list li {
      padding: 9px 0;
      border-top: 1px solid var(--line-2);
    }

    .day-list li:first-child {
      border-top: 0;
    }

    .day-list .chip {
      display: inline-block;
      vertical-align: 1px;
      margin-right: 6px;
    }

    /* ------------------------------------------------------------------ */
    /* RAB */

    .rab-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .rab-head-main {
      flex: 1;
      min-width: 260px;
    }

    .rab-head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-input {
      width: 100%;
      max-width: 680px;
      margin: 0 0 4px -8px;
      padding: 4px 8px;
      border: 1px solid transparent !important;
      border-radius: var(--radius-sm);
      background: transparent !important;
      font-size: 20px !important;
      font-weight: 700;
    }

    .title-input:hover {
      border-color: var(--line) !important;
    }

    .title-input:focus {
      border-color: var(--brand) !important;
      background: #fff !important;
    }

    .rab-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 324px;
      gap: 18px;
      align-items: start;
    }

    .rab-form {
      min-width: 0;
    }

    .rab-check {
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .table-input th,
    .table-input td {
      padding: 6px 5px;
      vertical-align: middle;
    }

    .table-input input,
    .table-input select {
      width: 100%;
      min-height: 32px;
      padding: 4px 7px;
      font-size: 13px;
    }

    .table-input tbody th {
      font-weight: 600;
      color: var(--ink);
      background: none;
      white-space: nowrap;
      text-transform: none;
      letter-spacing: 0;
      font-size: 13.5px;
    }

    .table-rab td {
      vertical-align: top;
    }

    .table-rab .num {
      padding-top: 12px;
    }

    .cell-label {
      min-width: 140px;
    }

    .pair {
      display: flex;
      gap: 4px;
    }

    .table-input .in-n {
      width: 58px;
    }

    .table-input .in-u {
      width: 58px;
      padding: 4px 5px;
    }

    .table-input .in-kind {
      width: 118px;
    }

    .table-input .in-sm {
      width: 76px;
    }

    .table-input .in-money {
      width: 108px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .qty-mode {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--ink-2);
      white-space: nowrap;
      cursor: pointer;
    }

    .table-input .qty-mode input {
      width: 13px;
      height: 13px;
      min-height: 0;
      padding: 0;
    }

    .sec-total {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--navy);
    }

    .sec-empty {
      margin: 0 0 8px;
    }

    .rab-sec .btn-ghost {
      margin-top: 8px;
      margin-left: -10px;
    }

    .ch-hero {
      margin-bottom: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .ch-hero.ok {
      background: var(--green-soft);
      border-color: var(--green-line);
    }

    .ch-hero.bad {
      background: var(--red-soft);
      border-color: var(--red-line);
    }

    .ch-label {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .ch-value {
      margin: 2px 0;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .ch-hero.ok .ch-value {
      color: var(--green);
    }

    .ch-hero.bad .ch-value {
      color: var(--red);
    }

    .ch-verdict {
      margin: 0;
      font-size: 13px;
    }

    .ch-rows {
      margin: 0 0 6px;
    }

    .ch-rows div {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line-2);
    }

    .ch-rows dt {
      font-size: 13px;
      color: var(--ink-2);
    }

    .ch-rows dd {
      margin: 0;
      text-align: right;
      white-space: nowrap;
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }

    .ch-rows .strong dt {
      color: var(--ink);
      font-weight: 600;
    }

    .ch-rows .strong dd {
      font-weight: 700;
    }

    .ch-sub {
      margin: 16px 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .ch-note {
      margin-top: 10px;
    }

    /* Pengaturan */
    .rule-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-2);
    }

    .rule-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      font-size: 13.5px;
      color: var(--ink);
      font-weight: 500;
    }

    .rule-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rule-input input {
      width: 82px;
    }

    .rule-sum {
      margin: 14px 0 0;
    }

    /* Dialog, Pencarian Cepat & Toast */
    .dlg {
      width: min(520px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    .dlg::backdrop {
      background: rgba(15, 23, 42, .5);
      backdrop-filter: blur(2px);
    }

    .dlg form {
      padding: 20px 22px;
    }

    .dlg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dlg-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .dlg-x {
      border: 0;
      background: transparent;
      font-size: 22px;
      line-height: 1;
      color: var(--ink-3);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .dlg-x:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    .dlg-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dlg-body p {
      margin: 0;
    }

    .dlg-lead {
      font-weight: 700;
      color: var(--navy);
    }

    .dlg-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .qs-list {
      list-style: none;
      margin: 6px 0 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    .qs-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line-2);
      color: var(--ink);
      text-decoration: none;
    }

    .qs-list li:last-child a {
      border-bottom: 0;
    }

    .qs-list a:hover {
      background: var(--brand-soft);
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 300;
      max-width: calc(100vw - 32px);
      padding: 11px 18px;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast-error {
      background: var(--red);
    }

    .toast-ok {
      background: var(--green);
    }

    /* Batch Picker Bar (Pelaksanaan, Evaluasi, Materi, Kehadiran, Laporan) */
    .batch-picker-bar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .batch-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .batch-picker-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 380px;
    }

    .batch-picker-select-wrap select {
      flex: 1 1 auto;
      font-weight: 600;
      color: var(--navy);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    .batch-picker-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .batch-picker-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
    }

    .batch-picker-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px dashed var(--line-2);
    }

    .btn-subnav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      color: var(--ink-2);
      background: var(--surface-2);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all .15s ease;
    }

    .btn-subnav:hover {
      background: var(--brand-soft);
      color: var(--brand);
      text-decoration: none;
    }

    .btn-subnav.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn-subnav.active .ico {
      stroke: #fff;
    }

    /* ------------------------------------------------------------------ */
    /* Responsif */

    @media (max-width: 1200px) {
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .guide-steps {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split,
      .rab-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .rab-check {
        position: static;
        max-height: none;
        order: -1;
      }
    }

    @media (max-width: 1000px) {
      .detail-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        width: var(--sidebar-w) !important;
      }

      body.nav-open .sidebar {
        transform: none;
        box-shadow: 0 0 40px rgba(0, 0, 0, .35);
      }

      body.nav-open .nav-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(15, 23, 42, .45);
      }

      body.sb-collapsed .brand-text,
      body.sb-collapsed .nav-group-label,
      body.sb-collapsed .nav-label,
      body.sb-collapsed .nav-count,
      body.sb-collapsed .sidebar-foot {
        display: block;
      }

      body.sb-collapsed .nav a {
        justify-content: flex-start;
        padding: 9px 11px;
      }

      .shell,
      body.sb-collapsed .shell {
        margin-left: 0;
      }

      .menu-btn {
        display: inline-flex;
      }

      #sb-toggle {
        display: none;
      }

      .topbar {
        flex-wrap: wrap;
        padding: 10px 16px;
        gap: 8px 10px;
      }

      .global-note {
        padding: 8px 16px;
      }

      .main {
        padding: 16px 14px 48px;
      }

      .rule-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .detail-head {
        flex-direction: column;
      }

      .detail-status {
        align-items: flex-start;
        flex-direction: row;
      }
    }

    @media (max-width: 760px) {

      .kpi-grid,
      .guide-steps {
        grid-template-columns: minmax(0, 1fr);
      }

      .cal-cell {
        min-height: 58px;
        padding: 4px;
      }

      .cal-items,
      .cal-hol {
        display: none;
      }

      .cal-dot {
        display: block;
        position: absolute;
        right: 4px;
        bottom: 4px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 11px;
        font-weight: 700;
        line-height: 16px;
      }

      .cal-cell.holiday {
        background: var(--red-soft);
      }

      .filters .field-inline {
        flex: 1 1 140px;
        min-width: 0;
      }

      .checklist li {
        grid-template-columns: 44px minmax(0, 1fr);
      }

      .checklist .cl-st {
        grid-column: 2;
        white-space: normal;
      }

      .check-grid {
        grid-template-columns: 1fr;
      }

      .board {
        grid-auto-columns: minmax(250px, 86%);
      }

      .search-trigger .kbd {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .tl-label {
        display: none;
      }

      .tl-area {
        height: 96px;
      }

      .win-list li {
        grid-template-columns: minmax(0, 1fr) 70px 58px;
      }

      .panel {
        padding: 14px;
      }

      .report-doc {
        padding: 18px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    @media print {

      .sidebar,
      .topbar,
      .nav-scrim,
      .toast,
      .btn,
      .filters,
      .tabs,
      .subpills,
      .crumbs,
      .no-print {
        display: none !important;
      }

      .shell {
        margin: 0 !important;
      }

      .main {
        padding: 0 !important;
        max-width: none !important;
      }

      .panel,
      .report-doc {
        border: 0;
        box-shadow: none;
        break-inside: avoid;
      }
    }


    /* ================================================================== */
    /* TEMA NURSETINGLE — teal + oranye, lembut, ramah, tidak "ngeri"      */
    /* ================================================================== */
    :root {
      --bg: #F0FDFA;
      --surface-2: #F7FEFC;
      --surface-3: #E6FAF5;
      --line: #D5F0EA;
      --line-2: #E7F7F3;
      --navy: #0F172A;
      --navy-2: #134E4A;
      --navy-soft: #E6FAF5;
      --brand: #0D9488;
      --brand-hover: #0F766E;
      --brand-soft: #CCFBF1;
      --link: #0F766E;
      --focus: #14B8A6;
      --orange: #F59E0B;
      --orange-2: #E8890B;
      --orange-soft: #FEF3C7;
      --red: #E11D48;
      --red-soft: #FFF1F2;
      --red-line: #FECDD3;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 2px 6px rgba(13, 148, 136, .06), 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-md: 0 18px 40px rgba(13, 148, 136, .16);
      --font: "Plus Jakarta Sans", "Poppins", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #ECFDF8 0%, #F7FEFC 340px, #FFFFFF 100%) fixed;
    }

    /* Sidebar putih bersih seperti navbar Nursetingle */
    .sidebar {
      background: #FFFFFF !important;
      border-right: 1px solid var(--line);
      box-shadow: 4px 0 24px rgba(13, 148, 136, .06);
    }

    .brand {
      border-bottom: 1px solid var(--line-2) !important;
    }

    .brand-mark {
      background: linear-gradient(135deg, #14B8A6, #0D9488) !important;
      color: #fff !important;
      border-radius: 50% !important;
      box-shadow: 0 0 0 4px #CCFBF1;
    }

    .brand-name {
      color: #0D9488 !important;
      font-weight: 800 !important;
    }

    .brand-sub {
      color: #64748B !important;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 10.5px !important;
      font-weight: 700;
    }

    .nav-group-label {
      color: #94A3B8 !important;
    }

    .nav a {
      color: #334155 !important;
      border-radius: 999px !important;
      font-weight: 600;
    }

    .nav a .ico {
      color: #14B8A6;
    }

    .nav a:hover {
      background: #E6FAF5 !important;
      color: #0F766E !important;
    }

    .nav a.active {
      background: linear-gradient(135deg, #14B8A6, #0D9488) !important;
      color: #fff !important;
      box-shadow: 0 6px 16px rgba(13, 148, 136, .25);
    }

    .nav a.active .ico {
      color: #fff;
    }

    .nav-count {
      background: var(--orange) !important;
      color: #fff !important;
    }

    body.sb-collapsed .nt-badge-utama {
      display: none;
    }

    .sidebar-foot {
      color: #64748B !important;
      border-top: 1px solid var(--line-2) !important;
    }

    /* Topbar */
    .topbar {
      background: rgba(255, 255, 255, .92) !important;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line) !important;
    }

    .page-title {
      color: var(--navy) !important;
      font-weight: 800 !important;
    }

    .search-trigger,
    .icon-toggle {
      border-radius: 999px !important;
    }

    /* Tombol pil */
    .btn {
      border-radius: 999px !important;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, #FBBF24, #F59E0B) !important;
      border-color: #F59E0B !important;
      color: #1F2937 !important;
      box-shadow: 0 8px 18px rgba(245, 158, 11, .28) !important;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #F59E0B, #E8890B) !important;
      color: #111827 !important;
    }

    .btn-ghost,
    .btn:not(.btn-primary) {
      border-color: #99F6E4;
      color: #0F766E;
      background: #fff;
    }

    .btn:not(.btn-primary):hover {
      background: #E6FAF5;
    }

    /* Kartu & panel membulat lembut */
    .panel,
    .kpi,
    .today-head,
    .guide-box,
    .batch-picker-bar,
    .kc,
    .card {
      border-radius: var(--radius) !important;
      border-color: var(--line) !important;
      box-shadow: var(--shadow-sm);
    }

    .panel-title,
    h2,
    h3 {
      color: var(--navy);
    }

    .kpi {
      border-top-width: 0 !important;
      position: relative;
      overflow: hidden;
    }

    .kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: #14B8A6;
    }

    .kpi-red::before {
      background: #F87171;
    }

    .kpi-amber::before {
      background: #F59E0B;
    }

    .kpi-blue::before {
      background: #14B8A6;
    }

    .kpi-green::before {
      background: #34D399;
    }

    .kpi-blue .kpi-val {
      color: #0D9488 !important;
    }

    .guide-box {
      background: linear-gradient(135deg, #FFFFFF, #F0FDFA) !important;
    }

    .gstep {
      border-radius: 14px !important;
    }

    .gstep-num {
      background: #F59E0B !important;
      color: #fff !important;
    }

    .tabs a,
    .subpills button,
    .btn-subnav,
    .chip,
    .badge {
      border-radius: 999px !important;
    }

    .tabs a.active,
    .btn-subnav.active {
      background: #0D9488 !important;
      border-color: #0D9488 !important;
    }

    .subpills button.active {
      background: #0D9488 !important;
      border-color: #0D9488 !important;
    }

    /* ---------- Hero ala Nursetingle ---------- */
    .nt-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 28px;
      align-items: center;
      padding: 30px 32px;
      margin-bottom: 22px;
      border-radius: 26px;
      background: radial-gradient(circle at 90% 10%, #CCFBF1 0, transparent 45%), linear-gradient(135deg, #FFFFFF 0%, #F0FDFA 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .nt-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #CCFBF1;
      color: #0F766E;
      font-size: 12.5px;
      font-weight: 700;
    }

    .nt-title {
      margin: 14px 0 10px;
      font-size: clamp(24px, 3.2vw, 38px);
      font-weight: 800;
      line-height: 1.18;
      color: #0F172A;
      letter-spacing: -.02em;
    }

    .nt-title .t {
      color: #14B8A6;
    }

    .nt-title .o {
      color: #E8890B;
    }

    .nt-lead {
      color: #475569;
      font-size: 15px;
      max-width: 560px;
    }

    .nt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 14px;
    }

    .nt-actions .btn {
      padding: 11px 20px;
      font-size: 14px;
    }

    .nt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nt-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: #334155;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .nt-chip:hover {
      border-color: #14B8A6;
      color: #0F766E;
      text-decoration: none;
    }

    .nt-chip .ico {
      color: #14B8A6;
      width: 14px;
      height: 14px;
    }

    .nt-art {
      background: #fff;
      border-radius: 24px;
      padding: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 48px rgba(13, 148, 136, .15);
    }

    .nt-art img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      background: #F0FDFA;
    }

    /* Banner bergambar di halaman modul */
    .nt-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
      gap: 20px;
      align-items: center;
      padding: 22px 26px;
      margin-bottom: 20px;
      border-radius: 22px;
      background: radial-gradient(circle at 90% 10%, #CCFBF1 0, transparent 50%), linear-gradient(135deg, #FFFFFF 0%, #ECFDF8 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .nt-banner h2 {
      margin: 8px 0 6px;
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
    }

    .nt-banner h2 .t {
      color: #14B8A6;
    }

    .nt-banner h2 .o {
      color: #E8890B;
    }

    .nt-banner p {
      color: #475569;
      margin: 0;
    }

    .nt-banner img {
      width: 100%;
      border-radius: 16px;
      background: #F0FDFA;
      border: 1px solid var(--line);
    }

    /* Lencana UTAMA kuning ala navbar Nursetingle */
    .nt-badge-utama {
      display: inline-block;
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 999px;
      background: #FEF08A;
      color: #854D0E;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.4;
    }

    .nav a.active .nt-badge-utama {
      background: #FEF08A;
      color: #854D0E;
    }

    /* Tombol CTA hijau ala tombol Pesan via WA di topbar */
    .nt-cta-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #10B981;
      color: #FFFFFF !important;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, .24);
      white-space: nowrap;
      transition: background .15s, transform .15s;
    }

    .nt-cta-top:hover {
      background: #059669;
      text-decoration: none;
      transform: translateY(-1px);
      color: #FFFFFF !important;
    }

    .nt-cta-top .ico {
      width: 15px;
      height: 15px;
      color: #FFFFFF;
    }

    /* Peringatan / terlambat lembut "ora ngederi" (soft coral/rose) */
    .kpi-red .kpi-val {
      color: #E11D48 !important;
    }

    .badge-terlambat,
    .badge-galat,
    .badge-rusak,
    .badge-tidak_lulus {
      background: #FFF1F2 !important;
      color: #E11D48 !important;
      border-color: #FECDD3 !important;
    }

    .notice-error {
      background: #FFF1F2 !important;
      border-color: #FECDD3 !important;
      border-left-color: #FB7185 !important;
      color: #9F1239 !important;
    }

    .finding-galat {
      background: #FFF1F2 !important;
      border-color: #FECDD3 !important;
      color: #9F1239 !important;
    }

    .num-bad {
      color: #E11D48 !important;
    }

    /* Thumbnail kartu katalog batch */
    .bcard {
      overflow: hidden;
      border-radius: 20px !important;
      border-color: var(--line) !important;
      background: #FFFFFF;
    }

    .nt-card-thumb {
      margin: -14px -16px 12px;
      padding: 10px 14px;
      background: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 100%);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nt-card-thumb img {
      width: 68px;
      height: 50px;
      object-fit: cover;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid var(--line);
    }

    .nt-card-thumb-tag {
      font-size: 11px;
      font-weight: 700;
      color: #0F766E;
      background: #FFFFFF;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    /* Kartu modul bergambar di Beranda */
    .nt-modgrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .nt-modgrid-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .nt-mod {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: transform .15s, box-shadow .15s;
    }

    .nt-mod:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      text-decoration: none;
    }

    .nt-mod img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #F0FDFA;
    }

    .nt-mod div {
      padding: 12px 14px 16px;
    }

    .nt-mod strong {
      display: block;
      color: #0F172A;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .nt-mod span {
      color: #64748B;
      font-size: 12.5px;
    }

    .nt-section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 6px 0 12px;
      color: #0F172A;
    }

    .nt-section-title .t {
      color: #14B8A6;
    }

    /* ---------- To-Do List Kerjaan Tim ---------- */
    .todo-add-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .todo-add-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
    }

    .home-todo-quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .home-todo-quick input[type="text"] {
      flex: 1 1 200px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      background: #F7FEFC;
    }

    .home-todo-quick select {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      background: #fff;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-list-compact {
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: #F7FEFC;
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: border-color .15s, background .15s;
    }

    .todo-item:hover {
      border-color: #14B8A6;
      background: #FFFFFF;
    }

    .todo-item.is-urgent {
      border-left: 4px solid #F59E0B;
      background: #FFFDF7;
    }

    .todo-item.is-done {
      opacity: .68;
      background: #F8FAFC;
    }

    .todo-item.is-done .todo-title {
      text-decoration: line-through;
      color: #64748B;
    }

    .todo-check {
      flex: none;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      border-radius: 50%;
      border: 2px solid #14B8A6;
      background: #FFFFFF;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all .15s;
    }

    .todo-check:hover {
      background: #CCFBF1;
    }

    .todo-item.is-done .todo-check {
      background: #14B8A6;
      border-color: #0D9488;
    }

    .todo-check .ico {
      width: 14px;
      height: 14px;
      color: #FFFFFF;
    }

    .todo-body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .todo-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .todo-title {
